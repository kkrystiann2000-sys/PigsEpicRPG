/* How long a status lasts on this target (min 1 round, never 0). */
DATA.effectTurns = function (side, id, kind, turns) {
  if (!turns) return 0;
  const chart = (DATA.effectCharts[side] || {})[id] || {};
  const mul = chart[kind] == null ? 1 : chart[kind];
  return Math.max(1, Math.round(turns * mul));
};

/* "Weak to 💫 stun ×1.5 · resists 🔥 burn ×0.5" for tooltips. */
DATA.resistLine = function (side, id) {
  const chart = (DATA.effectCharts[side] || {})[id] || {};
  const weak = Object.keys(chart).filter((k) => chart[k] >= 1.2).sort((a, b) => chart[b] - chart[a]);
  const res = Object.keys(chart).filter((k) => chart[k] <= 0.85).sort((a, b) => chart[a] - chart[b]);
  const bits = [];
  if (weak.length) bits.push(`weak to ${weak.map((k) => `${DATA.effectNames[k]} ×${chart[k]}`).join(', ')}`);
  if (res.length) bits.push(`resists ${res.map((k) => `${DATA.effectNames[k]} ×${chart[k]}`).join(', ')}`);
  return bits.length ? bits.join(' · ') : 'no special status resistances';
};

/* Hover tooltip markup: name, HP, what it does, weakness. */
DATA.heroTip = function (h) {
  const def = h.def || h;
  const abil = (h.abilities || def.abilities || [])
    .map((a) => `<li><b>${a.icon || ''} ${a.name}</b><span>${a.desc || ''}</span></li>`)
    .join('');
  const shield = h.shield > 0 ? ` · 🛡 ${Math.round(h.shield)}% less damage` + (h.shieldTurns ? ` (${h.shieldTurns})` : '') : '';
  const hp = (h.maxHp ? `HP ${Math.max(0, Math.round(h.hp))}/${h.maxHp}` : `HP ${def.baseHp}`) + shield;
  const relic = h.relic ? DATA.relicById(h.relic) : null;
  return `<div class="tt-name">${def.name}</div>
    <div class="tt-meta">${def.role}${h.level ? ` · Lv ${h.level}` : ''} · ${hp}</div>
    ${relic ? `<div class="tt-relic">💎 ${relic.name} · ${relic.skin} skin</div>` : ''}
    <ul class="tt-list">${abil}</ul>
    <div class="tt-weak"><b>Weakness</b> ${DATA.weakHero[def.id] || '—'}</div>
    <div class="tt-effects">${DATA.resistLine('heroes', def.id)}</div>`;
};

/* What every status a bird move carries actually does to the pig, spelled out
   for the bird card and the hover tooltip instead of a bare verb. */
DATA.moveEffects = function (m) {
  const turns = (v) => (v && typeof v === 'object' ? (v.turns || 1) : v);
  const r = (n) => n + (n === 1 ? ' round' : ' rounds');
  const out = [];
  if (m.stun) out.push(`💫 stun ${r(turns(m.stun))} — the pig loses its turn`);
  if (m.weaken) out.push(`🦴 weaken ${r(turns(m.weaken))} — the flock deals 30% less damage`);
  if (m.silence) out.push(`🤐 silence ${r(turns(m.silence))} — the pig cannot use special moves`);
  if (m.poison) out.push(`☠️ poison ${r(turns(m.poison))} — the pig loses 6% of its max HP each round`);
  if (m.freeze) out.push(`🧊 freeze ${r(turns(m.freeze))} — the pig loses a turn and takes 25% more damage`);
  if (m.drench) out.push(`🌊 drench ${r(turns(m.drench))} — shields are washed off and the pig takes 20% more damage`);
  if (m.pepperDry) out.push(`🧂 pepper numb ${r(turns(m.pepperDry))} — the pig builds no pepper charge`);
  if (m.burn) out.push(`🔥 burn ${r(turns(m.burn))} — the pig takes fire damage at the start of the flock's turn`);
  if (m.mire) out.push(`🕳️ mire ${r(turns(m.mire))} — 100% of the pig's healing is stolen by the flock and split among its birds`);
  if (m.expose) out.push(`🩸 expose ${r(turns(m.expose))} — the pig takes 25% more damage`);
  if (m.dodge) out.push(`💨 dodge — the next ${m.dodge} hit${m.dodge === 1 ? '' : 's'} miss`);
  if (m.rage) out.push(`🔥 +${Math.round(m.rage * 100)}% damage for ${r(turns(m.rageTurns || 3))}`);
  if (m.shieldBirds) out.push(`🛡 the whole flock takes ${Math.round(m.shieldBirds * 100)}% less damage for 2 rounds`);
  if (m.leech) out.push(`🩸 lifesteal — heals the bird for ${Math.round(m.leech * 100)}% of the damage it deals`);
  if (m.stealPepper) out.push(`🌶 steals ${m.stealPepper} pepper charge from the squad's meter`);
  return out;
};

/* A bird's ATK on the road you are walking: the same per-level growth and
   world step the level table builds, so the compendium can quote a real number
   instead of a bare percentage. */
DATA.birdAtkFor = function (tpl, level, world) {
  if (!tpl) return 0;
  const l = Math.max(1, Math.round(level || 1));
  const w = Math.max(1, Math.round(world || 1));
  const tune = (DATA.tuning && DATA.tuning.enemyAtk) || 1;
  return Math.round(tpl.atk * Math.pow(1.022, l - 1) * (1 + (w - 1) * 0.08) * tune * 10) / 10;
};

/* Bird attacks quote the wound they leave, not a share of an invisible stat:
   each "% of its damage" in the hand-written line is swapped for the number
   that bird actually takes off a pig at its current attack power. */
DATA.birdMoveText = function (m, atk) {
  const base = String((m && m.desc) || '');
  if (!(atk > 0) || !base) return base;
  return base.replace(/(\d+(?:\.\d+)?)% of its damage/g,
    (_, p) => Math.max(1, Math.round(atk * Number(p) / 100)) + ' damage');
};

DATA.enemyTip = function (e) {
  const tpl = e.tpl || e;
  const key = e.key || DATA.enemyKey(tpl);
  const how = (m) => (m.kind === 'healAlly' ? 'heals a bird'
    : m.kind === 'shieldAll' ? 'shields the flock'
      : m.kind === 'summon' ? 'calls reinforcements'
        : m.kind === 'focus' ? 'marks one pig for the whole flock'
          : m.kind === 'charge' ? 'winds up, then hits hard'
            : m.kind === 'aoe' ? (m.targetCount ? `hits ${m.targetCount} pigs` : 'hits everyone')
              : m.kind === 'multi' ? `hits ${m.hits || 2} times`
                : m.kind === 'self' ? (m.rage ? `works itself up: +${Math.round(m.rage * 100)}% damage for ${m.rageTurns || 3} rounds`
                  : m.shieldBirds ? `wards the whole flock: ${Math.round(m.shieldBirds * 100)}% less damage for 2 rounds`
                  : m.power ? `frenzies: every hit deals +${m.power} for ${m.powerTurns || 3} rounds`
                  : m.veil ? `blurs out of phase: 80% of attacks miss for ${m.veil} rounds`
                    : m.dodge ? `the next ${m.dodge} hits miss`
                      : 'buffs itself')
                  : 'hits one pig');
  const fx = (m) => DATA.moveEffects(m).join(' · ');
  /* The live bird's attack if the tooltip is opened mid-fight, otherwise the
     attack it would have on this road. Every attack prints a wound. */
  const atkLive = Math.max(1, Math.round(e.atk != null ? e.atk : (DATA.birdAtkFor(tpl, (e.level || 1), (e.world || 1)) || tpl.atk)));
  const damage = (m, body) => {
    if (!m.mult || /\d+\s*damage/.test(body || '')) return '';
    const spread = m.kind === 'multi' ? ' per hit' : (m.kind === 'aoe' || (m.kind === 'charge' && m.all)) ? ' to each pig' : '';
    return ` · ${Math.max(1, Math.round(atkLive * m.mult))} damage${spread}`;
  };
  /* Specials that need a charge show their icon, and how many rounds they take. */
  const moves = (tpl.moves || []).map((m) => {
    const body = DATA.birdMoveText(m, atkLive) || how(m);
    return `<li><b>${m.icon ? m.icon + ' ' : ''}${m.name}</b><span>${body}${damage(m, body)}${m.cd ? ` · charge ${m.cd}` : ''}${fx(m) ? ` · ${fx(m)}` : ''}</span></li>`;
  }).join('');
  const shield = e.shield > 0 ? ` · 🛡 ${Math.round(e.shield)}% less damage` + (e.shieldTurns ? ` (${e.shieldTurns})` : '') : '';
  const hp = (e.maxHp ? `HP ${Math.max(0, Math.round(e.hp))}/${e.maxHp}` : `HP ${tpl.hp}`) + shield;
  const atk = `deals ${atkLive}`;
  /* Two different kinds of evasion: a trait that simply dodges (never a buff)
     and charges from a dodge move (removed by cleansing damage). */
  const passiveDodge = tpl.flying ? '💨 passive evade 20% — not a buff, cleansing cannot remove it' : '';
  const dodgeCharges = e.dodgeCharge > 0 ? `💨 ${e.dodgeCharge} dodge charge${e.dodgeCharge === 1 ? '' : 's'} — cleansing damage deletes these` : '';
  const guard = tpl.halfAt ? `🛡️ knight's guard — hits under ${tpl.halfAt} deal half damage` : '';
  const mirror = tpl.reflect ? `🪞 mirror — returns ${Math.round(tpl.reflect * 100)}% of the wound it takes to the pig that dealt it` : '';
  const pack = tpl.packAtk ? `🎵 pack song — +${Math.round(tpl.packAtk * 100)}% damage for every living bird (itself included)` : '';
  const berserk = tpl.berserk ? `🔥 berserk — below 35% HP it deals +${Math.round(tpl.berserk * 100)}% damage` : '';
  const passives = [passiveDodge, dodgeCharges, guard, mirror, pack, berserk].filter(Boolean);
  const dodgeLine = passives.length ? `<div class="tt-effects">${passives.join(' · ')}</div>` : '';
  return `<div class="tt-name">${tpl.name}</div>
    <div class="tt-meta">${hp} · ${atk}${tpl.armor ? ` · ${Math.round(tpl.armor * 100)}% armour` : ''}</div>
    <div class="tt-trait">${DATA.birdMoveText({ desc: tpl.trait }, atkLive) || ''}</div>
    ${dodgeLine}
    <ul class="tt-list">${moves}</ul>
    <div class="tt-weak"><b>Weakness</b> ${(key && DATA.weak[key]) || 'Focus it down.'}</div>
    <div class="tt-effects">${DATA.resistLine('birds', key)}</div>`;
};

DATA.enemyKey = function (tpl) {
  const keys = Object.keys(DATA.enemies);
  return keys.find((k) => DATA.enemies[k] === tpl) || null;
};

/* Map tile labels are generated after the road numbers are assigned: the main
   road is numbered 1..N in every world, and side roads hang lettered off the
   main stop they branch from. */
DATA.labels = {};

/* Turn the compact level table into full level objects. */
DATA.levels = {};
DATA._levelRows.forEach((row, idx) => {
  const worldLevels = DATA._levelRows.filter((r) => r.world === row.world);
  const order = worldLevels.indexOf(row) + 1;
  const boss = !!row.boss;
  const elite = !!row.elite;
  const baseXp = row.world === 1 ? 34 : 128;
  const baseCoins = row.world === 1 ? 16 : 40;
  DATA.levels[row.id] = {
    id: row.id,
    world: row.world,
    order,
    worldSize: worldLevels.length,
    name: row.name,
    lore: row.lore,
    tip: row.tip || '',
    boss,
    mini: !!row.mini,
    elite,
    /* Birds are never capped: each level stacks ~4% HP and ~2% attack on top of
       the previous one, plus a step up per world, so the curve stays smooth
       while the pigs grow toward ~500 HP. */
    enemies: row.e.map(([t, hpMul, atkMul]) => ({
      t,
      hpMul: hpMul * Math.pow(1.04, order - 1) * (1 + (row.world - 1) * 0.1),
      atkMul: atkMul * Math.pow(1.022, order - 1) * (1 + (row.world - 1) * 0.08),
    })),
    xp: Math.round(baseXp + order * 11 + (boss ? 130 : 0) + (elite ? 45 : 0)),
    coins: Math.round(baseCoins + order * 3.5 + (boss ? 110 : 0) + (elite ? 45 : 0)),
    // deterministic herb drops (the data must not change between calls)
    herbs: boss ? 3 : elite ? 2 : order % 3 === 0 ? 1 : 0,
    firstClearCoins: boss ? 150 : 60,
  };
});

/* The main road, numbered per world. Side roads, caves and bosses keep no
   route number, so a wave count can follow the path the player is actually
   walking instead of a hidden table index. */
(function numberMainRoute() {
  const byWorld = {};
  Object.keys(DATA.levels).forEach((id) => {
    const lv = DATA.levels[id];
    const num = parseInt(String(lv.id).slice(1), 10) || 0;
    if (num >= 30 || lv.boss) return;
    (byWorld[lv.world] = byWorld[lv.world] || []).push(lv);
  });
  Object.keys(byWorld).forEach((w) => {
    byWorld[w].sort((a, b) => a.order - b.order).forEach((lv, i) => { lv.route = i + 1; });
  });
})();

/* Every level must be a little harder than the one before it. Authored
   lineups and wave counts do not naturally line up, so after the levels are
   built each one is nudged up until it clears the previous level by 1.5% on a
   combined bulk-and-bite score. Scaling is always upward and capped at 1.5x per
   level, so the authored feel of a fight survives the correction. */
function levelLadder() {
  const byWorld = {};
  Object.keys(DATA.levels).forEach((id) => {
    const lv = DATA.levels[id];
    (byWorld[lv.world] = byWorld[lv.world] || []).push(lv);
  });
  const scoreOf = (lv) => {
    const waves = DATA.wavesFor(lv);
    const waveHp = 1 + (waves - 1) * 0.08;
    const waveAtk = 1 + (waves - 1) * 0.055;
    let hp = 0;
    let atk = 0;
    lv.enemies.forEach((e) => {
      const tpl = DATA.enemies[e.t];
      hp += tpl.hp * e.hpMul;
      atk += tpl.atk * e.atkMul;
    });
    return Math.sqrt(hp * waveHp * atk * waveAtk * waves) * (lv.boss ? 1.12 : 1);
  };
  Object.keys(byWorld).forEach((w) => {
    const list = byWorld[w].sort((a, b) => a.order - b.order);
    let prev = 0;
    list.forEach((lv) => {
      /* Optional side content (numbered 30+) is not part of the main road, so
         it neither has to beat the level before it nor drag the curve. */
      if ((parseInt(String(lv.id).slice(1), 10) || 0) >= 30) return;
      /* Boss levels are hand-tuned (cutscene, phase, finale). The ladder would
         multiply the king by the whole difficulty gap and make him a wall. */
      if (lv.boss) return;
      const cur = scoreOf(lv);
      const target = prev * 1.005;
      if (cur < target) {
        const k = Math.min(6, target / cur);
        /* The score is a geometric mean of bulk and bite, so scaling both
           stats by k multiplies the score by exactly k. */
        const f = k;
        lv.enemies.forEach((e) => { e.hpMul *= f; e.atkMul *= f; });
      }
      prev = scoreOf(lv);
    });
  });
}

DATA.levelOrder = DATA._levelRows.map((r) => r.id);

/* Number every world's road by walking it, not by the id it was authored with.
   The shortest road from the first stop to the boss is the main line (1..N);
   every other battle hangs off it as 5a, 5b, 12a and so on, so parallel roads
   never show raw ids like "20" or repeat a number. */
(function labelEveryRoad() {
  const labels = {};
  const letter = (n) => {
    let s = '';
    n += 1;
    while (n > 0) { const r = (n - 1) % 26; s = String.fromCharCode(97 + r) + s; n = Math.floor((n - 1) / 26); }
    return s;
  };
  DATA.worlds.forEach((world) => {
    const byId = {};
    world.nodes.forEach((n) => { byId[n.id] = n; });
    const adj = {};
    world.edges.forEach(([a, b]) => {
      (adj[a] = adj[a] || []).push(b);
      (adj[b] = adj[b] || []).push(a);
    });
    const battles = world.nodes.filter((n) => n.type === 'battle' && DATA.levels[n.id]);
    if (!battles.length) return;
    const start = world.nodes[0].id;
    const boss = (battles.find((n) => DATA.levels[n.id].boss) || battles[battles.length - 1]).id;
    const prev = { [start]: null };
    const queue = [start];
    while (queue.length) {
      const cur = queue.shift();
      if (cur === boss) break;
      (adj[cur] || []).forEach((next) => {
        if (!(next in prev)) { prev[next] = cur; queue.push(next); }
      });
    }
    if (!(boss in prev)) return;
    const mainPath = [];
    for (let cur = boss; cur; cur = prev[cur]) mainPath.unshift(cur);
    const mainSet = new Set(mainPath);
    let mainNo = 0;
    mainPath.forEach((id) => {
      const node = byId[id];
      if (node && node.type === 'battle' && DATA.levels[id]) labels[id] = String(++mainNo);
    });
    const seen = new Set();
    const used = {};
    battles.filter((n) => !labels[n.id]).forEach((startNode) => {
      if (seen.has(startNode.id)) return;
      const comp = [];
      const compQueue = [startNode.id];
      seen.add(startNode.id);
      while (compQueue.length) {
        const id = compQueue.shift();
        const node = byId[id];
        if (!node) continue;
        comp.push(node);
        (adj[id] || []).forEach((next) => {
          if (mainSet.has(next) || seen.has(next) || !byId[next]) return;
          seen.add(next);
          compQueue.push(next);
        });
      }
      let prefix = null;
      comp.forEach((node) => {
        (adj[node.id] || []).forEach((next) => {
          if (!mainSet.has(next) || !labels[next]) return;
          const n = parseInt(labels[next], 10);
          if (prefix == null || n < prefix) prefix = n;
        });
      });
      const head = prefix == null ? 'S' : String(prefix);
      const dist = {};
      const walk = [];
      comp.forEach((node) => {
        if ((adj[node.id] || []).some((next) => mainSet.has(next) && labels[next] === head)) {
          dist[node.id] = 0;
          walk.push(node.id);
        }
      });
      for (let i = 0; i < walk.length; i++) {
        const id = walk[i];
        (adj[id] || []).forEach((next) => {
          if (mainSet.has(next) || !byId[next] || next in dist) return;
          dist[next] = dist[id] + 1;
          walk.push(next);
        });
      }
      let slot = used[head] || 0;
      comp
        .filter((node) => node.type === 'battle' && DATA.levels[node.id])
        .sort((a, b) => (dist[a.id] == null ? 999 : dist[a.id]) - (dist[b.id] == null ? 999 : dist[b.id]))
        .forEach((node) => { labels[node.id] = head + letter(slot++); });
      used[head] = slot;
    });
  });
  DATA.labels = labels;
})();

/* ---------------- Key drops ----------------
   The first three elite fights in each world drop brass, silver and gold, so
   a world's own side doors can be opened without leaving it. The castle
   wardens drop their own copies of the same three keys. */
DATA.worlds.forEach(function (w) {

    .filter(function (n) { return n.type === 'battle' && DATA.levels[n.id] && DATA.levels[n.id].elite; })
    .sort(function (a, b) { return (DATA.levels[a.id].order || 0) - (DATA.levels[b.id].order || 0); });
  elites.forEach(function (n, i) {

  });
});

   quantities climb with the weapon's tier. Early weapons ask for 1–2 of each
   basic material; the top tier asks for 11–14 of each of three materials. */

DATA.anvilRecipeFor = function (base) {
  const basic = ['feather', 'ore', 'wood', 'eggshell', 'straw', 'cactus', 'sand'];
  const mid = basic.concat(['rime']);
  const all = mid.concat(['wool', 'coral', 'pearl']);
  const pools = [basic, basic, mid, mid, all, all];
  const starts = [1, 2, 4, 6, 8, 11];
  const spreads = [1, 1, 2, 2, 3, 4];
  const heroIndex = Math.floor(base / 24);
  const i = base % 24;
  const tier = Math.floor(i / 4);
  const slot = heroIndex * 4 + (i % 4);
  const pool = pools[tier];
  const triples = [];
  for (let a = 0; a < pool.length; a += 1) {
    for (let b = a + 1; b < pool.length; b += 1) {
      for (let c = b + 1; c < pool.length; c += 1) triples.push([pool[a], pool[b], pool[c]]);
    }
  }
  const triple = triples[slot];
  const start = starts[tier];
  const spread = spreads[tier];
  const mats = {};
  triple.forEach((key, idx) => {
    const qty = start + ((slot + idx) % spread);
    mats[key] = (mats[key] || 0) + qty;
  });
  return mats;
};

/* What a battle drops. Replays drop half, bosses and caves drop more. Each
   world also rolls its own two craft materials into the pool. */
DATA.rollDrops = function (level, replay) {
  const out = {};
  const base = level.boss ? 4 : level.elite ? 3 : 2;
  const n = replay ? Math.max(1, Math.round(base * 0.5)) : base;
  const pools = {
    1: ['feather', 'wood', 'wood', 'eggshell', 'straw'],
    2: ['feather', 'ore', 'wood', 'cactus', 'sand'],
    3: ['ore', 'ore', 'feather', 'wood', 'rime', 'wool'],
    4: ['ore', 'ore', 'wood', 'feather', 'coral', 'pearl'],
    5: ['ore', 'ore', 'wood', 'feather', 'rime', 'wool', 'coral', 'pearl'],
  };
  const pool = pools[Math.min(5, level.world || 1)] || pools[1];
  for (let i = 0; i < n; i++) {
    const k = pool[Math.floor(Math.random() * pool.length)];
    out[k] = (out[k] || 0) + 1;
  }
  return out;
};

/* Star thresholds: score = damage + healing assist + health left - damage taken */
DATA.scoreStars = function (enemyHp, partyHp, score) {
  const three = Math.round(enemyHp * 1.0 + partyHp * 2.7);
  const two = Math.round(enemyHp * 1.0 + partyHp * 1.5);
  if (score >= three) return 3;
  if (score >= two) return 2;
  return 1;
};

/* Global difficulty knobs. Everything that builds a bird multiplies through
   these, so the whole curve can be retuned without touching 90 level rows. */
/* The flock's global bite and bulk. Pigs gained more per level, so the birds
   were raised to match and then a little past it, keeping the road tense. */
DATA.tuning = { enemyHp: 1.5, enemyAtk: 1.42 };

/* ---------------- XP per bird ----------------
   A bird is worth XP for what it is, not for the map it stands on: chaff pays
   10, a proper fighter 15, a big one 20, a bruiser 40, a wall 100 and a boss a
   packet. The world it roosts in multiplies that, or the last world would pay
   the same pocket money as the first. */
DATA.xpPerBird = { small: 10, mid: 15, big: 20, brute: 40, tank: 100, boss: 500 };
DATA.xpWorldMul = { 1: 1, 2: 2, 3: 4, 4: 7, 5: 12 };
DATA.birdXp = function (key) {
  const t = DATA.enemies[key] || {};
  const w = DATA.birdWorld[key] || 1;
  let tier = 'small';
  if (t.boss) tier = 'boss';
  else if (t.big) tier = 'brute';
  else if (t.role === 'Tank') tier = 'tank';
  else if ((t.hp || 0) >= 190) tier = 'big';
  else if ((t.hp || 0) >= 130) tier = 'mid';
  return Math.round(DATA.xpPerBird[tier] * (DATA.xpWorldMul[w] || 1));
};

/* ---------------- Map compaction ----------------
   The worlds were strung out over a very long scroll. Pull the tiles closer on
   the Y axis (and scale the map height to match) so the boss is a short ride
   away, while keeping every route intact. Tiles render larger to compensate. */
DATA.mapScale = 0.82;
DATA.worlds.forEach((w) => {
  w.nodes.forEach((n) => { n.y = Math.round(n.y * DATA.mapScale); });
  w.mapH = Math.round((w.mapH || 2000) * DATA.mapScale);

  /* Squeezing the map vertically could push tiles into each other, so nudge
     neighbours apart until every pair has room. Edges follow their nodes, so
     the roads stay connected. */
  const MIN = 80;
  for (let pass = 0; pass < 120; pass++) {
    let moved = 0;
    for (let i = 0; i < w.nodes.length; i++) {
      for (let j = i + 1; j < w.nodes.length; j++) {
        const a = w.nodes[i];
        const b = w.nodes[j];
        let dx = b.x - a.x;
        let dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d >= MIN) continue;
        if (d < 0.001) { dx = 1; dy = 0; d = 1; }
        const push = (MIN - d) / 2 + 0.5;
        const ux = (dx / d) * push;
        const uy = (dy / d) * push;
        a.x -= ux; a.y -= uy;
        b.x += ux; b.y += uy;
        moved++;
      }
    }
    w.nodes.forEach((n) => {
      n.x = Math.round(Math.max(56, Math.min(664, n.x)));
      n.y = Math.round(Math.max(90, Math.min(w.mapH - 70, n.y)));
    });
    if (!moved) break;
  }
});

/* The grass starts around y 300, so any stop above that floated in the sky.
   Every map grows until its highest stop stands on ground: the road keeps its
   spacing, it just gets longer, and the horizon stays where it is. */
DATA.groundLine = 540;
DATA.worlds.forEach((w) => {
  const minY = Math.min.apply(null, w.nodes.map((n) => n.y));
  if (minY >= DATA.groundLine) return;
  const shift = DATA.groundLine - minY;
  w.nodes.forEach((n) => { n.y += shift; });
  w.mapH += shift;
});

/* ---------------- Waves ----------------
   Every level is fought in waves: one to three for a normal battle, five for a boss.
   A two-heavy patrol or a mini-boss pack gets a single longer wave instead.
   Waves change the flock, not its numbers: the level's own HP and ATK are fixed. */
/* wavesFor: waves per level. The opening road is one or two waves, the late
   road tops out at three, and bosses run five waves (the last king gets six). A patrol
   built around tanks, mini-bosses or big casters trades wave count for one
   longer, tougher fight instead of becoming a six-wave slog. */
DATA.wavesFor = function (level) {
  if (!level) return 1;
  /* A level can pin its own wave count. The dungeon uses this: one depth is
     one chamber, so a boss chamber is the boss, not four waves of escorts. */
  if (level.waves) return level.waves;

  /* Bosses run the whole five-wave finale, and the last world's king gets a
     sixth so the campaign ends bigger than it started. */
  if (level.boss) return level.world >= ((DATA.worlds || []).length || 5) ? 6 : 5;

  /* A heavy wall is a set-piece too: two or more genuinely huge birds in one
     line is a long fight, not a three-wave patrol. High late-game HP alone is
     not enough, or every road in the last world would collapse to one wave. */
  const heavy = (level.enemies || []).filter((e) => !!(DATA.enemies[e.t] || {}).big).length;

  /* Elite squads, mini-bosses, side roads and caves are a single long wave:
     they trade wave count for one tougher flock. */
  const num = parseInt(String(level.id).slice(1), 10) || 0;
  if (level.elite || level.mini || heavy >= 2 || num >= 30) return 1;

  /* The main road ramps: the opening fight is one wave, the next three are
     two, and every main level from the fifth on is a three-wave fight. */
  const route = level.route || 0;
  if (route <= 1) return 1;
  if (route <= 4) return 2;
  return 3;
};
levelLadder();

/* Side roads and caves are optional branches. They sit late in the row table
   but are reachable early, so they must read as "a fight near this point on the
   road", never as a spike. Each one is pulled to within 10% of the closest main
   level in its world. */
(function smoothSideLevels() {    const scoreOf = (lv) => {
    const waves = DATA.wavesFor(lv);
    let hp = 0;
    let atk = 0;
    lv.enemies.forEach((e) => {
      const tpl = DATA.enemies[e.t];
      hp += tpl.hp * e.hpMul;
      atk += tpl.atk * e.atkMul;
    });
    /* More waves mean more total birds, but each bird keeps the same stats. */
    return Math.sqrt(hp * atk * waves) * (lv.boss ? 1.12 : 1);
  };
  const byWorld = {};
  Object.keys(DATA.levels).forEach((id) => {
    const lv = DATA.levels[id];
    (byWorld[lv.world] = byWorld[lv.world] || []).push(lv);
  });
  Object.keys(byWorld).forEach((w) => {
    const all = byWorld[w].sort((a, b) => a.order - b.order);
    const isSide = (lv) => (parseInt(String(lv.id).slice(1), 10) || 0) >= 30;
    const main = all.filter((lv) => !isSide(lv));
    if (!main.length) return;
    all.filter(isSide).forEach((lv) => {
      const near = main.reduce((best, cand) => (Math.abs(cand.order - lv.order) < Math.abs(best.order - lv.order) ? cand : best), main[0]);
      const cap = scoreOf(near) * 1.1;
      const cur = scoreOf(lv);
      if (cur <= cap || cur <= 0) return;
      const k = Math.max(0.25, cap / cur);
      lv.enemies.forEach((e) => { e.hpMul *= k; e.atkMul *= k; });
    });
  });
})();

DATA.waveEntries = function (level, wave) {
  /* Waves rotate the flock; they never add hidden HP or ATK. The level row's
     multipliers are the only stat scaling, so a listed bird has the same
     numbers in every wave. */
  const base = level.enemies || [];
  const recruits = DATA.summonsByWorld[level.world || 1] || DATA.summonsByWorld[1];
  /* Every wave brings a different flock: the authored line rotates, and one
     non-boss slot is filled by a fresh recruit from this world's pool. Bosses
     keep their slot so the finale never loses its headliner. */
  const line = base.map((e, i) => {
    const tpl = DATA.enemies[e.t] || {};
    /* A boss is the finale, not a resident: it arrives with the last wave. */
    if (tpl.boss) return wave === DATA.wavesFor(level) ? e : null;
    if (wave === 1 || !recruits || !recruits.length) return e;
    if (i === (wave - 1) % base.length) {
      const key = recruits[(wave - 2 + i) % recruits.length];
      if (key && DATA.enemies[key] && key !== e.t) return { ...e, t: key };
    }
    return e;
  });
  const kept = line.filter(Boolean);
  return wave === 1 || !kept.length ? kept : kept.slice(wave % kept.length).concat(kept.slice(0, wave % kept.length));
};

/* Who a boss or a summoner can call in, per world. */
/* Wave recruits and summons come from the world you are standing in — never
   from anywhere else. The dungeon is the only mixed pool. */
DATA.summonsByWorld = {
  1: DATA.worldRoster[1].slice(),
  2: DATA.worldRoster[2].slice(),
  3: DATA.worldRoster[3].slice(),
  4: DATA.worldRoster[4].slice(),

  const pool = DATA.summonsByWorld[world] || DATA.summonsByWorld[1];
  return pool[Math.floor(Math.random() * pool.length)];
};

   Prices — the wheel pays double on its first spin of the day, so
   every coin sink carries a modest markup to match. Herb costs are
   left alone: herbs come from fights and chests, not the wheel.
   ---------------------------------------------------------------- */

(function () {
  const bump = (v) => Math.max(1, Math.round((v * DATA.priceMul) / 5) * 5);
  DATA.heroes.forEach((h) => {
    [h.weapon, h.helmet].forEach((slot) => {
      if (slot && Array.isArray(slot.cost)) slot.cost = slot.cost.map((c, i) => (i === 0 ? c : bump(c)));
    });
  });
  Object.keys(DATA.training).forEach((k) => {
    DATA.training[k].cost = DATA.training[k].cost.map(bump);

  Object.keys(DATA.potions).forEach((k) => {
    const potion = DATA.potions[k];
    if (potion.shop) potion.shop = bump(potion.shop);
    if (potion.coins) potion.coins = bump(potion.coins);
  });
  (DATA.blueprints || []).forEach((b) => {
    if (b.cost) b.cost = bump(b.cost);
    if (b.coins) b.coins = bump(b.coins);

  /* Brewing recipes: the list whose entries carry herbs + coins. */
  const brewKey = Object.keys(DATA).find((k) => Array.isArray(DATA[k]) && DATA[k].length

  if (brewKey) DATA[brewKey].forEach((r) => { if (r.coins) r.coins = bump(r.coins); });

})();

/* ---------------- Biome decoration ----------------
   Every level gets a backdrop: caverns read as caverns, the kingdom forests as
   forests, and the rest inherit their world's sky. */
Object.assign(ACH_STARS, { w5boss: 5, w5sweep: 5, keymaster: 3, mythic: 3, finale: 5 });
(function () {
  const cavey = /cave|burrow|den|hollow|vault|maw|gallery|deep|throat|pocket|cellar|echo|nest|stair|mine/i;
  const foresty = /forest|marsh|grove|wood|bramble|hedge|verge|clearing|thicket/i;
  const watery = /river|stream|ford|creek|lake|pool|well|sea|surf|wave|tide|dock|pier|bay/i;
  const stony = /ruin|tower|wall|keep|gate|bridge|fort|yard|court|hall|throne|stone/i;
  const coldy = /frost|snow|ice|glacier|peak|blizzard|chill/i;
  const sandy = /dune|sand|mesa|canyon|bluff|scorch|ember|forge|desert/i;

  /* Every world owns a pool of skies. Slot 0 is its signature look, the rest
     rotate in so a world's fights stop looking like one single room. */
  const POOLS = {
    1: ['meadow', 'forest', 'orchard', 'river', 'night'],
    2: ['canyon', 'mesa', 'ruins', 'cave', 'oasis'],
    3: ['snow', 'pines', 'ice', 'cave', 'aurora'],
    4: ['beach', 'lagoon', 'cliffs', 'storm', 'cave'],
    5: ['castle', 'forest', 'courtyard', 'throne', 'moonlit'],
  };

  const pending = Object.keys(DATA.levels).filter(function (id) { return !DATA.levels[id].biome; });
  const totals = {};
  pending.forEach(function (id) { const w = DATA.levels[id].world || 1; totals[w] = (totals[w] || 0) + 1; });

  const seen = {};
  const used = {};
  pending.forEach(function (id) {
    const lv = DATA.levels[id];
    const name = lv.name || '';
    const world = lv.world || 1;
    const pool = POOLS[world] || POOLS[1];
    const n = seen[world] = (seen[world] || 0) + 1;
    const tally = used[world] = used[world] || {};
    /* No single sky may eat more than its fair share of a world: hints dress
       the room, they do not take the world over. */
    const cap = Math.ceil((totals[world] || pool.length) / pool.length);

    let hint = '';
    if (cavey.test(name)) hint = world === 3 ? 'ice' : 'cave';
    else if (foresty.test(name)) hint = world === 3 ? 'pines' : 'forest';
    else if (watery.test(name)) hint = world === 4 ? 'lagoon' : 'river';
    else if (stony.test(name)) hint = world === 5 ? 'courtyard' : 'ruins';
    else if (coldy.test(name)) hint = 'snow';
    else if (sandy.test(name)) hint = world === 2 ? 'mesa' : 'canyon';

    const hintOk = hint && pool.indexOf(hint) >= 0 && (tally[hint] || 0) < cap;
    const pick = hintOk ? hint : pool[(n - 1) % pool.length];
    lv.biome = pick;
    tally[pick] = (tally[pick] || 0) + 1;

  /* The deepest junction becomes the keyed branch. */

  if (child && !DATA.levels[child.id]) {
    child.type = 'shop';
    child.relic = true;

  if (child) child.keyed = true;
});

/* ---------------- Power readout ----------------
   One readable rating for a pig and one for a flock, so the level preview can
   say how the fight looks without printing four-digit walls. HP and ATK carry
   the weight, and every source that feeds them (level, weapon, crafted helmet
   tier, forge, relic and training) is already baked into heroStats. Shields,
   heals and guard turns are folded in as effective HP so support pigs are not
   undervalued just because they hit softer.
   The flock figure adds every wave together: the squad has to survive them
   all, so comparing it with one wave alone made every fight look trivial. */
DATA.POWER = { hp: 0.08, atk: 1.0, support: 0.6, hero: 1.08, flock: 1.05 };

/* What a pig's kit is worth beyond raw HP/ATK. The functions come from the
   same abilitiesFor() path the battle uses, so helmet tiers bought with
   blueprints, relic riders and gear upgrades are all reflected here. */
DATA.heroSupport = function (heroDef, level, gear, forgeLevel, relicId, partySize) {
  if (!heroDef) return 0;
  const stats = DATA.heroStats(heroDef, level, gear, forgeLevel, relicId);
  const squad = Math.max(1, partySize || 1);
  const h = { def: heroDef, level, atk: stats.atk, maxHp: stats.maxHp };
  let raw = 0;
  const value = (fn) => (typeof fn === 'function' ? fn(h) : 0);
  DATA.abilitiesFor(heroDef, gear, relicId).forEach((ab) => {
    raw += value(ab.healSingle) * (0.35 + 0.08 * squad);
    raw += value(ab.healParty) * (0.55 + 0.25 * squad);
    raw += value(ab.shieldSingle) * (0.50 + 0.10 * squad);
    raw += value(ab.shieldParty) * (0.60 + 0.30 * squad);
    raw += value(ab.selfHeal) * 0.25;
    if (ab.guard && ab.guard.reduce) raw += stats.maxHp * ab.guard.reduce * (0.45 + 0.08 * squad);
    if (ab.taunt) raw += 8 * ab.taunt;
  });
  /* Bacon Plating starts every fight with a shield; Critical Eye raises the
     squad's expected damage, so both training tracks count too. */
  raw += stats.maxHp * (DATA.trainingBonus.guard || 0) * 0.7;
  raw += stats.atk * (DATA.trainingBonus.edge || 0) * 0.55;
  return Math.round(raw);
};

DATA.heroPowerOf = function (stats, support) {
  const hp = stats.maxHp + (support || 0) * DATA.POWER.support;
  return Math.round((hp * DATA.POWER.hp + stats.atk * DATA.POWER.atk) * DATA.POWER.hero);
};

DATA.birdPower = function (hp, atk) {
  const base = hp * DATA.POWER.hp + atk * DATA.POWER.atk;
  return Math.round(base * (DATA.POWER.flock || 1));
};

DATA.pigPower = function (heroDef, level, gear, forgeLevel, relicId, partySize) {
  if (!heroDef) return 0;
  const stats = DATA.heroStats(heroDef, level, gear, forgeLevel, relicId);
  const support = DATA.heroSupport(heroDef, level, gear, forgeLevel, relicId, partySize);
  return DATA.heroPowerOf(stats, support);
};

/* Both numb birds must also be met on the main road, not only down a cave:
   the canyon gets Numbwing at 'Feather Fury', the shore gets Brine Wretch at
   'Brine Break'. Their rows are otherwise untouched. */
[['c6', 'numbwing'], ['s6', 'brinewretch'], ['c7', 'bristleback'], ['s7', 'spikegull']].forEach(([id, key]) => {
  const lv = DATA.levels[id];
  if (!lv || !lv.enemies) return;
  if (lv.enemies.some((e) => e.t === key)) return;
  lv.enemies.push({ t: key, hpMul: 1.0, atkMul: 0.9 });
});

DATA.difficultyOf = function (ratio) {
  const r = Number.isFinite(ratio) ? ratio : 1;
  if (r >= 2.4) return { tier: 0, key: 'cakewalk', label: 'Cakewalk', color: '#67d97a', note: 'You outgun this flock badly. Nothing to prove.' };
  if (r >= 1.85) return { tier: 1, key: 'easy', label: 'Easy', color: '#a8d94f', note: 'A comfortable fight if you play it straight.' };
  if (r >= 1.4) return { tier: 2, key: 'intimidating', label: 'Intimidating', color: '#ffcf5c', note: 'The flock has teeth. Watch the shields.' };
  if (r >= 1.05) return { tier: 3, key: 'difficult', label: 'Difficult', color: '#ff9a4a', note: 'Bring potions and focus fire.' };
  if (r >= 0.8) return { tier: 4, key: 'challenging', label: 'Challenging', color: '#ff6b4a', note: 'One bad round could end the run.' };
  return { tier: 5, key: 'catastrophic', label: 'Catastrophic', color: '#ff3b3b', note: 'The flock outguns you. Level up or gear first.' };
};

/* Not every pig swings with the same weight. The heavy hitters carry the early
   road, so the flock is tuned around a squad that is not perfectly even. */
DATA.heroGrade = { king: 1.12, corporal: 1.08, sapper: 1.06, scout: 1.04 };
DATA.heroes.forEach((h) => {
  const g = DATA.heroGrade[h.id];
  if (!g) return;
  if (typeof h.baseAtk === 'number') h.baseAtk = Math.round(h.baseAtk * g);
  else if (typeof h.atk === 'number') h.atk = Math.round(h.atk * g);

/* Copy pass: every card reads as a sentence. Collapses doubled spaces, fixes
   spacing before punctuation, capitalises the first letter and closes the line
   with a full stop. Runs over every bird and pig after all content is built. */
DATA.tidyText = function (s) {
  if (typeof s !== 'string' || !s.trim()) return s;
  let t = s.replace(/\s+/g, ' ').replace(/\s+([,.;:!?])/g, '$1').trim();
  t = t.charAt(0).toUpperCase() + t.slice(1);
  if (!/[.!?]$/.test(t)) t += '.';
  return t;
};
Object.keys(DATA.enemies).forEach((k) => {
  const b = DATA.enemies[k];
  if (b.trait) b.trait = DATA.tidyText(b.trait);
  if (b.lore) b.lore = DATA.tidyText(b.lore);
});
DATA.heroes.forEach((h) => {
  if (h.trait) h.trait = DATA.tidyText(h.trait);
  (h.abilities || []).forEach((a) => {
    if (a.desc) a.desc = DATA.tidyText(a.desc);

});

    }

    const lead = barOf(th.lead, bar);
    const ch = lead[i];
    if (ch !== '.' && ch !== undefined) {
      const deg = Number(ch);
      if (Number.isFinite(deg)) {
        /* Degrees past the scale climb an octave instead of going silent. */
        const oct = Math.floor(deg / th.scale.length);

    const hit = dr[i];

       player hears the fight get worse before the banner says so. */
    if (intensity) {

      if (i === 6 || i === 14) drum(t, 'k');

  /* Fade the bus up once the browser actually lets us make sound. */
  /* A wordless choir under the second half: three slightly detuned voices
     opened through a lowpass, so it reads as voices rather than as the pad.
     Only the phase-two layer calls it. */
  function choir(t, freq, dur, gain) {

     rising over a pair of kicks, so the player knows the fight changed before

    osc.frequency.exponentialRampToValueAtTime(rootFreq * 4, t + 0.44);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(560, t);
    filter.frequency.exponentialRampToValueAtTime(5600, t + 0.44);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.045, t + 0.14);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.62);
    osc.connect(filter).connect(g).connect(out);
    osc.start(t);
    osc.stop(t + 0.68);
    drum(t, 'k');
    drum(t + 0.44, 'k');

    out.gain.exponentialRampToValueAtTime(muted ? 0.0001 : 0.11, t + (fade || 0.9));

  }

  function tick() {

    if (a.state !== 'running') {

    if (nextTime < a.currentTime - 0.4) nextTime = a.currentTime + 0.06;

  function play(themeName) {
    const th = THEMES[themeName];

    if (name === themeName && timer) return;

    name = themeName;
    /* A fresh cue always starts calm; phase two re-arms it explicitly. */
    intensity = 0;
    step = 0;

    const a = output();

  }

  function stop(fade) {
    if (timer) { clearInterval(timer); timer = null; }

    intensity = 0;
    armed = false;
    const a = output();
    if (!a || !out) return;
    out.gain.cancelScheduledValues(a.currentTime);
    out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), a.currentTime);
    out.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + (fade || 0.5));

    if (!a || !out) return;
    out.gain.cancelScheduledValues(a.currentTime);
    out.gain.setValueAtTime(Math.max(0.0001, out.gain.value), a.currentTime);
    out.gain.exponentialRampToValueAtTime(muted ? 0.0001 : 0.11, a.currentTime + 0.3);

    if (next === intensity) return;
    if (next) sting();
    intensity = next;
    step = 0;
  }

  return {
    play,
    stop,
    setIntensity,
    setMuted,
    isPlaying: () => !!timer,
    current: () => name,
    names: Object.keys(THEMES),

/* ============================================================
   Battle engine + battle screen UI
   ============================================================ */
const Battle = (function () {
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const rnd = (a, b) => a + Math.random() * (b - a);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

  let B = null;
  let el = {};
  let hooks = {};

  const HERO_NAME = (def) => def.name.replace(' Pig', '');
  const escAttr = (s) => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  /* ---------------- setup ---------------- */

  function buildHero(def, gear, level, forgeLevel, startHp, relicId, atkBonus, weaponId, shieldId) {
    const stats = DATA.heroStats(def, level, gear, forgeLevel, relicId);
    const relic = relicId || (DATA.relicForHero(def.id) || {}).id;
    return {
      def,
      relic,
      craftedWeapon: weaponId || null,
      craftedShield: shieldId || null,
      actedThisRound: false,
      gear: gear || { weapon: 1, helmet: 1 },
      level,
      maxHp: stats.maxHp,
      hp: startHp != null ? clamp(Math.round(startHp), 1, stats.maxHp) : stats.maxHp,
      atk: Math.round(stats.atk * (1 + (atkBonus || 0))),
      rage: 2,
      /* No free opening shield: a shield only appears when an ability grants
         one. Bacon Plating still adds its slice if the player trained it. */
      shield: Math.round((DATA.trainingBonus.guard || 0) * 100),
      shieldTurns: DATA.trainingBonus.guard ? 3 : 0,
      stun: 0,
      weak: 0,
      silence: 0,
      burn: null,
      poison: null,
      guard: null,
      taunt: 0,
      alive: true,
      /* The live pig is handed in so every ability description can quote what
         it hits for at this level, not only its percentage. */
      abilities: DATA.abilitiesFor(def, gear, relicId, { level, atk: stats.atk, maxHp: stats.maxHp }),
      el: null,
    };
  }

  function buildEnemy(entry, level, index) {
    const tpl = DATA.enemies[entry.t];
    const tune = DATA.tuning || { enemyHp: 1, enemyAtk: 1 };
    /* A boss is already the hardest thing in its world; stacking the level
       curve and tuning on top turned the Frost King into a 7,700 HP wall.
       Bosses scale once, gently. */
    const hpMul = tpl.boss ? Math.min(entry.hpMul || 1, 1.15) : (entry.hpMul || 1);
    const atkMul = tpl.boss ? Math.min(entry.atkMul || 1, 1.15) : (entry.atkMul || 1);
    /* Egg World opens a little softer: a new squad has no gear yet, and the
       first world is a tutorial in disguise. Bosses keep their full bite. */
    const ease = level && level.world === 1 && !tpl.boss ? 0.9 : 1;
    const maxHp = Math.round(tpl.hp * hpMul * tune.enemyHp * ease);
    const built = {
      uid: 'e' + index,
      key: entry.t,
      tpl,
      name: tpl.name,
      art: tpl.art,
      maxHp,
      hp: maxHp,
      atk: Math.round(tpl.atk * atkMul * tune.enemyAtk * ease * 10) / 10,
      armor: tpl.armor || 0,
      flying: !!tpl.flying,
      haunt: !!tpl.haunt,
      /* Iron hide: hits under this much are blunted to 75%. */
      soakAt: tpl.soakAt || 0,
      /* Knight's guard: hits under this much are halved. */
      halfAt: tpl.halfAt || 0,
      /* Charges of outright evasion from a dodge buff. */
      dodgeCharge: 0,
      shieldTurns: 0,
      stun: 0,
      burn: null,
      poison: null,
      chili: 0,
      chiliHits: 0,
      weak: 0,
      silence: 0,
      shield: 0,
      veil: 0,
      power: 0,
      powerTurns: 0,
      /* A rage buff raises the bird's own attack for a few rounds. */
      rageTurns: 0,
      rageBase: 0,
      /* Lifesteal on the move this bird is currently swinging. */
      activeLeech: 0,
      fuse: 'idle',
      alive: true,
      ghost: false,
      ghostTimer: 0,
      ghostMax: 2,
      rising: false,
      ghostType: null,
      revived: false,
      boss: !!tpl.boss,
      focus: 0,
      special: null,
      cdHave: 0,
      el: null,
    };
    /* The charged special this bird is winding up: it cannot attack while the
       bar fills, and a full bar is what fires the move. */
    built.special = pickSpecial(built);
    return built;
  }

  /* Crispy: a short char plus an ember burst for anything set on fire. */
  function crispy(node) {
    if (!node) return;
    node.classList.add('crispy');
    setTimeout(() => node.classList.remove('crispy'), 520);
    for (let i = 0; i < 7; i++) {
      const s = document.createElement('i');
      s.className = 'ember';
      s.style.setProperty('--dx', (Math.random() * 70 - 35).toFixed(0) + 'px');
      s.style.setProperty('--dy', (-30 - Math.random() * 50).toFixed(0) + 'px');
      s.style.animationDelay = (Math.random() * 160).toFixed(0) + 'ms';
      s.style.left = (30 + Math.random() * 40).toFixed(0) + '%';
      node.appendChild(s);
      setTimeout(() => s.remove(), 950);
    }
  }

  function pickSpecial(enemy) {
    /* Only real attacks earn a charge bar. Healing, shielding, summoning,
       marking and self-buffs stay ordinary turns, so a full bar always means
       a hit is landing on the pigs. */
    const list = ((enemy.tpl && enemy.tpl.moves) || []).filter((m) => m.cd > 0
      && (m.kind === 'single' || m.kind === 'multi' || m.kind === 'aoe' || m.kind === 'charge'));
    if (!list.length) return null;
    return list[Math.floor(Math.random() * list.length)];
  }

  /* Six pepper charge for every pig in the party: eighteen with three pigs. */
  const PEPPER_PER_PIG = 6;
  function pepperNeed() {
    return PEPPER_PER_PIG * ((B && B.heroes && B.heroes.length) || 1);
  }

  /* One squad-wide meter. Nothing else builds or spends it. */
  function addPepper(n) {
    if (!B || !n) return;
    B.pepperCharge = Math.min(pepperNeed(), (B.pepperCharge || 0) + n);
  }

  /* Every bird you hit is worth charge: one for the wound, one more for a
     tank, and one more when the strike lands something the bird is weak to. */
  function pepperForHit(enemy, ab) {
    let n = 1;
    if (DATA.tankBirds && DATA.tankBirds.includes(enemy.key || enemy.t)) n += 1;
    const key = enemy.key || enemy.t;
    const chart = (DATA.effectCharts && DATA.effectCharts.birds && DATA.effectCharts.birds[key]) || {};
    const fx = ['burn', 'stun', 'weaken', 'silence'];
    if (ab && fx.some((k) => ab[k] && chart[k] >= 1.2)) n += 1;
    return n;
  }

  /* Each world, each boss and the dungeon run their own cue. */
  function musicThemeFor(level) {
    const id = String((level && level.id) || '');
    if (id.indexOf('dungeon') === 0) return 'dungeon';
    if (level && level.boss) return 'boss' + (level.world || 1);
    return 'world' + ((level && level.world) || 1);
  }

  function start(level, profile, callbacks) {
    hooks = callbacks || {};
    const roster = (profile.party && profile.party.length ? profile.party : ['corporal']);
    /* Every pig carries its own level now; a profile without a per-pig entry
       falls back to the squad level it used to pass. */
    const levels = profile.levels || {};
    const heroes = roster
      .map((id) => DATA.heroes.find((h) => h.id === id))
      .filter(Boolean)
      .slice(0, 4)
      .map((def) => buildHero(
        def,
        profile.gear && profile.gear[def.id],
        levels[def.id] || profile.level,
        profile.forge && profile.forge[def.id],
        profile.carryHp && profile.carryHp[def.id],
        profile.relics && profile.relics[def.id],
        profile.atkBonus || 0,
        profile.weapons && profile.weapons[def.id],
        profile.shields && profile.shields[def.id]
      ));

    B = {
      level,
      heroes,
      wave: 1,
      waveCount: DATA.wavesFor(level),
      potionTiers: profile.potionTiers || {},
      enemies: DATA.waveEntries(level, 1).map((entry, i) => buildEnemy(entry, level, i)),
      round: 1,
      phase: 'hero',
      active: 0,
      selected: 0,
      pending: null,
      busy: true,
      over: false,
      acted: false,
      items: Object.assign({}, profile.items || {}),
      might: 0,
      mark: null,
      /* The pepper runs on one squad-wide charge meter, not a per-pig count. */
      pepperCharge: 0,
      pepperCd: 0,
      stats: { dealt: 0, taken: 0, healed: 0, kills: 0, ults: 0, byKey: {}, hero: {} },
    };
    B.enemies.forEach((e) => { e.focus = Math.floor(Math.random() * B.heroes.length); });
    /* Per-pig tallies: the victory screen needs an MVP, not just a team total. */
    B.heroes.forEach((h) => { B.stats.hero[h.def.id] = { dealt: 0, healed: 0 }; });

    renderScreen();
    refresh();
    setHint('Get ready…');
    /* The soundtrack starts with the fight. */
    Music.play(musicThemeFor(level));
    setTimeout(() => {
      if (!B || B.over) return;
      banner(B.waveCount > 1 ? `Wave 1 / ${B.waveCount}` : 'Round 1', 'wave');
      startHeroPhase();
      SFX.play('start');
    }, 420);
  }

  /* ---------------- DOM ---------------- */

  function renderScreen() {
    const screen = document.getElementById('screen-battle');
    screen.innerHTML = `
      <div class="battle-top">
        <div class="lv-title">
          <b>${B.level.name}</b>
          <span>World ${B.level.world} · ${B.level.boss ? 'Boss fight' : B.level.elite ? 'Elite flock' : 'Skirmish'}</span>
        </div>
        <div class="wave-track" id="waveTrack" data-tip="Waves in this fight">
          <span class="wave-label">${B.wave}/${B.waveCount}</span>
          <span class="wave-pips">${Array.from({ length: B.waveCount }, (_, wi) => `<i class="wave-pip" title="Wave ${wi + 1}">${wi + 1}</i>`).join('')}</span>
        </div>
        <div class="round-chip">ROUND <b id="roundNum">1</b></div>
        <button class="icon-btn" id="btnSettings" title="Settings">⚙️</button>
        <button class="icon-btn" id="btnSound" title="Sound on/off">🔊</button>
        <button class="icon-btn" id="btnRetreat" title="Retreat to the map">✕</button>
      </div>
      <div class="items-top" id="itemsTop"></div>
      <div class="stage world-${B.level.world || 1} biome-${B.level.biome || 'meadow'}" id="stage">
        <div class="cloud" style="width:80px; top:12%; animation-duration:52s;"></div>
        <div class="cloud" style="width:52px; top:24%; animation-duration:38s; animation-delay:-12s;"></div>
        <div class="cloud" style="width:110px; top:6%; animation-duration:64s; animation-delay:-30s;"></div>
        <!-- Floor/wave rail: one egg per wave, down the right middle. -->
        <div class="wave-rail" id="waveRail" aria-hidden="true">
          ${Array.from({ length: B.waveCount }, (_, wi) => `<i class="wr-pip" data-wave="${wi + 1}"><b>${wi + 1}</b></i>`).join('')}
        </div>
        <div class="sides">
          <div class="side heroes" id="heroSide"></div>
          <div class="side enemies" id="enemySide"></div>
        </div>
        <div class="battle-log" id="battleLog"></div>
      </div>
      <div class="hint-bar" id="hintBar"></div>
      <!-- Pepper charge pours along this bar and into the chili at the far end. -->
      <div class="rage-meter" id="rageMeter">
        <span class="rm-name">Pepper charge</span>
        <div class="rm-track">
          <i class="rm-fill"></i>
          <i class="rm-mark"></i>
          <span class="rm-val">0 / 18</span>
        </div>
        <button class="rm-chili" id="rmChili" type="button" disabled>
          <span class="rm-ico">🌶️</span><span class="rm-cost">6</span>
        </button>
      </div>
      <div class="hud">
        <div class="hud-hero" id="hudHero"></div>
        <div class="hud-actions" id="hudActions"></div>
        <div class="potion-tray hidden" id="potionTray"></div>
      </div>
    `;

    el = {
      screen,
      stage: screen.querySelector('#stage'),
      heroSide: screen.querySelector('#heroSide'),
      enemySide: screen.querySelector('#enemySide'),
      hudHero: screen.querySelector('#hudHero'),
      hudActions: screen.querySelector('#hudActions'),
      potionTray: screen.querySelector('#potionTray'),
      rageMeter: screen.querySelector('#rageMeter'),
      itemsTop: screen.querySelector('#itemsTop'),
      hint: screen.querySelector('#hintBar'),
      log: screen.querySelector('#battleLog'),
      round: screen.querySelector('#roundNum'),
    };

    B.heroes.forEach((h, i) => {
      const fig = document.createElement('div');
      fig.className = 'fig hero spawn';
      fig.dataset.hero = String(i);
      fig.style.animationDelay = i * 90 + 'ms';
      fig.innerHTML = `
        <div class="ground-ring"></div>
        <div class="turn-ring"></div>
        <div class="focus-ring"></div>
        <div class="statuses"></div>
        ${Art.hero(h.def.id, h.relic, h.craftedWeapon, h.craftedShield)}
        <div class="nameplate">${HERO_NAME(h.def)}</div>
        <div class="hp-track"><i></i></div>
        <div class="shield-num hidden">🛡 0</div>
      `;
      fig.setAttribute('data-tip', DATA.heroTip(h));
      fig.addEventListener('click', () => onHeroClick(i));
      el.heroSide.appendChild(fig);
      h.el = fig;
      setTimeout(() => fig.classList.remove('spawn'), 500 + i * 90);
    });

    /* Six, seven or eight birds share one side, so a crowded field shrinks
       the figures instead of overflowing the stage. */
    el.enemySide.classList.toggle('dense', B.enemies.length > 4);

    /* Four or more on one side stands in two ranks — a front line and a back
       row — instead of one cramped file. */
    el.enemySide.classList.toggle('two-row', B.enemies.length >= 4);
    el.heroSide.classList.toggle('two-row', B.heroes.length >= 4);

    B.enemies.forEach((e, i) => {
      const fig = document.createElement('div');
      /* A boss is the headliner: it gets its own class so the stage can draw
         it bigger than the flock around it. */
      fig.className = 'fig enemy spawn' + (e.tpl && e.tpl.boss ? ' boss' : '');
      fig.dataset.enemy = e.uid;
      fig.style.animationDelay = 120 + i * 110 + 'ms';
      fig.innerHTML = `
        <div class="statuses"></div>
        ${Art.enemy(e.art)}
        <div class="nameplate">${e.name}</div>
        <div class="hp-track"><i></i></div>
        <div class="shield-num hidden">🛡 0</div>
        <div class="cd-row hidden"><span class="cd-ico"></span><span class="cd-track"><i></i></span><b class="cd-num">0/0</b></div>
        <div class="cd-row ghost-row hidden"><span class="cd-ico">👻</span><span class="cd-track"><i></i></span><b class="cd-num">0/2</b></div>
        <div class="shield-bubble hidden"></div>
        <div class="ghost-mark">👻</div>
      `;
      fig.setAttribute('data-tip', DATA.enemyTip(e));
      fig.addEventListener('click', () => onEnemyClick(e));
      el.enemySide.appendChild(fig);
      e.el = fig;
      setTimeout(() => fig.classList.remove('spawn'), 700 + i * 110);
    });

    /* The chili at the end of the bar is the pepper button once it lights. */
    if (el.rageMeter) {
      const chiliBtn = el.rageMeter.querySelector('#rmChili');
      if (chiliBtn) {
        chiliBtn.addEventListener('click', () => {
          const hero = B.heroes[B.selected];
          if (!hero || !heroReady(hero)) return;
          const idx = hero.abilities.findIndex((a) => a.chili);
          if (idx < 0) {
            SFX.play('nope');
            setHint('Only some pigs carry a pepper — this one fights with steel.');
            return;
          }
          chooseAbility(idx);
        });
      }
    }

    el.screen.querySelector('#btnRetreat').addEventListener('click', () => {
      if (B.over || B.busy) return;
      Music.stop(0.4);
      hooks.onRetreat && hooks.onRetreat();
    });
    el.screen.querySelector('#btnSettings').addEventListener('click', () => {
      SFX.play('click');
      hooks.onSettings && hooks.onSettings();
    });
    const snd = el.screen.querySelector('#btnSound');
    snd.textContent = SFX.isMuted() ? '🔇' : '🔊';
    snd.addEventListener('click', () => {
      SFX.setMuted(!SFX.isMuted());
      snd.textContent = SFX.isMuted() ? '🔇' : '🔊';
      SFX.play('click');
      hooks.onMuteChange && hooks.onMuteChange(SFX.isMuted());
    });
  }

  document.addEventListener('keydown', (ev) => {
    if (!B || B.over) return;
    if (document.getElementById('screen-battle').classList.contains('hidden')) return;
    if (ev.key === 'Escape') {
      if (B.pending) { B.pending = null; refresh(); }
      return;
    }
    if (ev.key === 'p' || ev.key === 'P') { toggleTray(); return; }
    if (B.phase !== 'hero' || B.busy) return;
    const idx = Number(ev.key) - 1;
    if (idx >= 0 && idx < 3) chooseAbility(idx);
  });

  /* ---------------- refresh ---------------- */

  function refresh() {
    if (!B) return;
    el.round.textContent = B.round;
    /* Wave pips: cleared waves filled, current one lit. */
    const wt = document.getElementById('waveTrack');
    if (wt) {
      wt.querySelectorAll('.wave-pip').forEach((pip, wi) => {
        pip.classList.toggle('done', wi + 1 < B.wave);
        pip.classList.toggle('on', wi + 1 === B.wave);
      });
      const label = wt.querySelector('.wave-label');
      if (label) label.textContent = `${B.wave}/${B.waveCount}`;
      wt.setAttribute('data-tip', `Wave ${B.wave} of ${B.waveCount} — clear them all to win`);
    }
    /* Same state as the top pips, mirrored down the right edge where the
       action is, so the current floor is readable without looking up. */
    const rail = document.getElementById('waveRail');
    if (rail) {
      rail.querySelectorAll('.wr-pip').forEach((pip, wi) => {
        const done = wi + 1 < B.wave;
        const now = wi + 1 === B.wave;
        pip.classList.toggle('done', done);
        pip.classList.toggle('on', now);
        pip.setAttribute('data-tip', `Wave ${wi + 1} of ${B.waveCount}${now ? ' — fighting now' : done ? ' — cleared' : ''}`);
      });
    }

    B.heroes.forEach((h, i) => {
      const fig = h.el;
      const pct = Math.max(0, h.hp / h.maxHp) * 100;
      const hpBar = fig.querySelector('.hp-track');
      hpBar.querySelector('i').style.width = pct + '%';
      hpBar.classList.toggle('low', pct <= 30);
      fig.classList.toggle('ko', !h.alive);
      fig.classList.toggle('active', B.phase === 'hero' && i === B.selected && !B.over);
      fig.classList.toggle('can-act', B.phase === 'hero' && heroReady(h) && !B.over);
      fig.classList.toggle('acted', !!h.actedThisRound);
      fig.classList.toggle('targetable', !!(B.pending && B.pending.target === 'ally' && h.alive));
      fig.classList.toggle('focused', h.alive && B.enemies.some((e) => e.alive && e.focus === i && !e.ghost));
      fig.classList.toggle('marked', !!(B.mark && B.mark.turns > 0 && B.mark.id === h.def.id && h.alive));

      fig.setAttribute('data-tip', DATA.heroTip(h));

      let bubble = fig.querySelector('.shield-bubble');
      if (h.shield > 0 && !bubble) {
        bubble = document.createElement('div');
        bubble.className = 'shield-bubble';
        fig.appendChild(bubble);
      } else if (h.shield <= 0 && bubble) {
        bubble.remove();
      }

      const shNum = fig.querySelector('.shield-num');
      if (shNum) {
        const sv = Math.round(h.shield || 0);
        shNum.classList.toggle('hidden', sv <= 0);
        if (sv > 0) shNum.textContent = '🛡 ' + sv + '%';
      }

      const st = fig.querySelector('.statuses');
      let icons = '';
      if (B.mark && B.mark.turns > 0 && B.mark.id === h.def.id && h.alive) icons += '<span title="Marked — the whole flock is focused on this pig" class="focus-mark">🎯</span>';
      if (h.poison && h.poison.turns > 0) icons += '<span title="Poisoned">☠️</span>';
      if (B.might > 0) icons += '<span title="Might">💪</span>';
      if (h.guard && h.guard.turns > 0) icons += '<span title="Guarding">🛡️</span>';
      if (h.taunt > 0) icons += '<span title="Taunting">😠</span>';
      if (!h.alive) icons = '<span title="Knocked out">💫</span>';
      else {
        if (h.stun > 0) icons += '<span title="Stunned">💫</span>';
        if (h.frozen > 0) icons += '<span title="Frozen — loses turns and takes +25% damage">🧊</span>';
        if (h.drenched > 0) icons += '<span title="Drenched — shields washed off, takes +20% damage">🌊</span>';
        if (h.expose > 0) icons += '<span title="Exposed — takes +25% damage for ' + h.expose + ' more round' + (h.expose === 1 ? '' : 's') + '">🩸</span>';
        if (h.pepperDry > 0) icons += '<span title="Pepper numb — this pig\'s hits build no pepper for ' + h.pepperDry + ' more round' + (h.pepperDry === 1 ? '' : 's') + '">🧂</span>';
        if (h.burn && h.burn.turns > 0) icons += '<span title="Burning — takes ' + h.burn.dmg + ' damage after the pigs act for ' + h.burn.turns + ' more round' + (h.burn.turns === 1 ? '' : 's') + '">🔥</span>';
        if (h.mire > 0) icons += '<span title="Mired — 100% of this pig\'s healing is stolen by the flock for ' + h.mire + ' more round' + (h.mire === 1 ? '' : 's') + '. Cleanse it.">🕳️</span>';
        if (h.weak > 0) icons += '<span title="Weakened">🦴</span>';
        if (h.silence > 0) icons += '<span title="Silenced">🤐</span>';
      }
      st.innerHTML = icons;
    });

    B.enemies.forEach((e) => {
      const fig = e.el;
      const pct = Math.max(0, e.hp / e.maxHp) * 100;
      const hpBar = fig.querySelector('.hp-track');
      hpBar.querySelector('i').style.width = pct + '%';
      hpBar.classList.toggle('low', pct <= 30);
      fig.classList.toggle('dying', !e.alive && !e.ghost);
      fig.classList.toggle('ghost', !!e.ghost);
      fig.dataset.ghost = e.ghost && e.ghostType ? e.ghostType.id : '';
      fig.classList.toggle('targetable', !!B.pending && B.pending.target === 'enemy' && e.alive && !e.ghost);
      fig.setAttribute('data-tip', DATA.enemyTip(e));
      const bubble = fig.querySelector('.shield-bubble');
      if (bubble) bubble.classList.toggle('hidden', !(e.shield > 0));
      const shNum = fig.querySelector('.shield-num');
      if (shNum) {
        const sv = Math.round(e.shield || 0);
        shNum.classList.toggle('hidden', sv <= 0);
        if (sv > 0) shNum.textContent = '🛡 ' + sv + '%';
      }
      /* Charge bar: black while empty, blue as it fills, glowing when ready. */
      const cdRow = fig.querySelector('.cd-row');
      if (cdRow) {
        const sp = e.special;
        /* Nothing telegraphs a move that has not started winding up: the
           bar only appears once the bird has banked its first charge tick. */
        const show = !!(sp && sp.cd > 0 && e.cdHave > 0 && e.alive && !e.ghost && !e.charge);
        cdRow.classList.toggle('hidden', !show);
        if (show) {
          const have = Math.max(0, Math.min(e.cdHave, sp.cd));
          cdRow.querySelector('.cd-ico').textContent = sp.icon || '✨';
          cdRow.querySelector('.cd-track i').style.width = (have / sp.cd) * 100 + '%';
          cdRow.querySelector('.cd-num').textContent = have + '/' + sp.cd;
          cdRow.classList.toggle('ready', have >= sp.cd);
        }
      }
      /* Revive countdown for a bird that is currently a ghost. */
      const ghostRow = fig.querySelector('.ghost-row');
      if (ghostRow) {
        const gmax = e.ghostMax || 2;
        const gtype = e.ghostType;
        /* Count *towards* the revival: 1/3 and 2/3 as the ghost drifts closer,
           then 3/3 as it stands up. A charge only appears above zero. */
        const toward = Math.max(0, Math.min(gmax, gmax - e.ghostTimer));
        const showGhost = !!e.ghost && (toward > 0 || e.rising);
        ghostRow.classList.toggle('hidden', !showGhost);
        if (showGhost) {
          const left = Math.max(0, gmax - toward);
          ghostRow.querySelector('.cd-ico').textContent = gtype ? gtype.icon : '👻';
          ghostRow.querySelector('.cd-track i').style.width = Math.round((toward / gmax) * 100) + '%';
          ghostRow.querySelector('.cd-num').textContent = toward + '/' + gmax;
          ghostRow.classList.toggle('ready', left <= 1);
          ghostRow.title = (gtype ? gtype.name + ' — ' + gtype.blurb : 'Ghost')
            + (left <= 1
              ? ' — RISES NEXT ROUND: finish the wave or shield the squad!'
              : '. Revives in ' + left + ' round' + (left === 1 ? '' : 's') + ' — it rises unless the fight ends first');
        }
      }
      const st = fig.querySelector('.statuses');
      let icons = '';
      if (e.stun > 0) icons += '<span title="Stunned">💫</span>';
      if (e.burn && e.burn.turns > 0) icons += '<span title="Burning">🔥</span>';
      if (e.poison && e.poison.turns > 0) icons += '<span title="Poisoned — ' + e.poison.dmg + ' damage after every pig turn for ' + e.poison.turns + ' more round' + (e.poison.turns === 1 ? '' : 's') + '">☠️</span>';
      if (e.chili > 0 && e.burn && e.burn.turns > 0) icons += '<span title="Chili heat +' + Math.min(e.chiliHits || 0, 4) * 15 + '% damage">🌶️</span>';
      if (e.weak > 0) icons += '<span title="Weakened">🦴</span>';
      if (e.silence > 0) icons += '<span title="Silenced">🤐</span>';
      if (e.vuln > 0) icons += '<span title="Open — takes +' + Math.round((e.vulnBonus || 0.2) * 100) + '% damage for ' + e.vuln + ' more round' + (e.vuln === 1 ? '' : 's') + '">🩸</span>';
      if (e.veil > 0) icons += '<span title="Mirage — 80% of attacks miss (' + e.veil + ' round' + (e.veil === 1 ? '' : 's') + ' left)">🌫️</span>';
      if (e.soakAt) icons += '<span title="Iron hide — hits under ' + e.soakAt + ' deal 75% damage">🧱</span>';
      if (e.halfAt) icons += '<span title="Knight\'s guard — hits under ' + e.halfAt + ' deal 50% damage">🛡️</span>';
      if (e.dodgeCharge > 0) icons += '<span title="Dodge charges: ' + e.dodgeCharge + ' — cleansing damage deletes these">💨</span>';
      if (e.power > 0) icons += '<span title="Frenzied — every hit deals +' + e.power + ' for ' + e.powerTurns + ' more round' + (e.powerTurns === 1 ? '' : 's') + '">⚡</span>';
      if (e.rageTurns > 0) icons += '<span title="Enraged — ' + Math.round(((e.atk / (e.rageBase || e.atk)) - 1) * 100) + '% more damage for ' + e.rageTurns + ' more round' + (e.rageTurns === 1 ? '' : 's') + '">🔥</span>';
      if (e.activeLeech > 0) icons += '<span title="Draining — heals ' + Math.round(e.activeLeech * 100) + '% of the damage it deals">🩸</span>';
      if (e.fuse === 'lit') icons += '<span title="Fuse lit!">💣</span>';
      if (e.ghost) icons += '<span title="Ghost">👻</span>';
      if (!e.ghost) icons += '<span title="Focus" class="focus-mark">🎯</span>';
      st.innerHTML = icons;
    });

    /* A near-death squad gets a red edge on the field: a standing warning that
       costs no HUD space and stops as soon as the pigs are safe. */
    if (el.stage) {
      const danger = B.heroes.some((h) => h.alive && h.hp / h.maxHp <= 0.25);
      el.stage.classList.toggle('danger', danger && !B.over);
    }

    refreshHud();
    refreshHint();
  }

  /* Only touch the DOM when the markup really changed — rewriting a hovered
     button's HTML every refresh made it blink (and killed hover/tooltips). */
  function setHtml(node, html) {
    if (!node) return false;
    if (node.dataset.html === html) return false;
    node.dataset.html = html;
    node.innerHTML = html;
    return true;
  }

  /* Big charge bar: the squad's pepper charge, shared by every pig, filling
     up and pouring into the chili at the far end. */
  function updateRageMeter(hero) {
    const node = el.rageMeter;
    if (!node) return;
    const chiliIdx = hero ? hero.abilities.findIndex((a) => a.chili) : -1;
    const chili = chiliIdx >= 0 ? hero.abilities[chiliIdx] : null;
    const need = pepperNeed();
    const charge = Math.min(need, B.pepperCharge || 0);
    const ready = !!chili && charge >= need;
    const cooling = !!chili && ready && (B.pepperCd || 0) > 0;
    const live = ready && !cooling && hero.alive && B.phase === 'hero' && !B.busy;

    const pct = (charge / need) * 100;
    const fill = node.querySelector('.rm-fill');
    fill.style.width = Math.round(pct) + '%';
    fill.classList.toggle('hot', ready);
    const mark = node.querySelector('.rm-mark');
    mark.style.display = 'none';

    /* A numbed pig builds no pepper at all: name it on the bar so a hit that
       charges nothing is explained instead of looking broken. */
    const numbed = !!(hero && hero.pepperDry > 0);
    node.classList.toggle('numbed', numbed);
    node.querySelector('.rm-name').textContent = numbed ? 'No pepper · ' + hero.pepperDry : 'Pepper charge';
    node.querySelector('.rm-val').textContent = charge + ' / ' + need;

    const btn = node.querySelector('#rmChili');
    btn.classList.toggle('nope', !chili);
    btn.classList.toggle('charged', ready);
    btn.classList.toggle('live', live);
    btn.classList.toggle('spent', false);
    btn.classList.toggle('cooling', cooling);
    btn.disabled = !live;
    btn.querySelector('.rm-cost').textContent = !chili
      ? ''
      : cooling
        ? 'W' + B.pepperCd
        : String(charge);
    btn.setAttribute('data-tip', !chili
      ? 'This pig carries no pepper — the charge is shared by the squad'
      : cooling
        ? 'Pepper cooling — ' + B.pepperCd + ' more round' + (B.pepperCd === 1 ? '' : 's')
        : ready
          ? chili.name + ' is ready — tap the chili'
          : 'Pepper charge ' + charge + ' / ' + need + ' — every bird you hit builds it');
  }

  function refreshHud() {
    if (window.initTips) window.initTips();
    const chosen = B.heroes[B.selected];
    const shown = chosen && chosen.alive ? chosen : B.heroes.find((h) => h.alive);
    if (!shown) { el.hudHero.innerHTML = ''; el.hudActions.innerHTML = ''; return; }
    el.hudHero.innerHTML = `
      ${Art.hero(shown.def.id, shown.relic, shown.craftedWeapon, shown.craftedShield)}
      <div class="who">
        <b>${shown.def.name}</b>
        <span>${shown.def.role} · Lv ${shown.level}${shown.actedThisRound ? ' · acted' : ''}</span>
      </div>
    `;
    updateRageMeter(shown);

    const need = pepperNeed();
    const charge = Math.min(need, B.pepperCharge || 0);
    const cooling = (B.pepperCd || 0) > 0;
    const isHelp = (ab) => !!(ab.healParty || ab.healSingle || ab.shieldParty || ab.shieldSingle || ab.cleanse || ab.taunt || ab.guard);
    const entries = shown.abilities.map((ab, idx) => ({ ab, idx })).filter((e) => !e.ab.hidden);
    const pepper = entries.find((e) => e.ab.chili) || null;
    /* Two attacks, then the one team-help, then the pepper on its own wide row. */
    const bar = entries
      .filter((e) => !e.ab.chili)
      .sort((a, b) => (isHelp(a.ab) ? 1 : 0) - (isHelp(b.ab) ? 1 : 0) || a.idx - b.idx);

    let html = bar.map(({ ab, idx }) => {
      const selected = B.pending && B.pending.id === ab.id ? ' selected' : '';
      const cls = ab.cost >= 6 ? ' ult' : '';
      const kind = ab.target === 'self' && !isHelp(ab) ? ' passive' : isHelp(ab) ? ' help' : ' atk';
      const afford = heroReady(shown) && B.phase === 'hero' && !B.busy;
      const tip = escAttr(ab.desc);
      return `
        <button class="ability${cls}${kind}${selected}" data-ab="${idx}" ${afford ? '' : 'disabled'} data-tip="${tip}" title="${tip}">
          <span class="ab-top">
            <span class="ab-ico">${ab.icon}</span>
            <span class="ab-name">${kind === ' passive' ? '[Passive] ' : ''}${ab.name}</span>
            <span class="cost"><i class="on"></i></span>
          </span>
          <span class="ab-desc">${ab.desc}</span>
        </button>
      `;
    }).join('');

    if (pepper) {
      const ab = pepper.ab;
      const ready = charge >= need && !cooling;
      const live = ready && heroReady(shown) && B.phase === 'hero' && !B.busy;
      const count = cooling
        ? 'wait ' + B.pepperCd + (B.pepperCd === 1 ? ' round' : ' rounds')
        : ready
          ? 'ready'
          : charge + ' / ' + need;
      const pepperTip = escAttr(ab.desc);
      html += `
        <button class="ability pepper-big${ready ? ' ult' : ' spent'}" data-ab="${pepper.idx}" ${live ? '' : 'disabled'} data-tip="${pepperTip}" title="${pepperTip}">
          <span class="ab-top">
            <span class="ab-ico">${ab.icon}</span>
            <span class="pepper-tag">Pepper</span>
            <span class="ab-name">${ab.name}</span>
            <span class="cost pepper-count">${count}</span>
          </span>
          <span class="ab-desc">${cooling ? 'Cooling down — every bird you hit refills the meter.' : ready ? ab.desc : 'Hit birds to fill the meter, then throw it.'}</span>
        </button>
      `;
    }

    const itemCount = Object.values(B.items).reduce((a, b) => a + b, 0);

    if (setHtml(el.hudActions, html)) {
      el.hudActions.querySelectorAll('.ability[data-ab]').forEach((btn) => {
        btn.addEventListener('click', () => chooseAbility(Number(btn.dataset.ab)));
      });
    }
    if (el.itemsTop) {
      const chip = `<button class="ability items ${itemCount ? '' : 'empty'}" id="itemBtn" ${B.phase === 'hero' && !B.busy ? '' : 'disabled'} title="Battle items (P)">
        <span class="ab-top"><span class="ab-ico">🎒</span><span class="ab-name">Items</span><span class="cost"><b>${itemCount}</b></span></span>
        <span class="ab-desc">Potions & brews</span>
      </button>`;
      if (setHtml(el.itemsTop, chip)) {
        const topItem = el.itemsTop.querySelector('#itemBtn');
        if (topItem) topItem.addEventListener('click', toggleTray);
      }
    }

    renderTray();
  }

  function renderTray() {
    if (!B || !el.potionTray) return;
    if (el.potionTray.classList.contains('hidden')) return;
    const list = Object.keys(DATA.potions).filter((k) => k !== 'xp' && !DATA.potions[k].prebattle);
    B.potionsUsed = B.potionsUsed || {};
    el.potionTray.innerHTML = `
      <div class="tray-head">Battle items <span class="tray-cap">one of each per level</span><button class="icon-btn tiny" id="trayClose">✕</button></div>
      ${list.map((k) => {
        const p = DATA.potions[k];
        const count = B.items[k] || 0;
        const used = !!B.potionsUsed[k];
        const canBuy = count <= 0 && hooks.buyPotion && B.phase === 'hero' && !B.busy;
        return `<button class="tray-item ${count ? '' : 'tray-empty'}" data-potion="${k}" data-buy="${canBuy ? 1 : 0}" ${!used && (count > 0 || canBuy) && B.phase === 'hero' && !B.busy ? '' : 'disabled'}>
          <span class="ti-ico">${p.icon}</span>
          <span class="ti-txt"><b>${p.name}${((B.potionTiers || {})[k] || 1) > 1 ? ` · T${(B.potionTiers || {})[k]}` : ''}</b><small>${DATA.potionGradeText(k, (B.potionTiers || {})[k] || 1)}</small></span>
          <span class="ti-count">${used ? 'used' : count ? '×' + count : `🪙 ${p.shop || 60}`}</span>
        </button>`;
      }).join('')}
    `;
    el.potionTray.querySelector('#trayClose').addEventListener('click', toggleTray);
    el.potionTray.querySelectorAll('[data-potion]').forEach((btn) =>
      btn.addEventListener('click', () => {
        const kind = btn.dataset.potion;
        if (btn.dataset.buy === '1') {
          const bought = hooks.buyPotion(kind);
          if (bought != null) { B.items[kind] = bought; renderTray(); }
          return;
        }
        usePotion(kind);
      })
    );
  }

  function toggleTray() {
    if (!B || B.over) return;
    el.potionTray.classList.toggle('hidden');
    renderTray();
  }

  function refreshHint() {
    let text = '';
    let pulse = false;
    if (B.over) {
      text = B.over === 'win' ? 'Victory!' : 'The flock wins this one…';
    } else if (B.pending) {
      text = B.pending.target === 'ally'
        ? `Tap a pig for ${B.pending.name} · Esc to cancel`
        : `Tap a bird for ${B.pending.name} · Esc to cancel`;
      pulse = true;
    } else if (B.phase === 'enemy') {
      const fusey = B.enemies.find((e) => e.alive && e.fuse === 'lit');
      text = fusey ? '💣 Bomb is lighting his fuse — brace!' : 'The flock is attacking…';
      pulse = !!fusey;
    } else if (B.busy) {
      text = '…';
    } else {
      const h = B.heroes[B.selected];
      if (h && h.actedThisRound) text = `${h.def.name} has already acted — tap another pig`;
      else if (h && (h.stun > 0 || h.frozen > 0)) text = `${h.def.name} cannot act this round — tap another pig`;
      else text = h ? `${h.def.name}'s turn — pick an action` : 'Tap a pig to act';
      if (B.level.tip && !B.acted) text = '💡 ' + B.level.tip;
    }
    el.hint.innerHTML = `<span class="${pulse ? 'pulse' : ''}">${text}</span>`;
  }

  function setHint(text) {
    el.hint.innerHTML = `<span>${text}</span>`;
  }

  function setLog(text) {
    if (el.log) el.log.textContent = text;
  }

  /* ---------------- juice ---------------- */

  function floatAt(fig, text, cls) {
    if (!fig || !el.stage) return;
    const stageRect = el.stage.getBoundingClientRect();
    const r = fig.getBoundingClientRect();
    const d = document.createElement('div');
    d.className = 'float-num ' + (cls || '');
    d.textContent = text;
    d.style.left = r.left + r.width / 2 - stageRect.left + 'px';
    d.style.top = r.top + r.height * 0.3 - stageRect.top + 'px';
    el.stage.appendChild(d);
    setTimeout(() => d.remove(), 1050);
  }

  function sparks(fig, color, count) {
    if (!fig || !el.stage) return;
    const stageRect = el.stage.getBoundingClientRect();
    const r = fig.getBoundingClientRect();
    const cx = r.left + r.width / 2 - stageRect.left;
    const cy = r.top + r.height * 0.45 - stageRect.top;
    const n = count || 8;
    for (let i = 0; i < n; i++) {
      const s = document.createElement('i');
      s.className = 'spark';
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.7;
      const dist = 24 + Math.random() * 46;
      s.style.left = cx + 'px';
      s.style.top = cy + 'px';
      s.style.background = color || '#ffd45e';
      s.style.setProperty('--dx', Math.cos(angle) * dist + 'px');
      s.style.setProperty('--dy', Math.sin(angle) * dist + 'px');
      s.style.setProperty('--s', 4 + Math.random() * 6 + 'px');
      el.stage.appendChild(s);
      setTimeout(() => s.remove(), 650);
    }
  }

  function shake(hard) {
    el.stage.classList.remove('shake', 'shake-hard');
    void el.stage.offsetWidth;
    el.stage.classList.add(hard ? 'shake-hard' : 'shake');
    setTimeout(() => el.stage.classList.remove('shake', 'shake-hard'), hard ? 520 : 340);
  }

  function flash(color) {
    const f = document.createElement('div');
    f.className = 'stage-flash';
    f.style.background = color || 'rgba(255,255,255,.55)';
    el.stage.appendChild(f);
    setTimeout(() => f.remove(), 420);
  }

  function banner(text, cls) {
    const b = document.createElement('div');
    b.className = 'banner ' + (cls || '');
    b.textContent = text;
    el.stage.appendChild(b);

.tab {
  border: 0;
  font-family: inherit;
  font-weight: 700;
  font-size: 0.82rem;
  color: #d7e9c2;
  background: rgba(255, 255, 255, 0.07);
  padding: 8px 14px;
  border-radius: 12px;
  cursor: pointer;
  white-space: nowrap;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}
.tab.on { background: linear-gradient(#a8e05f, #6db52f); color: #1b3208; box-shadow: 0 3px 0 #3d6b1b; }
.base-body {
  flex: 1;
  overflow-y: auto;
  padding: 4px 16px 48px;
  scrollbar-width: thin;
  scrollbar-color: #4f7a2f transparent;
}
.base-h { font-size: 0.95rem; color: #ffe9a8; margin: 18px 0 8px; letter-spacing: 0.03em; }
.panel-note { font-size: 0.78rem; color: #a9c98d; margin: 2px 0 10px; }

.hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(238px, 1fr)); gap: 10px; }
.hero-card {
  background: linear-gradient(#243d1a, #172a11);
  border-radius: 18px;
  padding: 12px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), 0 6px 16px rgba(0, 0, 0, 0.3);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.hero-card.in-party { box-shadow: inset 0 0 0 2px rgba(255, 220, 110, 0.6), 0 6px 18px rgba(0, 0, 0, 0.35); }
.hero-card.locked { opacity: 0.55; }
.hc-top { display: flex; align-items: center; gap: 8px; }
.hc-top .art { width: 54px; height: 54px; flex: 0 0 54px; }
.hc-top b { display: block; font-size: 0.92rem; color: #ffe9a8; line-height: 1.15; }
.hc-top span { display: block; font-size: 0.68rem; color: #a9c98d; text-transform: uppercase; letter-spacing: 0.08em; }
.hc-top small { display: block; font-size: 0.7rem; color: #cfe4b6; margin-top: 2px; }
.party-badge {
  margin-left: auto;
  font-size: 0.6rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: #4a3208;
  background: #ffd964;
  border-radius: 999px;
  padding: 3px 8px;
}
.hc-trait { font-size: 0.74rem; color: #b9d49c; margin: 0; line-height: 1.3; }
.hc-gear { display: flex; flex-direction: column; gap: 2px; font-size: 0.68rem; color: #d8e9c4; }
.hc-abilities { display: flex; flex-wrap: wrap; gap: 4px; }
.hc-abilities span {
  font-size: 0.64rem;
  background: rgba(255, 255, 255, 0.08);
  border-radius: 8px;
  padding: 2px 6px;
  color: #e4f2d2;
}
.hero-card .btn { align-self: flex-start; }

.workshop-card {
  background: linear-gradient(#243d1a, #172a11);
  border-radius: 18px;
  padding: 12px 14px 14px;
  margin-bottom: 10px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}
.wc-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
.wc-head .art { width: 46px; height: 46px; }
.wc-head b { display: block; font-size: 0.9rem; color: #ffe9a8; line-height: 1.1; }
.wc-head span { font-size: 0.68rem; color: #a9c98d; }
.wc-hp { margin-left: auto; font-size: 0.72rem; color: #cfe4b6; }
.gear-row {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 2px 10px;
  padding: 8px 0;
  border-top: 1px dashed rgba(255, 255, 255, 0.1);
  align-items: center;
}
.gr-head { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: #e4f2d2; }
.tier-pips { letter-spacing: 2px; color: #ffd964; font-size: 0.7rem; }
.gr-desc { grid-column: 1; font-size: 0.68rem; color: #a9c98d; }
.gear-row .btn { grid-column: 2; grid-row: 1 / span 2; }
.gr-next { grid-column: 1 / -1; font-size: 0.66rem; color: #d8c89a; opacity: 0.85; }
.wc-head + .gear-row { border-top: 0; }

.potion-list { display: flex; flex-direction: column; gap: 8px; }
.potion-card, .recipe-row, .shop-row, .ach-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: linear-gradient(#243d1a, #172a11);
  border-radius: 14px;
  padding: 9px 12px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
}
.pc-ico { font-size: 1.4rem; width: 26px; text-align: center; flex: 0 0 26px; }
.pc-body { flex: 1; min-width: 0; }
.pc-body b { display: block; font-size: 0.82rem; color: #ffe9a8; line-height: 1.2; }
.pc-body small { display: block; font-size: 0.68rem; color: #b9d49c; line-height: 1.3; }
.pc-count { font-weight: 800; font-size: 0.85rem; color: #ffd964; }
.recipe-cost { font-size: 0.72rem; color: #d8e9c4; white-space: nowrap; }

.ach-list { display: flex; flex-direction: column; gap: 7px; }
.ach-row { opacity: 0.6; }
.ach-row.got { opacity: 1; box-shadow: inset 0 0 0 1px rgba(255, 215, 100, 0.4); }
.ach-ico { font-size: 1.2rem; width: 26px; text-align: center; }
.ach-body { flex: 1; min-width: 0; }
.ach-body b { display: block; font-size: 0.82rem; color: #ffe9a8; }
.ach-body small { display: block; font-size: 0.68rem; color: #b9d49c; }
.ach-state { font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.08em; color: #9fbe86; }
.ach-row.got .ach-state { color: #ffd964; }

.index-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 9px; }
.index-card {
  background: linear-gradient(#243d1a, #172a11);
  border-radius: 16px;
  padding: 10px;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
}
.index-card.locked { opacity: 0.6; }
.index-card .art { width: 64px; height: 64px; }
.index-card b { font-size: 0.8rem; color: #ffe9a8; }
.index-card span { font-size: 0.64rem; color: #a9c98d; }
.index-card p { font-size: 0.66rem; color: #cfe4b6; margin: 2px 0 0; line-height: 1.35; }
.idx-stats { font-size: 0.62rem; color: #8fb36f; }
.mystery { font-size: 2rem; opacity: 0.4; height: 64px; display: grid; place-items: center; }

/* --- shop --- */
.shop-wallet { display: flex; gap: 8px; justify-content: center; margin: 6px 0 12px; }
.shop-list { display: flex; flex-direction: column; gap: 8px; }
.dice-result { display: flex; justify-content: center; margin: 6px 0 10px; }
.die {
  display: grid;
  place-items: center;
  width: 68px;
  height: 68px;
  border-radius: 16px;
  background: linear-gradient(#fffdf4, #e6d8b4);
  color: #3a2c0c;
  font-size: 2.1rem;
  font-weight: 800;
  box-shadow: 0 6px 0 #b9a678, 0 10px 20px rgba(0, 0, 0, 0.3);
  animation: dicePop 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.6);
}
@keyframes dicePop { from { transform: scale(0.3) rotate(-25deg); } }
.die-pips { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 3px; width: 38px; height: 38px; }
.die-pips i { display: block; border-radius: 50%; background: transparent; }
.die-pips i.on { background: #3a2c0c; box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35); }
.die-mini .die-pips { width: 18px; height: 18px; gap: 1px; }
.lucky { color: #8a5a0f; font-weight: 700; }

/* --- dice reroll --- */
.die-btn { border: 0; padding: 0; font-family: inherit; cursor: pointer; }
.die-btn:active { transform: translateY(3px) scale(0.97); box-shadow: 0 3px 0 #b9a678, 0 6px 12px rgba(0, 0, 0, 0.3); }
.die-btn:disabled { cursor: default; opacity: 0.5; }
.dice-note { text-align: center; font-size: 0.68rem; color: #8fb36f; margin: -4px 0 8px; }
.dice-history { display: flex; gap: 6px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.die-mini {
  display: inline-grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 7px;
  background: #23331b;
  border: 1px solid #3f5a2c;
  color: #cfe6ae;
  font-size: 0.8rem;
  font-weight: 800;
}
.die-mini.live { background: #f7c948; border-color: #b98a16; color: #2a2000; }
.die-head {
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  border-radius: 12px;
  font-size: 1.2rem;
  padding: 0;
  box-shadow: 0 4px 0 #b9a678, 0 6px 14px rgba(0, 0, 0, 0.28);
}
.die-head:hover { filter: brightness(1.05); }
.die-head:active { transform: translateY(3px) scale(0.97); box-shadow: 0 2px 0 #b9a678, 0 4px 10px rgba(0, 0, 0, 0.28); }

/* --- wheel --- */
.wheel-wrap { position: relative; width: min(300px, 72vw); margin: 8px auto 4px; }
.wheel-svg { width: 100%; display: block; filter: drop-shadow(0 10px 18px rgba(0, 0, 0, 0.35)); }
.wheel-pointer {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  color: #ffe27a;
  font-size: 1.7rem;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
  pointer-events: none;
}
.wheel-result { min-height: 34px; font-size: 0.9rem; margin: 4px 0 2px; display: flex; flex-direction: column; gap: 2px; }
.wheel-result small { font-size: 0.68rem; color: #7a6a3c; }
.reward-line.wheel-line b { color: #b07a13; }

/* --- cutscenes --- */
.sheet.cutscene { width: min(560px, 100%); padding: 18px; overflow: hidden; }
.cut-scene { display: flex; align-items: center; gap: 14px; text-align: left; }
.cut-art {
  flex: 0 0 120px;
  display: grid;
  place-items: center;
  filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.25));
  animation: cutFloat 4s ease-in-out infinite;
}
.cut-art .art { width: 120px; height: 120px; }
@keyframes cutFloat { 50% { transform: translateY(-7px); } }
.cut-body h2 { margin: 2px 0 4px; font-size: 1.2rem; }
.cut-body p { font-size: 0.86rem; }
.cut-dots { display: flex; gap: 6px; justify-content: center; margin-top: 12px; }
.cut-dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(0, 0, 0, 0.2); }
.cut-dots i.on { background: #b07a13; }

.screen { animation: screenIn 0.28s ease; }
@keyframes screenIn { from { opacity: 0; transform: translateY(6px); } }

/* ============================================================
   v2 battle juice — spawn, crits, sparks, ghost, items, confetti
   ============================================================ */

.fig.spawn { animation: figSpawn 0.5s cubic-bezier(0.2, 0.9, 0.3, 1.5) both; }
@keyframes figSpawn {
  0% { opacity: 0; transform: translateY(18px) scale(0.7); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.stage.shake-hard { animation: shakeHard 0.5s ease; }
@keyframes shakeHard {
  0%, 100% { transform: translate(0, 0) scale(1); }
  15% { transform: translate(-12px, 5px) scale(1.012); }
  30% { transform: translate(10px, -6px) scale(1.012); }
  45% { transform: translate(-8px, 4px); }
  60% { transform: translate(6px, -3px); }
  80% { transform: translate(-4px, 2px); }
}

.stage-flash {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  animation: flashOut 0.42s ease-out forwards;
}
@keyframes flashOut { from { opacity: 0.9; } to { opacity: 0; } }

.spark {
  position: absolute;
  width: var(--s, 6px);
  height: var(--s, 6px);
  border-radius: 50%;
  z-index: 8;
  pointer-events: none;
  animation: sparkFly 0.66s cubic-bezier(0.15, 0.7, 0.3, 1) forwards;
}
@keyframes sparkFly {
  0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.2); opacity: 0; }
}

.float-num.crit {
  color: #ffe066;
  font-size: clamp(1.3rem, 3.4vw, 2.2rem);
  text-shadow: 0 2px 0 #8a3a00, 0 0 18px rgba(255, 190, 40, 0.9);
}
.float-num.burn { color: #ffb36b; text-shadow: 0 2px 0 #7a2a0c, 0 0 12px rgba(0, 0, 0, 0.7); }

.focus-ring {
  position: absolute;
  inset: -6% -10% 14%;
  border-radius: 50%;
  border: 2px dashed rgba(255, 96, 70, 0.9);
  opacity: 0;
  pointer-events: none;
}
.fig.hero.focused .focus-ring { opacity: 1; animation: focusPulse 1.6s ease-in-out infinite; }
@keyframes focusPulse { 50% { transform: scale(1.06); opacity: 0.55; } }
.focus-mark { font-size: 0.8em; }

.fig.ghost { opacity: 0.6; filter: saturate(0.3) brightness(1.5) hue-rotate(160deg); }
.fig.ghost .art { animation: ghostFloat 2.2s ease-in-out infinite; }
/* A ghost one round from rising reads hot, so the threat is visible. */
.ghost-row.ready .cd-num { color: #ffb36b; text-shadow: 0 0 10px rgba(255, 150, 80, 0.9); }
.ghost-row.ready .cd-track i { background: linear-gradient(90deg, #ff8a4d, #ffd08a); }
.ghost-row.ready { animation: ghostWarn 1s ease-in-out infinite; }
@keyframes ghostWarn {
  0%, 100% { filter: none; }
  50% { filter: drop-shadow(0 0 6px rgba(255, 150, 80, 0.85)); }
}
@keyframes ghostFloat { 50% { transform: translateY(-10px) rotate(-3deg); } }
.banner.ghost {
  color: #d7c6ff;
  text-shadow: 0 3px 0 #4a2a80, 0 0 22px rgba(180, 140, 255, 0.7);
  box-shadow: inset 0 0 0 2px rgba(200, 170, 255, 0.5);
}

.hud { position: relative; }
.ability.items { flex: 0 0 auto; min-width: 88px; background: linear-gradient(#dbe7cf, #b7c9a4); }
.ability.items.empty { opacity: 0.6; }
.ability.items .cost b { font-size: 0.72rem; color: #3f5a22; }

.potion-tray {
  /* Pops up top-centre so it never covers the ability bar or the birds. */
  position: fixed;
  top: 74px;
  left: 50%;
  right: auto;
  bottom: auto;
  transform: translateX(-50%);
  width: min(330px, calc(100vw - 20px));
  background: rgba(14, 26, 12, 0.97);
  border-radius: 16px;
  padding: 10px;
  z-index: 20;
  box-shadow: 0 14px 34px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.14);
  animation: trayInTop 0.18s ease;
}
@keyframes trayIn { from { opacity: 0; transform: translateY(8px); } }
@keyframes trayInTop { from { opacity: 0; transform: translateX(-50%) translateY(-10px); } }
.tray-cap { margin-left: auto; margin-right: 8px; font-size: 0.68rem; opacity: 0.7; letter-spacing: 0.04em; text-transform: uppercase; }
.tray-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 0.74rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: #a9c98d;
  margin-bottom: 6px;
  padding-left: 4px;
}
.icon-btn.tiny { width: 26px; height: 26px; font-size: 0.7rem; }
.tray-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  text-align: left;
  border: 0;
  background: rgba(255, 255, 255, 0.06);
  color: #f1ffe2;
  font-family: inherit;
  padding: 7px 8px;
  border-radius: 11px;
  margin-bottom: 5px;
  cursor: pointer;
}
.tray-item:hover { background: rgba(255, 255, 255, 0.12); }
.tray-item:disabled { opacity: 0.4; cursor: not-allowed; }
.ti-ico { font-size: 1.15rem; }
.ti-txt { flex: 1; min-width: 0; }
.ti-txt b { display: block; font-size: 0.78rem; }
.ti-txt small { display: block; font-size: 0.62rem; color: #b9d49c; line-height: 1.25; }
.ti-count { font-weight: 800; color: #ffd964; font-size: 0.78rem; }

.squad-btn { padding: 3px 10px !important; font-size: 0.7rem !important; }
.hint-bar { gap: 8px; flex-wrap: wrap; text-align: center; }

.confetti {
  position: absolute;
  top: -12px;
  width: 8px;
  height: 12px;
  border-radius: 2px;
  z-index: 4;
  pointer-events: none;
  animation: confettiFall 1.9s ease-in forwards;
}
@keyframes confettiFall {
  to { transform: translateY(560px) rotate(var(--rot, 200deg)); opacity: 0; }
}

@media (max-width: 620px) {
  .cut-scene { flex-direction: column; text-align: center; }
  .cut-art { flex: 0 0 auto; }
  .cut-art .art { width: 96px; height: 96px; }
  .base-top { flex-wrap: wrap; }
  .base-top .res-row { margin-left: 0; width: 100%; }
  .base-heroes .art { width: 56px; height: 56px; margin-left: -16px; }
  .hero-grid { grid-template-columns: 1fr; }
  .map-legend { font-size: 0.64rem; gap: 7px; }
  .wheel-wrap { width: min(250px, 68vw); }
  .toast { font-size: 0.74rem; }
  .title-actions.small-actions .btn { font-size: 0.7rem; padding: 6px 9px; }
}

/* ============================================================
   Endless dungeon
   ============================================================ */

#screen-dungeon {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 10px 14px 16px;
  overflow: hidden;
  position: relative;
  isolation: isolate;
  background:
    radial-gradient(circle at 50% 0%, #2a2233 0%, transparent 55%),
    linear-gradient(#15111c, #08070c 70%);
  color: #e8e2cd;
}

#screen-dungeon > .base-top,
#screen-dungeon > .dungeon-meta,
#screen-dungeon > .dungeon-body,
#screen-dungeon > .dungeon-actions,
#screen-dungeon > #savePill { position: relative; z-index: 2; }

/* A full-bleed vault behind the run: stone ribs, torchlight, drifting mist
   and embers. It never catches a tap, so the map stays fully usable. */
.dungeon-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(22% 17% at 7% 29%, rgba(255, 151, 58, 0.24), transparent 72%),
    radial-gradient(22% 17% at 93% 29%, rgba(255, 151, 58, 0.2), transparent 72%),
    radial-gradient(56% 44% at 50% 24%, rgba(105, 76, 148, 0.18), transparent 74%),
    linear-gradient(180deg, #110d18 0%, #0b0811 54%, #050409 100%);
}

.dungeon-bg::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(90deg, transparent 0 118px, rgba(189, 163, 211, 0.035) 118px 121px, transparent 121px 238px),
    repeating-linear-gradient(0deg, transparent 0 78px, rgba(189, 163, 211, 0.025) 78px 80px, transparent 80px 160px);
  mask-image: radial-gradient(75% 80% at 50% 45%, #000 20%, transparent 100%);
}

.dungeon-bg::after {
  content: "";
  position: absolute;
  left: -5%;
  right: -5%;
  bottom: -6%;
  height: 46%;
  background:
    radial-gradient(54% 72% at 50% 100%, rgba(111, 71, 154, 0.22), transparent 74%),
    repeating-linear-gradient(104deg, rgba(255, 255, 255, 0.018) 0 2px, transparent 2px 46px);
  filter: blur(1px);
}

.db-vault {
  position: absolute;
  bottom: -13%;
  width: clamp(210px, 28vw, 340px);
  height: clamp(310px, 62vh, 620px);
  border: 14px solid rgba(134, 112, 156, 0.2);
  border-bottom: 0;
  border-radius: 52% 52% 0 0 / 64% 64% 0 0;
  box-shadow: inset 0 0 44px rgba(0, 0, 0, 0.48), 0 0 0 3px rgba(201, 174, 224, 0.05), 0 0 34px rgba(122, 86, 168, 0.08);
}

.db-vault::before {
  content: "";
  position: absolute;
  inset: 17px 17px -1px;
  border: 2px solid rgba(201, 174, 224, 0.12);
  border-bottom: 0;
  border-radius: 50% 50% 0 0 / 62% 62% 0 0;
}

.db-vault::after {
  content: "✦";
  position: absolute;
  left: 50%;
  top: 9%;
  transform: translateX(-50%);
  color: rgba(255, 193, 112, 0.28);
  font-size: 20px;
  text-shadow: 0 0 18px rgba(255, 158, 62, 0.45);
  animation: vaultRune 4.8s ease-in-out infinite alternate;
}

.db-vault.a { left: -8%; opacity: 0.62; transform: rotate(-2deg); }
.db-vault.b { left: 50%; width: clamp(250px, 34vw, 410px); height: clamp(360px, 72vh, 700px); transform: translateX(-50%); opacity: 0.38; }
.db-vault.c { right: -9%; opacity: 0.56; transform: rotate(2deg); }

.db-torch {
  position: absolute;
  top: 16%;
  width: 15px;
  height: clamp(86px, 13vh, 128px);
  border-radius: 4px 4px 2px 2px;
  background: linear-gradient(90deg, #2a1b12, #6a4a2c 45%, #2a1b12);
  box-shadow: 0 0 14px rgba(255, 166, 74, 0.2);
}

.db-torch::before {
  content: "";
  position: absolute;
  left: 50%;
  top: -35px;
  width: 30px;
  height: 45px;
  transform: translateX(-50%);
  border-radius: 50% 50% 42% 42% / 66% 66% 34% 34%;
  background:
    radial-gradient(50% 60% at 50% 72%, #fff6c2 0 16%, #ffc45a 42%, #f06e22 72%, transparent 74%),
    linear-gradient(#ffde8a, #ff8a2e);
  filter: blur(0.3px) drop-shadow(0 0 13px rgba(255, 145, 48, 0.8));
  animation: dungeonFlame 1.15s ease-in-out infinite alternate;
}

.db-torch::after {
  content: "";
  position: absolute;
  left: 50%;
  top: -78px;
  width: 172px;
  height: 196px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 167, 76, 0.28), transparent 66%);
  filter: blur(10px);

.relic-card.r-rare { box-shadow: 0 0 0 1px rgba(95,176,255,.35) inset; }

.relic-card.r-unreal .relic-art { filter: drop-shadow(0 0 7px rgba(192,123,255,.55)); }
.relic-card.r-legendary { box-shadow: 0 0 0 1px rgba(255,154,74,.55) inset, 0 10px 26px rgba(255,120,40,.22); }
.relic-card.r-legendary .relic-art { filter: drop-shadow(0 0 10px rgba(255,154,74,.7)); }

/* ============================================================
   Title menu — the campaign board
   The menu reads as one lit carnival panel instead of a stack of
   loose rows: stats, CTA, tools, quick tiles and the next award.
   ============================================================ */
#screen-title {
  --title-pad: clamp(16px, 3vw, 28px);
  justify-content: flex-start;
  padding: var(--title-pad);
  padding-bottom: 0;
}

#screen-title .title-inner {
  width: min(760px, 100%);
  margin: 0 auto;
  padding-bottom: 10px;
  gap: clamp(8px, 1.2vw, 12px);
}

#screen-title .title-kicker {
  display: flex;
  align-items: center;
  gap: 10px;
}

#screen-title .kicker-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #ffd166;
  box-shadow: 0 0 8px #ffb02e;
}

#screen-title .logo::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 52%;
  width: 165%;
  height: 185%;
  transform: translate(-50%, -50%);
  background: radial-gradient(closest-side, rgba(255, 164, 64, 0.34), rgba(255, 110, 40, 0.10) 58%, transparent 74%);
  filter: blur(12px);
  z-index: -1;
  pointer-events: none;
}

#screen-title .sky-moon::after {
  content: "";
  position: absolute;
  inset: -17px;
  border-radius: 50%;
  border: 1px solid rgba(255, 226, 160, 0.18);
  box-shadow: 0 0 42px rgba(255, 190, 100, 0.18);
}

#screen-title .title-heroes::before {
  content: "";
  position: absolute;
  left: 7%;
  right: 7%;
  top: 10%;
  bottom: -4%;
  border-radius: 50%;
  background: radial-gradient(ellipse at 50% 56%, rgba(255, 180, 90, 0.22), transparent 68%);
  filter: blur(9px);
  z-index: 0;
  pointer-events: none;
}

#screen-title .title-heroes::after {
  content: "";
  position: absolute;
  left: 16%;
  right: 16%;
  bottom: 5%;
  height: 14px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255, 174, 76, 0.24), transparent 70%);
  filter: blur(3px);
  z-index: 0;
  pointer-events: none;
}

#screen-title .title-heroes .flyer { z-index: 1; }

#screen-title .title-board {
  position: relative;
  width: min(600px, 100%);
  margin-top: 2px;
  padding: 18px 16px 14px;
  border-radius: 22px;
  background: linear-gradient(180deg, rgba(30, 23, 52, 0.86), rgba(10, 8, 20, 0.94));
  border: 1px solid rgba(255, 214, 140, 0.30);
  box-shadow:
    0 28px 64px rgba(0, 0, 0, 0.52),
    0 0 0 1px rgba(255, 255, 255, 0.04) inset,
    0 0 44px rgba(255, 146, 58, 0.10);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  overflow: hidden;
}

#screen-title .title-board::before {
  content: "";
  position: absolute;
  top: 7px;
  left: 22px;
  right: 22px;
  height: 3px;
  background: radial-gradient(circle, rgba(255, 209, 102, 0.95) 0 1.3px, transparent 1.8px) 0 0 / 13px 3px repeat-x;
  opacity: 0.55;
  pointer-events: none;
}

#screen-title .title-board-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  position: relative;
  z-index: 1;
}

#screen-title .board-label {
  flex: none;
  color: #ffd166;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.24em;
  text-transform: uppercase;
}

#screen-title .board-line {
  flex: 1;
  height: 1px;
  background: linear-gradient(90deg, rgba(255, 209, 102, 0.42), rgba(255, 209, 102, 0.05));
}

#screen-title .board-status {
  display: flex;
  align-items: center;
  gap: 5px;
  flex: none;
  color: #cbbf9f;
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.09em;
  text-transform: uppercase;
}

#screen-title .board-status i {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: #7ad6a0;
  box-shadow: 0 0 7px rgba(122, 214, 160, 0.8);
  animation: boardStatusPulse 2.4s ease-in-out infinite;
}

#screen-title .board-status.new i {
  background: #ffd166;
  box-shadow: 0 0 7px rgba(255, 209, 102, 0.8);
}

@keyframes boardStatusPulse {
  50% { opacity: 0.45; }
}

#screen-title .title-dossier {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
  margin: 0;
}

#screen-title .td-stat {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
  min-width: 0;
  padding: 7px 3px 6px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.045);
  border: 1px solid rgba(255, 255, 255, 0.07);
}

#screen-title .td-stat i {
  font-style: normal;
  font-size: 13px;
  line-height: 1;
  opacity: 0.9;
}

#screen-title .td-stat b {
  color: #ffe08a;
  font-size: 15px;
  line-height: 1.1;
  white-space: nowrap;
}

#screen-title .td-stat small {
  max-width: 100%;
  overflow: hidden;
  color: #cbbf9f;
  font-size: 8.5px;
  letter-spacing: 0.08em;
  line-height: 1.2;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

#screen-title .title-run {
  display: grid;
  grid-template-columns: minmax(0, 1.12fr) minmax(0, 1fr);
  gap: 7px;
  width: 100%;
  margin-top: 7px;
}

#screen-title .title-run-progress {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 5px;
  min-width: 0;
  padding: 7px 10px 8px;
  border-radius: 11px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.07);
}

#screen-title .tr-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

#screen-title .tr-top span {
  overflow: hidden;
  color: #cbbf9f;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.11em;
  text-overflow: ellipsis;
  text-transform: uppercase;
  white-space: nowrap;
}

#screen-title .tr-top b {
  flex: none;
  color: #ffe08a;
  font-size: 12px;
  line-height: 1;
}

#screen-title .tr-track {
  height: 6px;
  overflow: hidden;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.10);
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
}

#screen-title .tr-track i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: linear-gradient(90deg, #d47b20, #ffd166);
  box-shadow: 0 0 9px rgba(255, 180, 70, 0.5);
}

#screen-title .title-run-world {
  display: flex;
  align-items: center;
  gap: 7px;
  min-width: 0;
  padding: 7px 9px;
  border-radius: 11px;
  background: linear-gradient(135deg, rgba(255, 209, 102, 0.10), rgba(255, 255, 255, 0.03));
  border: 1px solid rgba(255, 209, 102, 0.18);
}

#screen-title .tr-world-ico {
  flex: none;
  font-size: 17px;
  line-height: 1;
}

#screen-title .tr-world-copy {
  display: flex;
  flex-direction: column;
  min-width: 0;
  line-height: 1.15;
}

#screen-title .tr-world-copy small {
  color: #cbbf9f;
  font-size: 7.5px;
  font-weight: 800;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  white-space: nowrap;
}

#screen-title .tr-world-copy b {
  overflow: hidden;
  color: #ffe6a8;
  font-size: 11px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#screen-title .tr-world-of {
  flex: none;
  margin-left: auto;
  color: #a89b7d;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
}

#screen-title #playBtn {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1px;
  width: 100%;
  margin-top: 10px;
  padding: 11px 16px 9px;
  border-radius: 14px;
  overflow: hidden;
  font-size: 1.05rem;
}

#screen-title #playBtn .cta-main {
  display: block;
  font-size: 1.13rem;
  font-weight: 900;
  letter-spacing: 0.02em;
  line-height: 1.1;
}

#screen-title #playBtn .cta-sub {
  display: block;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.16em;
  line-height: 1.2;
  opacity: 0.62;
  text-transform: uppercase;
}

#screen-title #playBtn::after {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  width: 38%;
  left: -50%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  transform: skewX(-18deg);
  animation: ctaSheen 5.2s ease-in-out infinite;
  pointer-events: none;
}

@keyframes ctaSheen {
  0%, 58% { left: -50%; opacity: 0; }
  66% { opacity: 0.85; }
  88%, 100% { left: 115%; opacity: 0; }
}

#screen-title .title-tools {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 6px;
  width: 100%;
  margin-top: 8px;
}

#screen-title .tool {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 7px 4px;
  border-radius: 10px;
  border: 1px solid rgba(255, 214, 140, 0.14);
  background: rgba(255, 255, 255, 0.035);
  color: #e9dcc2;
  font-family: inherit;
  cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
}

#screen-title .tool span { font-size: 14px; line-height: 1; }

#screen-title .tool small {
  font-size: 8.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  line-height: 1.15;
  white-space: nowrap;
}

#screen-title .tool:hover {
  border-color: rgba(255, 214, 140, 0.42);
  background: rgba(255, 214, 140, 0.10);
  transform: translateY(-1px);
}

#screen-title .title-quick {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 7px;
  width: 100%;
  margin-top: 8px;
}

#screen-title .tq {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 8px;
  border-radius: 12px;
  text-align: left;
}

#screen-title .tq-ico {
  flex: none;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: rgba(255, 214, 140, 0.12);
  border: 1px solid rgba(255, 214, 140, 0.20);
  font-size: 15px;
}

#screen-title .tq-body {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

#screen-title .tq-body b {
  font-size: 11.5px;
  line-height: 1.1;
}

#screen-title .tq-body small {
  overflow: hidden;
  color: #cbbf9f;
  font-size: 8.5px;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

#screen-title .tq-arrow {
  margin-left: auto;
  color: #ffd166;
  font-size: 16px;
  line-height: 1;
  opacity: 0.45;
  transition: transform 0.15s ease, opacity 0.15s ease;
}

#screen-title .tq:hover .tq-arrow { transform: translateX(2px); opacity: 1; }

#screen-title .tq.ready {
  animation: readyGlow 2.2s ease-in-out infinite;
}

@keyframes readyGlow {
  50% { box-shadow: 0 0 22px rgba(255, 180, 60, 0.45); }
}

#screen-title .title-tip {
  display: flex;
  align-items: flex-start;
  gap: 7px;
  width: 100%;
  max-width: none;
  margin-top: 8px;
  padding: 8px 10px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.035);
  border: 1px solid rgba(255, 255, 255, 0.06);
  color: #d9e9c8;
  font-size: 10px;
  line-height: 1.4;
  text-align: left;
}

#screen-title .tip-ico { flex: none; font-size: 12px; line-height: 1.25; }

#screen-title .title-next {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  width: 100%;
  max-width: none;
  margin-top: 6px;
  padding: 8px 10px;
  border-radius: 10px;
  background: linear-gradient(90deg, rgba(255, 180, 60, 0.12), rgba(255, 180, 60, 0.02));
  border: 1px solid rgba(255, 214, 140, 0.18);
  color: #f3e8cc;
  font-size: inherit;
  line-height: 1.35;
  opacity: 1;
}

#screen-title .next-label {
  flex: none;
  padding-top: 2px;
  color: #ffd166;
  font-size: 8px;
  font-weight: 900;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

#screen-title .next-body {
  display: flex;
  flex-direction: column;
  gap: 1px;
  min-width: 0;
}

#screen-title .next-body b { color: #ffe6a8; font-size: 11px; }
#screen-title .next-body small { color: #cbbf9f; font-size: 9px; line-height: 1.3; }

#screen-title .title-foot {
  max-width: 540px;
  margin-top: 2px;
  color: #cbbf9f;
  font-size: 9.5px;
  line-height: 1.4;
  opacity: 0.55;
  text-align: center;
}

/* The menu is taller than most windows, so it ends on its own patch of
   carnival lawn instead of running out of sky at the bottom of the scroll. */
#screen-title .title-ground {
  position: relative;
  flex: 0 0 auto;
  align-self: stretch;
  height: clamp(600px, 75vh, 820px);
  margin: auto calc(-1 * var(--title-pad)) 0;
  overflow: hidden;
  pointer-events: none;
  background:
    radial-gradient(54% 80% at 18% 100%, #2b4e1e 0 60%, transparent 61%),
    radial-gradient(44% 72% at 82% 100%, #203c15 0 60%, transparent 61%),
    linear-gradient(#152512, #081107);
  box-shadow: inset 0 14px 26px rgba(0, 0, 0, 0.35);
}

#screen-title .tg-hill {
  position: absolute;
  bottom: 48%;
  z-index: 1;
  border-radius: 50% 50% 0 0 / 100% 100% 0 0;
  background: linear-gradient(#3c6728, #1d3513);
  box-shadow: inset 0 2px 0 rgba(170, 222, 124, 0.16);
}

#screen-title .tg-hill.one {
  left: -8%;
  width: 68%;
  height: 72px;
  bottom: 44%;
  transform: rotate(-2deg);
}

#screen-title .tg-hill.two {
  right: -10%;
  width: 74%;
  height: 102px;
  bottom: 31%;
  background: linear-gradient(#2b4f1d, #12240d);
  transform: rotate(1.5deg);
}

#screen-title .tg-hill.three {
  left: 25%;
  width: 62%;
  height: 110px;
  bottom: 34%;
  background: linear-gradient(#5a8a3a, #2a4a1a);
  transform: rotate(-1deg);
  opacity: 0.95;
  z-index: 2;
}

#screen-title .tg-hill.four {
  left: -5%;
  width: 50%;
  height: 96px;
  bottom: 42%;
  background: linear-gradient(#3a6a2a, #18300f);
  transform: rotate(2deg);
  opacity: 0.9;
  z-index: 2;
}

#screen-title .tg-river {
  position: absolute;
  left: -4%;
  right: -4%;
  top: 0;
  z-index: 0;
  height: clamp(410px, 30vh, 530px);
  overflow: hidden;
  background:
    linear-gradient(180deg, rgba(203, 255, 246, 0.34) 0 2px, transparent 2px),
    repeating-linear-gradient(102deg, transparent 0 22px, rgba(207, 255, 248, 0.16) 22px 30px, transparent 30px 56px),
    linear-gradient(180deg, #388d96 0%, #246b79 44%, #123f4c 100%);
  background-color: #246b79;
  clip-path: polygon(0 28%, 9% 20%, 19% 27%, 31% 19%, 43% 26%, 55% 18%, 67% 25%, 79% 19%, 90% 26%, 100% 21%, 100% 80%, 90% 87%, 79% 80%, 68% 88%, 57% 81%, 45% 89%, 33% 82%, 21% 89%, 9% 82%, 0 87%);
  transform: rotate(-0.8deg);
  box-shadow: inset 0 2px 0 rgba(186, 244, 237, 0.34), inset 0 -6px 12px rgba(0, 0, 0, 0.32), 0 -10px 24px rgba(5, 20, 26, 0.35);
  opacity: 1;
}

#screen-title .tg-river::after {
  content: "";
  position: absolute;
  left: -12%;
  right: -12%;
  top: 34%;
  height: 2px;
  background: repeating-linear-gradient(90deg, transparent 0 34px, rgba(224, 255, 250, 0.36) 34px 62px, transparent 62px 98px);
  animation: riverGlint 9s ease-in-out infinite alternate;
}

@keyframes riverGlint {
  from { transform: translateX(-3%); }
  to { transform: translateX(3%); }
}

#screen-title .tg-grass {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;
  height: 46%;
  background:
    repeating-linear-gradient(76deg, transparent 0 20px, rgba(126, 185, 82, 0.13) 20px 21px, transparent 21px 38px),
    linear-gradient(#1d3815, #081107);
  box-shadow: inset 0 2px 0 rgba(126, 185, 82, 0.18);
}

#screen-title .tg-grass::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at 12% 38%, rgba(255, 224, 120, 0.7) 0 1.5px, transparent 2px),
    radial-gradient(circle at 28% 66%, rgba(255, 190, 210, 0.5) 0 1.5px, transparent 2px),
    radial-gradient(circle at 74% 48%, rgba(255, 240, 160, 0.55) 0 1.5px, transparent 2px),
    radial-gradient(circle at 88% 72%, rgba(255, 224, 120, 0.5) 0 1.5px, transparent 2px);
  opacity: 0.7;
}

#screen-title .tool:focus-visible,
#screen-title .tq:focus-visible,
#screen-title #playBtn:focus-visible {
  outline: 2px solid #ffd166;
  outline-offset: 2px;
}

@media (max-width: 460px) {
  #screen-title { --title-pad: 12px; padding: var(--title-pad); padding-bottom: 0; }
  #screen-title .title-board { padding: 18px 12px 12px; border-radius: 18px; }
  #screen-title .title-dossier { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  #screen-title .td-stat:last-child { grid-column: span 2; }
  #screen-title .title-run { grid-template-columns: 1fr; gap: 6px; }
  #screen-title .title-quick { grid-template-columns: 1fr; }
  #screen-title .tool small { font-size: 7.5px; }
}

.vault-legend { display: flex; flex-direction: column; gap: 2px; margin-top: 9px;
  font-size: 9.5px; line-height: 1.3; opacity: .9; }
.vault-legend span { display: block; }
@media (max-width: 420px) {
  .sheet.compact .relic-grid { grid-template-columns: 1fr 1fr; }
}

/* Wheel: spin around the hub, not the SVG corner */
#wheelRot { transform-origin: 100px 100px; transform-box: view-box; }
.wheel-svg { overflow: visible; }

/* Button hover must not change layout — the HUD is now memoised, so no flicker.
   NB: never put `transform` on .map-node — it would override the SVG
   translate() attribute and collapse every tile onto the map origin. */
.btn:hover {
  filter: brightness(1.08);
}

/* ============================================================
   Relic Forge: compact 5-across grid instead of a tall stack
   ============================================================ */
.forge-list {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 7px;
  margin-top: 8px;
}
.forge-card {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 0;
  padding: 8px 5px 6px;
  border-radius: 12px;
  background: linear-gradient(#fff9ea, #ecdfc0);
  border: 1px solid rgba(90, 66, 24, 0.28);
  box-shadow: 0 3px 0 rgba(120, 94, 40, 0.35);
  text-align: center;
}
.forge-card > svg { width: 46px; height: 46px; filter: drop-shadow(0 2px 2px rgba(0,0,0,.25)); }
.forge-card .fc-body { display: grid; gap: 1px; justify-items: center; width: 100%; min-width: 0; }
.forge-card .fc-body b { font-size: 11px; line-height: 1.15; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.forge-card .fc-body small { font-size: 9px; opacity: .72; white-space: nowrap; }
.forge-card .tier-pips { font-size: 9px; letter-spacing: 1.5px; color: #a8791b; }
.forge-card .btn { width: 100%; padding: 4px 4px; font-size: 10px; border-radius: 9px; }
@media (max-width: 640px) {
  .forge-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .forge-card > svg { width: 40px; height: 40px; }
}

/* Compendium: world sections + attack line on each bird card */
.idx-world-h {
  display: flex; align-items: baseline; gap: 8px;
  margin: 14px 0 6px; font-size: 12px; letter-spacing: .08em;
  text-transform: uppercase; color: #ffe9a8;
}
.idx-world-h em { font-style: normal; font-size: 9.5px; letter-spacing: .04em; color: #a9c98d; text-transform: none; }
.idx-moves { font-size: 9.5px; line-height: 1.25; color: #8a6f2d; opacity: .95; }
.idx-world { font-size: 9px; letter-spacing: .03em; color: #7d8a6b; }
.index-card[data-tip] { cursor: help; }

/* Green "go" button: the only enabled Continue once the wheel is done */
.btn.go {
  background: linear-gradient(#8fe05a, #4faa2b);
  color: #0d2306;
  box-shadow: 0 4px 0 #2f6d17, 0 8px 16px rgba(60, 180, 40, .35);
  border-color: #6fd23f;
  animation: goPulse 1.6s ease-in-out infinite;
}
.btn.go:hover { filter: brightness(1.07); }
.btn:disabled.go, .btn.go:disabled { animation: none; }
@keyframes goPulse {
  0%, 100% { box-shadow: 0 4px 0 #2f6d17, 0 0 0 rgba(120, 240, 90, 0); }
  50% { box-shadow: 0 4px 0 #2f6d17, 0 0 18px rgba(120, 240, 90, .75); }
}

/* ============================================================
   Inventory (materials, brews, blueprints, spare relics)
   ============================================================ */
.inv-mats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 7px; }
.inv-mat {
  display: grid; justify-items: center; gap: 1px; padding: 8px 4px 6px;
  color: #2c2410;
  border-radius: 11px; background: linear-gradient(#fff9ea, #ecdfc0);
  border: 1px solid rgba(90, 66, 24, .25);
}
.inv-mat .im-ico { font-size: 18px; line-height: 1; }
.inv-mat b { font-size: 14px; color: #2c2410; }
.inv-mat small { font-size: 9px; color: #6a5c38; text-transform: uppercase; letter-spacing: .05em; }

.inv-list, .bp-list { display: grid; gap: 6px; }
.inv-row {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px;
  color: #2c2410;
  border-radius: 10px; background: rgba(255, 249, 234, .8);
  border: 1px solid rgba(90, 66, 24, .18);
}
.inv-row.empty { opacity: .5; }
.inv-row .ir-ico { font-size: 18px; }
.inv-row .ir-body { flex: 1; min-width: 0; display: grid; gap: 0; }
.inv-row .ir-body b { font-size: 12px; color: #2c2410; }
.inv-row .ir-body small { font-size: 9.5px; color: #6a5c38; }
.inv-row .ir-count { font-size: 12px; font-weight: 800; color: #6b4a0c; }

.bp-card {
  display: flex; align-items: center; gap: 9px; padding: 8px 10px;
  color: #2c2410;
  border-radius: 11px; background: linear-gradient(#fff6e0, #f0e2be);
  border: 1px solid rgba(120, 90, 30, .3);
}
.bp-card.done { opacity: .62; }
.bp-card .bp-body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.bp-card .bp-tag { font-size: 8.5px; letter-spacing: .09em; text-transform: uppercase; color: #a8791b; }
.bp-card b { font-size: 12px; color: #2c2410; }
.bp-card small { font-size: 9.5px; color: #6a5c38; }
.bp-card .bp-mats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 3px; font-size: 9.5px; }
.bp-card .bp-mat.ok { color: #3f7a24; }
.bp-card .bp-mat.no { color: #a5442c; }
.bp-card .btn { flex: 0 0 auto; min-width: 74px; }

.inv-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.inv-chip {
  color: #2c2410;
  font-size: 10.5px; padding: 3px 9px; border-radius: 999px;
  background: rgba(255, 240, 200, .9); border: 1px solid rgba(120, 90, 30, .3);
}

/* Achievements: claimable rewards */
.ach-row.paid { opacity: .78; }
.ach-row .ach-state.paid { color: #6fbf3f; }
.ach-row .btn.small { flex: 0 0 auto; }

/* Wave announcements ride at the top of the stage so they never hide the
   birds they are announcing. */
.banner.wave { top: 9%; z-index: 30; }
.banner.wave.crit { top: 13%; }

/* The ghost standing back up: a violet flash before the body returns. */
.fig.enemy.rising { animation: ghostRise 0.38s ease-out; }
@keyframes ghostRise {
  0% { transform: scale(0.94); filter: brightness(1.9) saturate(0.4) hue-rotate(160deg); }
  55% { transform: scale(1.08); filter: brightness(2.4) saturate(0.2) hue-rotate(160deg); }
  100% { transform: scale(1); filter: none; }
}

/* Floor rail: the fight's waves as eggs, middle of the right edge. */
.wave-rail {
  position: absolute;
  right: 8px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 6px;
  z-index: 14;
  pointer-events: none;
}
.wr-pip {
  width: 26px;
  height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50% 50% 46% 46% / 58% 58% 42% 42%;
  background: rgba(12, 22, 10, 0.5);
  box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.22);
  color: #d9edc2;
  font-style: normal;
  font-size: 0.72rem;
  font-weight: 800;
  transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
}
.wr-pip b { font-weight: 800; }
.wr-pip.done {
  background: rgba(120, 200, 90, 0.55);
  color: #0e2a08;
  box-shadow: inset 0 0 0 1.5px rgba(210, 255, 190, 0.65);
}
.wr-pip.on {
  background: linear-gradient(#ffd76a, #f0a83a);
  color: #3a2405;
  transform: scale(1.16);
  box-shadow: 0 0 12px rgba(255, 200, 90, 0.95), inset 0 0 0 1.5px rgba(255, 245, 210, 0.9);
  animation: wrPulse 1.5s ease-in-out infinite;
}
@keyframes wrPulse {
  50% { transform: scale(1.26); box-shadow: 0 0 18px rgba(255, 210, 110, 1); }
}
@media (max-width: 620px) {
  .wave-rail { right: 4px; gap: 4px; }
  .wr-pip { width: 20px; height: 25px; font-size: 0.62rem; }
}

/* A spent party-wide charge (the pepper) reads as empty, not merely unaffordable. */
.ab-empty {
  font-size: 0.58rem;
  font-weight: 800;
  letter-spacing: 0.1em;
  color: #ffb36b;
  opacity: 0.9;
}
.ability.spent { opacity: 0.6; filter: grayscale(0.55); }
.ability.spent .ab-name { text-decoration: line-through; text-decoration-thickness: 1.5px; opacity: 0.8; }

/* Achievement difficulty bands: 1, 2, 3 and 5 stars. */
.ach-tier { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
.ach-tier span { letter-spacing: 2px; }
.ach-tier em { font-style: normal; opacity: 0.7; font-size: 0.78em; margin-left: auto; }
.ach-tier.t1 span { color: #a9c38f; }
.ach-tier.t2 span { color: #8fd06b; }
.ach-tier.t3 span { color: #7fb6ff; }
.ach-tier.t5 span { color: #ffc93c; text-shadow: 0 0 8px rgba(255, 200, 60, 0.6); }
.ach-stars { font-size: 0.7rem; letter-spacing: 1px; white-space: nowrap; }
.ach-stars.t1 { color: #a9c38f; }
.ach-stars.t2 { color: #8fd06b; }
.ach-stars.t3 { color: #7fb6ff; }
.ach-stars.t5 { color: #ffc93c; }

/* Big pepper-charge bar: rage pours left to right into the chili at the end. */
.rage-meter {
  display: flex;
  align-items: center;
  gap: 10px;
  width: min(700px, 94%);
  margin: 0 auto 8px;
  padding: 7px 12px;
  border-radius: 15px;
  background: linear-gradient(rgba(34, 22, 12, 0.86), rgba(14, 10, 6, 0.94));
  box-shadow: inset 0 0 0 1px rgba(255, 200, 90, 0.22), 0 8px 20px rgba(0, 0, 0, 0.4);
}
.rage-meter .rm-name {
  font-size: 0.6rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #e6b06a;
  white-space: nowrap;
}
.rage-meter .rm-track {
  position: relative;
  flex: 1;
  height: 17px;
  border-radius: 9px;
  background: rgba(0, 0, 0, 0.55);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.13);
  overflow: hidden;
}
.rage-meter .rm-fill {
  display: block;
  height: 100%;
  width: 0%;
  border-radius: 9px;
  background: linear-gradient(90deg, #a94f27, #e8892f 55%, #ffc247);
  box-shadow: 0 0 12px rgba(255, 150, 40, 0.55);
  transition: width 0.45s cubic-bezier(0.3, 0.9, 0.4, 1), background 0.3s;
}
.rage-meter .rm-fill.hot {
  background: linear-gradient(90deg, #d8452f, #ff7a3d 45%, #ffd75e);
  box-shadow: 0 0 18px rgba(255, 110, 40, 0.85);
}
/* Pepper numb: this pig's hits build nothing, so the bar says so plainly. */
.rage-meter.numbed .rm-name { color: #cfe3b0; }
.rage-meter.numbed .rm-fill {
  background: linear-gradient(90deg, #5f6d48, #93a878);
  box-shadow: none;
}
.rage-meter.numbed .rm-track { box-shadow: inset 0 0 0 1px rgba(207, 227, 176, 0.4); }
.rage-meter .rm-mark {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  margin-left: -1px;
  background: rgba(255, 240, 190, 0.5);
}
.rage-meter .rm-val {
  position: absolute;
  right: 7px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.6rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  color: #fff4d6;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
}
.rage-meter .rm-chili {
  position: relative;
  flex: 0 0 auto;
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  font-size: 21px;
  line-height: 1;
  background: radial-gradient(circle at 40% 34%, #4a3324, #241812);
  box-shadow: inset 0 0 0 2px rgba(255, 120, 60, 0.32);
  filter: grayscale(0.75) brightness(0.8);
  transition: transform 0.18s, filter 0.2s, box-shadow 0.2s;
}
.rage-meter .rm-chili .rm-ico { display: block; margin-top: -1px; }
.rage-meter .rm-chili .rm-cost {
  position: absolute;
  right: -3px;
  bottom: -3px;
  min-width: 17px;
  padding: 0 3px;
  border-radius: 9px;
  background: #20140d;
  color: #ffcf8a;
  font-size: 0.56rem;
  font-weight: 800;
  line-height: 17px;
  box-shadow: 0 0 0 1px rgba(255, 200, 120, 0.4);
}
.rage-meter .rm-chili.charged { filter: none; }
.rage-meter .rm-chili.live {
  filter: none;
  box-shadow: 0 0 0 2px #ffcf4d, 0 0 24px rgba(255, 140, 40, 0.9);
  animation: chiliPulse 1.1s ease-in-out infinite;
}
.rage-meter .rm-chili.spent,
.rage-meter .rm-chili.cooling,
.rage-meter .rm-chili.nope {
  filter: grayscale(1) brightness(0.6);
  cursor: default;
}
@keyframes chiliPulse { 50% { transform: scale(1.09); } }
@media (max-width: 640px) {
  .rage-meter { width: 96%; gap: 7px; padding: 6px 8px; }
  .rage-meter .rm-name { display: none; }
  .rage-meter .rm-chili { width: 38px; height: 38px; font-size: 18px; }
}

/* A pig without a pepper shows no cost bubble on the chili. */
.rage-meter .rm-chili .rm-cost:empty { display: none; }

/* ---------------- Touch and small screens ----------------
   One build serves both: a mouse keeps hover, a finger gets taps,
   thumb-sized targets and larger small type. */
html, body {
  touch-action: manipulation; /* no double-tap zoom, no 300ms tap delay */
  overscroll-behavior: none; /* no pull-to-refresh mid-fight */
}

@media (hover: none) {
  /* Hover flourishes would stick after a tap, so only real pointers get them. */
  .icon-btn { min-width: 44px; min-height: 44px; }
  .ability { min-height: 46px; }
  .rage-meter .rm-chili { width: 48px; height: 48px; font-size: 22px; }
  .tab { min-height: 42px; }
  .ability:hover, .btn:hover, .icon-btn:hover, .map-node:hover { transform: none; }
}

@media (max-width: 520px) {
  .ability .ab-desc { font-size: 0.72rem; line-height: 1.22; }
  .hud-hero .who b { font-size: 0.92rem; }
  .hud-hero .who span { font-size: 0.7rem; }
  .rage-meter .rm-name { font-size: 0.64rem; letter-spacing: 0.1em; }
  .rage-meter .rm-val { font-size: 0.68rem; }
  .panel-note { font-size: 0.8rem; }
  .ach-row small { font-size: 0.78rem; line-height: 1.3; }
}

/* Short landscape phones: the stage gives up height before the controls do. */
@media (max-height: 520px) and (orientation: landscape) {
  .stage { min-height: 170px; }
  .hint-bar { font-size: 0.74rem; padding: 4px 8px; }
  .rage-meter { padding: 4px 8px; margin-bottom: 4px; }
  .rage-meter .rm-track { height: 13px; }
  .rage-meter .rm-chili { width: 36px; height: 36px; font-size: 17px; }
}

/* A phone on its side has ~390 px of height in total: trim the stage and the
   action row so the whole fight — stage, hint, rage bar, abilities — fits. */
@media (max-height: 460px) and (orientation: landscape) {
  .stage { min-height: 118px; }
  .hint-bar { padding: 2px 8px; font-size: 0.7rem; }
  .rage-meter { margin-bottom: 3px; padding: 3px 8px; gap: 8px; }
  .rage-meter .rm-track { height: 11px; }
  .rage-meter .rm-chili { width: 32px; height: 32px; font-size: 15px; }
  .hud { min-height: 0; padding: 4px 8px calc(4px + env(safe-area-inset-bottom)); }
  .hud-actions .ability .ab-desc { display: none; }
  .hud-actions .ability { min-height: 34px; }
}

/* Pepper charge readout in the ability's cost slot. */
.ability .cost .pepper-charge {
  font-size: 0.62rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  color: #ffcf8a;
}

/* A dead bird is a ghost: the sprite fades and a 👻 hangs over it. */
.fig .ghost-mark {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: clamp(20px, 5vw, 40px);
  filter: drop-shadow(0 0 10px rgba(190, 220, 255, 0.9));
  pointer-events: none;
}
.fig.ghost .ghost-mark { display: flex; }

/* ============================================================
   Guided tour: dark panels with a hole around the thing to tap,
   a pulsing ring around it and an arrow into the bubble.
   ============================================================ */

.tour-layer {
  position: fixed;
  inset: 0;
  z-index: 9000;
  pointer-events: none;
  font-family: inherit;
}

.tour-block {
  position: absolute;
  background: rgba(6, 12, 6, 0.72);
  pointer-events: auto;
  transition: background 0.2s ease;
}

/* Info steps pass clicks through, so a lesson about the battle does not stop
   the battle. Forced steps keep the dark panels clickable. */
.tour-block.pass {
  pointer-events: none;
  background: rgba(6, 12, 6, 0.42);
}

.tour-ring {
  position: absolute;
  border-radius: 16px;
  border: 3px solid #ffd85e;
  box-shadow: 0 0 0 3px rgba(255, 216, 94, 0.25), 0 0 26px rgba(255, 200, 70, 0.65);
  pointer-events: none;
  animation: tourPulse 1.5s ease-in-out infinite;
}

@keyframes tourPulse {
  50% { border-color: #fff3b0; box-shadow: 0 0 0 6px rgba(255, 216, 94, 0.16), 0 0 34px rgba(255, 200, 70, 0.85); }
}

.tour-arrow {
  position: absolute;
  font-size: 26px;
  line-height: 1;
  transform: translateX(-50%);
  pointer-events: none;
  filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.55));
  animation: tourBob 1.1s ease-in-out infinite;
}

@keyframes tourBob {
  50% { transform: translateX(-50%) translateY(4px); }
}

.tour-bubble {
  position: absolute;
  width: min(340px, calc(100vw - 24px));
  padding: 14px 16px 12px;
  border-radius: 18px;
  color: #f6ffe9;
  background: linear-gradient(#24361f, #131f10);
  border: 2px solid rgba(255, 216, 94, 0.5);
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
  pointer-events: auto;
}

.tour-kicker {
  font-size: 0.6rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #ffd85e;
  font-weight: 800;
}

.tour-title {
  margin: 2px 0 6px;
  font-size: 1.06rem;
  color: #fff6d4;
}

.tour-text {
  margin: 0 0 10px;
  font-size: 0.82rem;
  line-height: 1.42;
  color: #e2f0d2;
}

.tour-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.tour-actions .tour-next {
  flex: 1 1 auto;
  min-height: 38px;
  font-size: 0.86rem;
}

.tour-skip {
  border: 0;
  background: none;
  color: #a9c98d;
  font-family: inherit;
  font-size: 0.72rem;
  font-weight: 700;
  text-decoration: underline;
  cursor: pointer;
  padding: 6px 2px;
  flex: 0 0 auto;
}

.tour-skip:hover { color: #e2f0d2; }

@media (max-width: 520px) {
  .tour-text { font-size: 0.78rem; }
  .tour-title { font-size: 0.98rem; }
}

/* ============================================================
   Readability pass
   Solid secondary buttons, a close button on every sheet, the
   top-right XP bar, the new-pig card and the crispy fire VFX.
   ============================================================ */

/* Secondary buttons were white-on-glass and vanished over bright
   backgrounds. They are dark green now, with a hard shadow. */
.btn.ghost {
  background: linear-gradient(#3d5731, #24391b);
  color: #eaf7d8;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35), 0 4px 0 rgba(0, 0, 0, 0.32);
}
.btn.ghost:hover { background: linear-gradient(#4a6839, #2c451f); }
.btn.small.ghost {
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.32), 0 3px 0 rgba(0, 0, 0, 0.3);
}
.btn.ghost:disabled { filter: grayscale(0.6) brightness(0.6); }

/* ✕ on every sheet that is not a cutscene. */
.sheet { position: relative; }
.sheet-x {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 6;
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #26371c;
  color: #ffe9a8;
  font-family: inherit;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.35), 0 3px 0 rgba(0, 0, 0, 0.35);
}
.sheet-x:hover { background: #34492a; }
.sheet-x:active { transform: translateY(2px); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.3); }

/* Top-right XP bar on the map. */
.xp-pill {
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 6px 10px;
  border-radius: 999px;
  background: rgba(9, 20, 8, 0.55);
  box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.2);
}
.xp-lv { font-size: 0.72rem; font-weight: 800; color: #ffe9a8; white-space: nowrap; }
.xp-core { display: flex; flex-direction: column; align-items: stretch; gap: 2px; }
.xp-label { font-size: 7px; line-height: 1; letter-spacing: 0.1em; text-align: center; text-transform: uppercase; color: #b9d3a2; }
.xp-track {
  width: 86px;
  height: 8px;
  border-radius: 999px;
  background: #16240f;
  overflow: hidden;
  box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.6);
}
.xp-track i {
  display: block;
  height: 100%;
  border-radius: 999px;
  background: linear-gradient(#9ee05a, #4f9426);
  transition: width 0.25s ease;
}
.xp-pill b { font-size: 0.68rem; color: #d9edc4; white-space: nowrap; }
.title-xp { display: flex; justify-content: center; margin: 7px 0 3px; }
.title-xp .xp-pill { background: rgba(9, 20, 8, 0.72); }
.base-xp { margin-left: 12px; }
.base-xp .xp-pill { background: rgba(9, 20, 8, 0.5); }
@media (max-width: 640px) {
  .xp-pill { padding: 4px 7px; }
  .xp-track { width: 52px; }
  .xp-pill b { display: none; }
}

/* New pig card. */
.recruit-pop { display: flex; align-items: center; gap: 14px; margin: 10px 0 6px; }
.recruit-pop .rp-art { width: 96px; flex: 0 0 auto; }
.recruit-pop .rp-art svg { width: 100%; height: auto; display: block; }
.recruit-pop .rp-body { display: flex; flex-direction: column; gap: 3px; }
.recruit-pop .rp-body b { color: #ffe9a8; }
.recruit-pop .rp-body span { font-size: 0.86rem; line-height: 1.35; }
.recruit-pop .rp-body small { color: #b9d3a2; font-size: 0.74rem; }

/* Crispy: anything set on fire shakes and throws embers. */
.fig.crispy { animation: crispyShake 0.5s ease; }
@keyframes crispyShake {
  0%, 100% { transform: none; }
  20% { transform: translate(-2px, 1px) rotate(-2deg); }
  45% { transform: translate(2px, -1px) rotate(2deg); }
  70% { transform: translate(-1px, 1px); }
}
.fig > .ember {
  position: absolute;
  bottom: 34%;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle, #fff6b0 0%, #ff9a24 55%, rgba(255, 90, 20, 0) 72%);
  animation: emberUp 0.8s ease-out forwards;
  z-index: 3;
}
@keyframes emberUp {
  from { opacity: 1; transform: translate(0, 0) scale(1); }
  to { opacity: 0; transform: translate(var(--dx, 0px), var(--dy, -40px)) scale(0.35); }
}

/* ============================================================
   Crafted weapons and free pig selection
   ============================================================ */

/* The crafted weapon is an SVG group in the pig's right hoof. */
.held-weapon { filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.4)); }

/* A flat ring on the ground marks every pig that still has an action. */
.fig.hero { cursor: pointer; }
.fig.hero .art { position: relative; z-index: 1; }
.fig.hero .ground-ring {
  position: absolute;
  left: 4%;
  right: 4%;
  bottom: 27%;
  height: 16%;
  border-radius: 50%;
  border: 2px solid rgba(255, 226, 120, 0.8);
  background: radial-gradient(ellipse at center, rgba(255, 231, 140, 0.26), rgba(255, 216, 90, 0) 72%);
  box-shadow: 0 0 12px rgba(255, 216, 90, 0.3);
  transform: scaleY(0.52);
  opacity: 0;
  transition: opacity 0.2s, border-color 0.2s, box-shadow 0.2s;
  pointer-events: none;
  z-index: 0;
}
.fig.hero.can-act .ground-ring {
  opacity: 1;
  animation: groundRingPulse 1.7s ease-in-out infinite;
}
.fig.hero.active .ground-ring {
  opacity: 1;
  border-color: #fff8c8;
  box-shadow: 0 0 20px rgba(255, 226, 100, 0.8), inset 0 0 14px rgba(255, 226, 100, 0.25);
  animation: none;
}
.fig.hero.acted .ground-ring { opacity: 0; }
@keyframes groundRingPulse {
  50% { opacity: 0.6; border-color: rgba(255, 245, 180, 0.95); box-shadow: 0 0 18px rgba(255, 216, 90, 0.55); }
}

/* Crafted-weapon cards in the inventory and workshop. */
.cw-list { display: flex; flex-direction: column; gap: 8px; }
.cw-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 14px;
  background: linear-gradient(#243d1a, #172a11);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
}
.cw-ico {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  flex: 0 0 42px;
  border-radius: 12px;
  font-size: 1.4rem;
  background: rgba(0, 0, 0, 0.28);
  box-shadow: inset 0 0 0 2px var(--weapon, #ffd45e);
}
.cw-body { flex: 1; min-width: 0; }
.cw-body b { display: block; color: #ffe9a8; font-size: 0.9rem; }
.cw-body small { display: block; margin-top: 2px; color: #b9d3a2; font-size: 0.74rem; line-height: 1.3; }
.cw-holder { display: block; margin-top: 3px; color: #8fe08a; font-size: 0.7rem; font-weight: 800; }
.cw-select {
  max-width: 150px;
  flex: 0 0 auto;
  padding: 8px 10px;
  border: 2px solid rgba(255, 226, 120, 0.45);
  border-radius: 10px;
  background: #12220d;
  color: #eaf7d8;
  font: inherit;
  font-size: 0.78rem;
  font-weight: 700;
  cursor: pointer;
}
.cw-select:focus { outline: 2px solid #ffe9a8; outline-offset: 1px; }
.cw-workshop .cw-select { width: 100%; max-width: none; margin-top: 6px; }
@media (max-width: 520px) {
  .cw-card { flex-wrap: wrap; }
  .cw-select { width: 100%; max-width: none; }
}

/* ============================================================
   Attack choreography, impact rings and phase-two screen effects
   ------------------------------------------------------------
   Battle.choreograph() puts exactly one atk-* class on a figure,
   and Battle.impact() drops a ring. Both are transform/filter
   only, so they compose with the existing hurt and KO states.
   ============================================================ */

/* A plain peck: a short drive forward, a snap back. Pigs strike right,
   birds strike left. */
.fig.atk-peck { animation: atkPeck 0.52s cubic-bezier(0.25, 0.8, 0.3, 1); }
.fig.enemy.atk-peck { animation-name: atkPeckLeft; }
@keyframes atkPeck {
  0% { transform: translateX(0) translateY(0); }
  38% { transform: translateX(26px) translateY(-7px) rotate(3deg); }
  58% { transform: translateX(30px) translateY(1px) rotate(-2deg); }
  100% { transform: translateX(0) translateY(0); }
}
@keyframes atkPeckLeft {
  0% { transform: translateX(0) translateY(0); }
  38% { transform: translateX(-26px) translateY(-7px) rotate(-3deg); }
  58% { transform: translateX(-30px) translateY(1px) rotate(2deg); }
  100% { transform: translateX(0) translateY(0); }
}

/* A slam: wind up on the heels, then come down hard. */
.fig.atk-slam { animation: atkSlam 0.66s cubic-bezier(0.4, 0.1, 0.5, 1); }
.fig.enemy.atk-slam { animation-name: atkSlamLeft; }
@keyframes atkSlam {
  0% { transform: translateX(0) translateY(0) scale(1); }
  24% { transform: translateX(-12px) translateY(-20px) scale(1.04, 1.02); }
  52% { transform: translateX(34px) translateY(10px) scale(0.96, 0.92); }
  70% { transform: translateX(22px) translateY(2px) scale(1.02, 1); }
  100% { transform: translateX(0) translateY(0) scale(1); }
}
@keyframes atkSlamLeft {
  0% { transform: translateX(0) translateY(0) scale(1); }
  24% { transform: translateX(12px) translateY(-22px) scale(1.04, 1.02); }
  52% { transform: translateX(-36px) translateY(12px) scale(0.96, 0.9); }
  70% { transform: translateX(-24px) translateY(2px) scale(1.02, 1); }
  100% { transform: translateX(0) translateY(0) scale(1); }
}

/* A flurry: short, fast, sideways, so multi-hits read as many blows. */
.fig.atk-spin { animation: atkSpin 0.6s ease-in-out; }
.fig.enemy.atk-spin { animation-name: atkSpinLeft; }
@keyframes atkSpin {
  0% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(20px) rotate(5deg); }
  40% { transform: translateX(8px) rotate(-5deg); }
  62% { transform: translateX(26px) rotate(4deg); }
  100% { transform: translateX(0) rotate(0); }
}
@keyframes atkSpinLeft {
  0% { transform: translateX(0) rotate(0); }
  20% { transform: translateX(-20px) rotate(-5deg); }
  40% { transform: translateX(-8px) rotate(5deg); }
  62% { transform: translateX(-26px) rotate(-4deg); }
  100% { transform: translateX(0) rotate(0); }
}

/* A dive: up off the ground, then straight down onto the target. */
.fig.atk-dive { animation: atkDive 0.62s cubic-bezier(0.3, 0.9, 0.4, 1); }
.fig.enemy.atk-dive { animation-name: atkDiveLeft; }
@keyframes atkDive {
  0% { transform: translateY(0) scale(1); }
  32% { transform: translateY(-30px) scale(1.03); }
  62% { transform: translateY(6px) translateX(30px) scale(0.97); }
  100% { transform: translateY(0) translateX(0) scale(1); }
}
@keyframes atkDiveLeft {
  0% { transform: translateY(0) scale(1); }
  32% { transform: translateY(-32px) scale(1.03); }
  62% { transform: translateY(6px) translateX(-32px) scale(0.97); }
  100% { transform: translateY(0) translateX(0) scale(1); }
}

/* A cast: the bird stays where it is and the air does the work. */
.fig.atk-cast { animation: atkCast 0.7s ease-in-out; }
@keyframes atkCast {
  0% { transform: translateY(0) scale(1); }
  40% { transform: translateY(-12px) scale(1.05); }
  70% { transform: translateY(-6px) scale(1.02); }
  100% { transform: translateY(0) scale(1); }
}

/* The hit itself: a ring that expands past the figure and fades. */
.impact-ring {
  position: absolute;
  width: 30px;
  height: 30px;
  margin: -15px 0 0 -15px;
  border-radius: 50%;
  border: 3px solid var(--ring, #ffd9a8);
  box-shadow: 0 0 10px var(--ring, #ffd9a8);
  z-index: 8;
  pointer-events: none;
  animation: impactRing 0.6s cubic-bezier(0.1, 0.7, 0.3, 1) forwards;
}
.impact-ring.hard { border-width: 4px; animation-duration: 0.72s; }
@keyframes impactRing {
  0% { opacity: 0.95; transform: scale(0.3); }
  70% { opacity: 0.5; }
  100% { opacity: 0; transform: scale(3.4); }
}

/* Boss phase two, a berserk bird, or a near-death squad: a coloured edge
   that fades on its own. */
.stage-vignette {
  position: absolute;
  inset: 0;
  z-index: 7;
  pointer-events: none;
  background: radial-gradient(circle at 50% 46%, transparent 40%, var(--vig, rgba(255, 70, 40, 0.55)) 100%);
  animation: vignettePulse 1.4s ease-out forwards;
}
@keyframes vignettePulse {
  0% { opacity: 0; }
  22% { opacity: 1; }
  100% { opacity: 0; }
}

/* No animation here on purpose: the stage already runs shake keyframes, and a
   second animation would replace them. A transitioned inset glow composes. */
.stage { transition: box-shadow 0.7s ease; }
.stage.danger { box-shadow: inset 0 0 80px 12px rgba(214, 46, 32, 0.4); }
.stage.danger .fig.hero .hp-track.low i { animation: dangerPip 1.2s ease-in-out infinite; }
@keyframes dangerPip { 50% { filter: brightness(1.6); } }

/* The boss flip: a huge shockwave ring and a gold-red wash over the field.
   The wash is a separate layer with backdrop-filter, so it can brighten and
   saturate the whole stage without touching the stage's own transform. */
.impact-ring.huge {
  width: 70px;
  height: 70px;
  margin: -35px 0 0 -35px;
  border-width: 5px;
  animation-name: impactRingHuge;
  animation-duration: 1s;
}
@keyframes impactRingHuge {
  0% { opacity: 0.95; transform: scale(0.22); }
  55% { opacity: 0.55; }
  100% { opacity: 0; transform: scale(6.2); }
}

.boss-wash {
  position: absolute;
  inset: 0;
  z-index: 6;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 48%, rgba(255, 246, 214, 0.8) 0%, rgba(255, 146, 60, 0.42) 28%, rgba(180, 24, 24, 0) 64%);
  backdrop-filter: saturate(1.45) contrast(1.08);
  animation: bossWash 0.95s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
}
@keyframes bossWash {
  0% { opacity: 0; }
  12% { opacity: 1; }
  55% { opacity: 0.35; }
  100% { opacity: 0; }
}

/* ============================================================
   Title world — biomes that drift past, under a day/night cycle
   The menu sky is a track of authored panels moving slowly behind
   the board. --day (0 night .. 1 noon) is driven from game.js, so
   the same hills are dawn, noon, dusk and midnight.
   ============================================================ */
#screen-title .world-track {
  position: absolute;
  inset: 0;
  display: flex;
  width: 400%;
  height: 100%;
  will-change: transform;
}

#screen-title .biome {
  position: relative;
  flex: 0 0 25%;
  height: 100%;
  overflow: hidden;
}

#screen-title .biome > span {
  position: absolute;
  left: -2%;
  right: -2%;
  display: block;
  pointer-events: none;
}

/* --- Night carnival --- */
#screen-title .b-night {
  background: linear-gradient(#050510 0%, #120f30 40%, #241a4c 68%, #3c2452 100%);
}
#screen-title .b-night .bio-far {
  bottom: 12%;
  height: 40%;
  background: linear-gradient(#2c2352, #171130);
  clip-path: polygon(0 66%, 14% 40%, 30% 60%, 44% 30%, 58% 56%, 72% 34%, 86% 62%, 100% 42%, 100% 100%, 0 100%);
  opacity: 0.8;
}
#screen-title .b-night .bio-mid {
  bottom: 4%;
  height: 34%;
  background: linear-gradient(#191334, #0a0818);
  clip-path: polygon(0 52%, 18% 28%, 34% 52%, 52% 22%, 70% 48%, 84% 30%, 100% 54%, 100% 100%, 0 100%);
}
#screen-title .b-night .bio-prop {
  left: 66%;
  right: auto;
  bottom: 32%;
  width: clamp(86px, 9vw, 132px);
  height: clamp(86px, 9vw, 132px);
  border-radius: 50%;
  border: 3px solid rgba(255, 196, 128, 0.22);
  background: repeating-conic-gradient(from 0deg, rgba(255, 196, 128, 0.16) 0 2deg, transparent 2deg 24deg);
  box-shadow: 0 0 34px rgba(255, 170, 90, 0.16);
}
#screen-title .b-night .bio-prop::after {
  content: "";
  position: absolute;
  inset: 44%;
  border-radius: 50%;
  background: rgba(255, 206, 140, 0.35);
}

/* --- Amber dunes --- */
#screen-title .b-dunes {
  background: linear-gradient(#2a1436 0%, #5d2442 30%, #a9422f 54%, #e0723f 76%, #ffb266 100%);
}
#screen-title .b-dunes .bio-far {
  bottom: 16%;
  height: 38%;
  background: linear-gradient(#7d3627, #52251f);
  clip-path: polygon(0 70%, 9% 44%, 9% 36%, 20% 36%, 20% 58%, 34% 58%, 34% 30%, 46% 30%, 46% 64%, 60% 64%, 60% 42%, 72% 42%, 72% 66%, 86% 66%, 86% 38%, 100% 38%, 100% 100%, 0 100%);
  opacity: 0.75;
}
#screen-title .b-dunes .bio-mid {
  bottom: 2%;
  height: 30%;
  background: linear-gradient(#c06a3a, #7d3f23);
  clip-path: polygon(0 62%, 20% 50%, 38% 66%, 58% 46%, 78% 64%, 100% 50%, 100% 100%, 0 100%);
}
#screen-title .b-dunes .bio-prop {
  left: 22%;
  right: auto;
  bottom: 30%;
  width: 12px;
  height: 46px;
  border-radius: 8px;
  background: #3d1d22;
  box-shadow: 9px 8px 0 -5px #3d1d22, -8px -10px 0 -5px #3d1d22;
}

/* --- Frost peaks --- */
#screen-title .b-frost {
  background: linear-gradient(#070c22 0%, #123055 34%, #2d6d88 62%, #8fd0de 84%, #cdeef6 100%);
}
#screen-title .b-frost .bio-far {
  bottom: 14%;
  height: 46%;
  background: linear-gradient(#cfe9f5, #7fa9c4);
  clip-path: polygon(0 78%, 8% 36%, 16% 60%, 26% 20%, 36% 58%, 46% 34%, 56% 68%, 66% 26%, 76% 62%, 86% 38%, 100% 72%, 100% 100%, 0 100%);
  opacity: 0.5;
}
#screen-title .b-frost .bio-mid {
  bottom: 2%;
  height: 32%;
  background: linear-gradient(#1b3a4a, #0a1a24);
  clip-path: polygon(0 60%, 10% 40%, 18% 56%, 26% 34%, 34% 58%, 44% 38%, 52% 60%, 62% 34%, 70% 58%, 80% 40%, 90% 58%, 100% 44%, 100% 100%, 0 100%);
}
#screen-title .b-frost .bio-prop {
  left: 6%;
  right: auto;
  bottom: 38%;
  width: 64%;
  height: 22%;
  border-radius: 50%;
  background: linear-gradient(90deg, transparent, rgba(120, 255, 214, 0.3), rgba(168, 144, 255, 0.24), transparent);
  filter: blur(9px);
  transform: rotate(-3deg);
}

/* --- The cycle itself: one cool wash at night, one warm wash by day --- */
#screen-title .sky-nightwash,
#screen-title .sky-daywash {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
}
#screen-title .sky-nightwash {
  background: linear-gradient(180deg, #04061c, #170e33);
  mix-blend-mode: multiply;
  opacity: calc((1 - var(--day, 0)) * 0.74);
}
#screen-title .sky-daywash {
  background: linear-gradient(180deg, #ffeec4, #ff9f4f);
  mix-blend-mode: screen;
  opacity: calc(var(--day, 0) * 0.46);
}

#screen-title .sky-sun {
  position: absolute;
  z-index: 3;
  width: 74px;
  height: 74px;
  margin: -37px 0 0 -37px;
  border-radius: 50%;
  background: radial-gradient(circle at 42% 38%, #fffbe8, #ffe08a 52%, #ffae4d 100%);
  box-shadow: 0 0 56px rgba(255, 214, 132, 0.8), 0 0 150px rgba(255, 170, 80, 0.45);
  pointer-events: none;
  transition: opacity 0.6s linear;
}

#screen-title .sky-moon {
  right: auto;
  margin: -44px 0 0 -44px;
  z-index: 3;
  transition: opacity 0.6s linear;
}

#screen-title .sky-stars {
  z-index: 3;
  opacity: 1;
}

/* Stars fade with the sky instead of twinkling at full strength by day. */
@keyframes starTwinkle {
  from { opacity: calc(0.4 * var(--night, 1)); }
  to { opacity: calc(0.92 * var(--night, 1)); }
}

/* ============================================================
   Menu motion pass — sheets, tabs, cards, toasts
   Every menu surface gets the same three-beat feel: the backdrop
   fades, the panel pops past its size and settles, and the rows
   underneath arrive in a short wave instead of all at once.
   Only menu selectors are animated, so battle staging is untouched.
   ============================================================ */

/* Backdrop: blur fades in with the dim instead of snapping. */
.overlay { animation: overlayFade 0.22s ease-out both; }
@keyframes overlayFade {
  from { opacity: 0; backdrop-filter: blur(0); }
  to { opacity: 1; backdrop-filter: blur(5px); }
}

/* Sheets overshoot a hair, then settle. */
.sheet { animation: sheetPop 0.34s cubic-bezier(0.18, 1.16, 0.3, 1) both; transform-origin: 50% 38%; }
@keyframes sheetPop {
  0% { opacity: 0; transform: translateY(24px) scale(0.94); }
  60% { opacity: 1; transform: translateY(-3px) scale(1.012); }
  100% { opacity: 1; transform: translateY(0) scale(1); }
}

.sheet .eyebrow { animation: headRise 0.34s both ease-out; }
.sheet h2 { animation: headRise 0.4s 0.04s both cubic-bezier(0.2, 0.9, 0.3, 1); }
@keyframes headRise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Rows and cards land in a wave. */
.index-grid > *,
.ach-list > *,
.relic-grid > *,
.hero-grid > *,
.shop-list > *,
.entry-moves > * {
  animation: cardRise 0.34s both cubic-bezier(0.2, 0.9, 0.3, 1);
}
@keyframes cardRise {
  from { opacity: 0; transform: translateY(10px) scale(0.985); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
.index-grid > *:nth-child(2), .ach-list > *:nth-child(2), .relic-grid > *:nth-child(2),
.hero-grid > *:nth-child(2), .shop-list > *:nth-child(2), .entry-moves > *:nth-child(2) { animation-delay: 0.03s; }
.index-grid > *:nth-child(3), .ach-list > *:nth-child(3), .relic-grid > *:nth-child(3),
.hero-grid > *:nth-child(3), .shop-list > *:nth-child(3), .entry-moves > *:nth-child(3) { animation-delay: 0.06s; }
.index-grid > *:nth-child(4), .ach-list > *:nth-child(4), .relic-grid > *:nth-child(4),
.hero-grid > *:nth-child(4), .shop-list > *:nth-child(4), .entry-moves > *:nth-child(4) { animation-delay: 0.09s; }
.index-grid > *:nth-child(5), .ach-list > *:nth-child(5), .relic-grid > *:nth-child(5),
.hero-grid > *:nth-child(5), .shop-list > *:nth-child(5), .entry-moves > *:nth-child(5) { animation-delay: 0.12s; }
.index-grid > *:nth-child(6), .ach-list > *:nth-child(6), .relic-grid > *:nth-child(6),
.hero-grid > *:nth-child(6), .shop-list > *:nth-child(6), .entry-moves > *:nth-child(6) { animation-delay: 0.15s; }
.index-grid > *:nth-child(7), .ach-list > *:nth-child(7), .relic-grid > *:nth-child(7),
.hero-grid > *:nth-child(7), .shop-list > *:nth-child(7), .entry-moves > *:nth-child(7) { animation-delay: 0.18s; }

/* A bird or pig card slides its art in beside the text. */
.entry-detail .entry-art { animation: artPop 0.44s both cubic-bezier(0.2, 0.9, 0.3, 1.1); }
.entry-detail .entry-body { animation: headRise 0.4s 0.05s both ease-out; }
@keyframes artPop {
  from { opacity: 0; transform: translateY(12px) scale(0.9) rotate(-2deg); }
  to { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
}

/* Tabs answer the tap. */
.tab, .world-tab {
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
}
.tab:hover, .world-tab:hover { transform: translateY(-1px); }
.tab:active, .world-tab:active { transform: translateY(1px) scale(0.98); }
.tab.on, .world-tab.on { animation: tabPop 0.28s cubic-bezier(0.2, 0.9, 0.3, 1.3) both; }
@keyframes tabPop {
  0% { transform: scale(0.94); }
  60% { transform: scale(1.045); }
  100% { transform: scale(1); }
}

/* Buttons lift off the page and press back into it. */
.btn { transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
.btn:active { transform: translateY(1px) scale(0.99); filter: brightness(0.98); }

/* Cards lean toward the pointer. */
.index-card, .hero-card, .relic-card, .ach-row, .tool, .tq {
  transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
}
.index-card:hover, .hero-card:hover, .relic-card:hover, .tool:hover, .tq:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 24px rgba(0, 0, 0, 0.34), inset 0 0 0 1px rgba(255, 224, 140, 0.26);
}
.index-card:active, .hero-card:active, .tq:active { transform: translateY(0) scale(0.99); }

/* Toasts pop in from the side. */
.toast { animation: toastPop 0.34s cubic-bezier(0.2, 1.2, 0.3, 1) both; }
@keyframes toastPop {
  from { opacity: 0; transform: translateX(-16px) scale(0.94); }
  to { opacity: 1; transform: translateX(0) scale(1); }
}

/* The title board arrives under the logo. */
#screen-title .title-kicker,
#screen-title .logo-sub,
#screen-title .title-desc,
#screen-title .title-heroes,
#screen-title .title-board,
#screen-title .title-foot {
  animation: cardRise 0.5s both cubic-bezier(0.2, 0.9, 0.3, 1);
}
#screen-title .title-kicker { animation-delay: 0.02s; }
#screen-title .logo-sub { animation-delay: 0.07s; }
#screen-title .title-desc { animation-delay: 0.11s; }
#screen-title .title-heroes { animation-delay: 0.15s; }
#screen-title .title-board { animation-delay: 0.2s; }
#screen-title .title-foot { animation-delay: 0.28s; }

@media (prefers-reduced-motion: reduce) {
  .overlay, .sheet, .sheet h2, .sheet .eyebrow,
  .index-grid > *, .ach-list > *, .relic-grid > *, .hero-grid > *,
  .shop-list > *, .entry-moves > *, .entry-detail .entry-art,
  .entry-detail .entry-body, .tab.on, .world-tab.on, .toast,
  #screen-title .title-kicker, #screen-title .logo-sub, #screen-title .title-desc,
  #screen-title .title-heroes, #screen-title .title-board, #screen-title .title-foot {
    animation: none !important;
  }
  .btn, .tab, .world-tab, .index-card, .hero-card, .relic-card, .ach-row, .tool, .tq { transition: none !important; }
}

/* ---------------- Per-pig XP ----------------
   Each pig levels on its own now, so the party grid and the pig card carry a
   small bar showing how far that one pig is from its next level. */
.pig-xp {
  display: flex;
  align-items: center;
  gap: 7px;
  margin-top: 6px;
  font-size: 11.5px;
  line-height: 1.2;
}
.pig-xp .track {
  flex: 1 1 auto;
  min-width: 44px;
  height: 6px;
  border-radius: 99px;
  background: rgba(0, 0, 0, .16);
  overflow: hidden;
}
.pig-xp .track i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: linear-gradient(90deg, #ffd34e, #7cc33f);
  transition: width .3s ease;
}
.pig-xp em { font-style: normal; opacity: .78; white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .pig-xp .track i { transition: none; }
}

/* ============================================================
   High-contrast pass
   ------------------------------------------------------------
   Brighter ink on deeper glass, and controls with a real bevel so
   they read as physical buttons: light top edge, dark bottom edge,
   a hard drop shadow and a short travel when pressed.
   ============================================================ */

.screen, .sheet, .overlay, .hud, .battle-top { text-shadow: 0 1px 2px rgba(0, 0, 0, .45); }

/* Body copy that used to sit at 60-70% opacity. */
.mv span, .reward-line span, .panel-note, .tip-line, .hc-trait, .idx-stats,
.entry-body p, .sheet p, .howto { color: #edf7dd; }
.reward-line b, .mv b, .sheet h2, .sheet h3, .base-h { color: #fffdf0; }

/* --- Buttons -------------------------------------------------- */

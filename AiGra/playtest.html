.btn {
  border: 1px solid rgba(255, 255, 255, .30);
  background-image: linear-gradient(180deg, #bcf07a 0%, #7ec93c 46%, #5da52a 100%);
  text-shadow: 0 1px 0 rgba(255, 255, 255, .40);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .70),
    inset 0 -3px 0 rgba(24, 50, 10, .35),
    0 6px 0 #2f5513,
    0 12px 22px rgba(0, 0, 0, .45);
}
.btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.07) saturate(1.04);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .75),
    inset 0 -3px 0 rgba(24, 50, 10, .35),
    0 8px 0 #2f5513,
    0 16px 26px rgba(0, 0, 0, .48);
}
.btn:active {
  transform: translateY(3px);
  filter: brightness(.97);
  box-shadow:
    inset 0 3px 8px rgba(0, 0, 0, .42),
    0 2px 0 #2f5513,
    0 5px 10px rgba(0, 0, 0, .40);
}
.btn:focus-visible { outline: 3px solid #ffe9a1; outline-offset: 3px; }
.btn:disabled { transform: none; box-shadow: inset 0 1px 0 rgba(255,255,255,.14), 0 3px 0 rgba(0,0,0,.28); }

.btn.gold {
  border-color: rgba(255, 255, 255, .38);
  background-image: linear-gradient(180deg, #ffe790, #f7c948 48%, #d5a019);
  color: #3a2606;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .55);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .80),
    inset 0 -3px 0 rgba(96, 60, 0, .38),
    0 6px 0 #8a5f0c,
    0 12px 22px rgba(0, 0, 0, .45);
}
.btn.gold:active { box-shadow: inset 0 3px 8px rgba(70, 44, 0, .40), 0 2px 0 #8a5f0c, 0 5px 10px rgba(0,0,0,.4); }

.btn.ghost {
  color: #f5fce8;
  border-color: rgba(190, 226, 150, .38);
  background-image: linear-gradient(180deg, rgba(64, 94, 46, .96), rgba(28, 46, 22, .96));
  text-shadow: 0 1px 2px rgba(0, 0, 0, .55);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .22),
    0 5px 0 rgba(8, 18, 7, .55),
    0 10px 18px rgba(0, 0, 0, .40);
}
.btn.ghost:active { box-shadow: inset 0 3px 8px rgba(0, 0, 0, .50), 0 2px 0 rgba(8,18,7,.5), 0 4px 8px rgba(0,0,0,.35); }

.btn.small {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .60),
    inset 0 -2px 0 rgba(24, 50, 10, .35),
    0 4px 0 #2f5513,
    0 8px 14px rgba(0, 0, 0, .40);
}
.btn.small.ghost {
  box-shadow: inset 0 1px 0 rgba(255,255,255,.20), 0 3px 0 rgba(8,18,7,.55), 0 6px 12px rgba(0,0,0,.35);
}

/* Battle abilities sit in the same pressed-metal family. */
.ability {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .26),
    inset 0 -3px 0 rgba(0, 0, 0, .32),
    0 6px 0 rgba(0, 0, 0, .30),
    0 10px 18px rgba(0, 0, 0, .35);
  transition: transform .1s ease, box-shadow .1s ease, filter .1s ease;
}
.ability:hover:not([disabled]) { transform: translateY(-2px); filter: brightness(1.08); }
.ability:active:not([disabled]) { transform: translateY(3px); box-shadow: inset 0 3px 9px rgba(0,0,0,.42), 0 2px 0 rgba(0,0,0,.28); }

/* --- Cards ---------------------------------------------------- */
.hero-card, .index-card, .workshop-card, .potion-card, .ach-row, .recipe-cost {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .20),
    inset 0 -2px 0 rgba(0, 0, 0, .38),
    0 10px 20px rgba(0, 0, 0, .32);
  transition: transform .15s ease, box-shadow .15s ease;
}
.hero-card:hover, .index-card:hover {
  transform: translateY(-3px);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .28),
    0 16px 28px rgba(0, 0, 0, .45);
}

/* --- Sheets, tabs, meters ------------------------------------- */
.sheet {
  border: 1px solid rgba(255, 255, 255, .16);
  box-shadow: 0 30px 60px rgba(0, 0, 0, .62), inset 0 1px 0 rgba(255, 255, 255, .14);
}
.tab.on, .world-tab.on {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .40),
    0 4px 0 rgba(0, 0, 0, .35),
    0 8px 16px rgba(0, 0, 0, .30);
}
.hp-track, .xp-track, .pig-xp .track { box-shadow: inset 0 2px 5px rgba(0, 0, 0, .40); }

/* Bigger text in the detail sheets: the attack list is what players read. */
.entry-moves .mv span { font-size: 13px; line-height: 1.5; }
.entry-moves .mv b { font-size: 13.5px; }

@media (prefers-reduced-motion: reduce) {
  .btn:hover, .btn:active, .ability:hover, .ability:active,
  .hero-card:hover, .index-card:hover { transform: none; }
}

/* --- Readability -------------------------------------------------
   Battle action text was 9.6px and card footnotes 9px: legible on a big
   monitor, unreadable on a laptop. Bumped to a size you can actually read
   mid-fight, with darker ink on the pale cards. */
.ability .ab-desc { font-size: 11px; line-height: 1.4; color: #241d0c; }
.ability .ab-name { font-size: 12.5px; font-weight: 900; color: #1f3310; letter-spacing: .01em; }
.ability .ab-ico { font-size: 16px; }
.ability .cost { font-size: 11px; font-weight: 800; }
.idx-moves { font-size: 11px; line-height: 1.35; color: #6a5211; }
.idx-world { font-size: 10px; color: #5d6b4c; }
.idx-stats { font-size: 11px; font-weight: 800; color: #1f3310; }
.forge-card .fc-body small { font-size: 10px; opacity: .88; }
.panel-note, .tip-line, .hint-bar { font-size: 12.5px; }

/* Battle action lines were a single clipped line, so the damage number was the
   first thing to be cut off. Two lines fit, and the wounds stay readable. */
.ability .ab-desc {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  white-space: normal;
  overflow: hidden;
  text-overflow: clip;
  height: auto;
}

/* ---------------- Party on the road ----------------
   The squad stands on the map node they have reached, so clicking a road
   visibly walks them there before the node opens. */
.map-party { pointer-events: none; filter: drop-shadow(0 3px 3px rgba(0, 0, 0, .35)); }
.map-party circle { transition: none; }

/* ---------------- Pastel controls ----------------
   The dark olive buttons were the heaviest thing on the screen. They keep the
   chalky edge and the pressed-in depth, but the fill is soft pastel now with
   dark ink, so labels still read at a glance instead of sinking into the HUD. */
.btn.ghost {
  color: #2c3f21;
  border-color: rgba(255, 255, 255, 0.62);
  background-image: linear-gradient(180deg, #eaf7dd, #cae9b4 54%, #b4dd9c);
  text-shadow: 0 1px 0 rgba(255, 255, 255, 0.75);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.92),
    inset 0 -3px 0 rgba(96, 136, 74, 0.26),
    0 5px 0 #9cc186,
    0 10px 18px rgba(0, 0, 0, 0.26);
}
.btn.ghost:hover { transform: translateY(-2px); filter: brightness(1.04) saturate(0.96); }
.btn.ghost:active {
  box-shadow: inset 0 3px 8px rgba(96, 136, 74, 0.32), 0 2px 0 #9cc186, 0 4px 8px rgba(0, 0, 0, 0.22);
}
.btn.small.ghost {
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    inset 0 -2px 0 rgba(96, 136, 74, 0.24),
    0 3px 0 #9cc186,
    0 6px 12px rgba(0, 0, 0, 0.22);
}

/* Round header chips: pastel buttons instead of near-black glass. */
.icon-btn {
  color: #2f4224;
  background-image: linear-gradient(180deg, #f7fbea, #ddecc9 60%, #c9dfb0);
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    inset 0 -2px 0 rgba(96, 136, 74, 0.22),
    0 3px 0 #a6c48f,
    0 6px 12px rgba(0, 0, 0, 0.25);
  text-shadow: none;
}
.icon-btn:hover { filter: brightness(1.04); }
.icon-btn:active {
  transform: translateY(2px);
  box-shadow: inset 0 2px 6px rgba(96, 136, 74, 0.3), 0 1px 0 #a6c48f;
}

/* World tabs: mint chips, butter for the one you are standing in, lilac for
   the dungeon, greyscale mint for a sealed road. */
.world-tab {
  color: #31452a;
  background-image: linear-gradient(180deg, #f3f9e7, #daeac7 62%, #c7ddaf);
  border: 1px solid rgba(255, 255, 255, 0.65);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 3px 0 #a8c692,
    0 6px 12px rgba(0, 0, 0, 0.22);
}
.world-tab.on {
  color: #3c2c06;
  background-image: linear-gradient(180deg, #fff5cb, #f8e2a0 60%, #edcf80);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.95),
    0 4px 0 #cfae5c,
    0 8px 16px rgba(0, 0, 0, 0.25);
}
.world-tab.locked {
  color: #57634c;
  background-image: linear-gradient(180deg, #f1f3eb, #e0e4d6 62%, #d2d7c7);
  opacity: 0.92;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 2px 0 #b9bfae;
}
.world-tab.dungeon-tab {
  color: #3d2f5c;
  background-image: linear-gradient(180deg, #f0e7fc, #d9c9f3 60%, #c7b4e7);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, 0.9),
    0 3px 0 #b8a2da,
    0 6px 12px rgba(0, 0, 0, 0.22);
}
.world-tab.dungeon-tab.locked {
  color: #57634c;
  background-image: linear-gradient(180deg, #f1f3eb, #e0e4d6 62%, #d2d7c7);
}

/* Base tabs follow the same pastel family. */
.tab {
  color: #2f4224;
  background-image: linear-gradient(180deg, #f6fbea, #e2f0d2 62%, #d2e5bd);
  border: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 3px 0 #aecb98, 0 6px 12px rgba(0, 0, 0, 0.2);
}
.tab.on {
  color: #3c2c06;
  background-image: linear-gradient(180deg, #fff5cb, #f8e2a0 60%, #edcf80);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 4px 0 #cfae5c, 0 8px 16px rgba(0, 0, 0, 0.22);
}

.btn.danger {
  color: #6b1f13;
  background-image: linear-gradient(180deg, #ffe2da, #f6b9a9 58%, #eea391);
  border-color: rgba(255, 255, 255, 0.6);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 5px 0 #cd8874, 0 10px 18px rgba(0, 0, 0, 0.22);
}

/* ---------------- Ability kinds ----------------
   Attack, help and passive each get their own pastel. Ability rows sit on a
   dark card so the name and body text stay white and the colour actually
   reads, and any self-only passive is tagged above its name. */
.entry-moves .mv {
  background-image: linear-gradient(180deg, rgba(23, 37, 19, 0.95), rgba(13, 24, 11, 0.95));
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: #fdfbef;
}
.entry-moves .mv b { color: #fffdf5; }
.entry-moves .mv span { color: #eef6e2; }
.entry-moves .mv .mv-tag {
  display: block;
  font-size: 9.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #ffffff;
  opacity: 0.9;
  margin-bottom: 2px;
}
.entry-moves .mv.atk span { color: #ffb9b1; }
.entry-moves .mv.help span { color: #b6cfff; }
.entry-moves .mv.passive span { color: #bcecab; }

/* Battle chips keep their pale cards, so the same three colours lean deeper. */
.ability.atk .ab-desc { color: #b34a3c; }
.ability.help .ab-desc { color: #3f6dab; }
.ability.passive .ab-desc { color: #4d7f3a; }
.ability.passive .ab-name { color: #2c5a22; }

/* The tag reads exactly as written: [Passive], not [PASSIVE]. */
.entry-moves .mv .mv-tag { text-transform: none; letter-spacing: 0.06em; }

/* ---------------- Bird card contrast ----------------
   The bird description sits on its own darker slab so the white name and the
   pastel attack colours have something to sit on instead of pale cream. */
.bird-detail {
  background-image: linear-gradient(180deg, #1b2b1d, #0e1710 72%);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 16px;
  padding: 13px 13px 15px;
  color: #f5fbe9;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 12px 26px rgba(0, 0, 0, 0.38);
}
.bird-detail h2 { color: #ffffff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55); }
.bird-detail p { color: #e9f4dc; }
.bird-detail .eyebrow { color: #ffd98a; }
.bird-detail .entry-title { color: #ffe9b8; }
.bird-detail .base-h { color: #ffffff; margin-top: 10px; }
.bird-detail .reward-line {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 10px;
  padding: 6px 9px;
}
.bird-detail .reward-line span { color: #cfe3bd; }
.bird-detail .reward-line b { color: #ffffff; }
.bird-detail .tip-line { color: #dff0cc; }
.bird-detail .entry-moves .mv {
  background-image: linear-gradient(180deg, rgba(9, 17, 10, 0.94), rgba(4, 9, 5, 0.94));
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
}
.bird-detail .entry-moves .mv b { color: #ffffff; }
.bird-detail .entry-moves .mv span { color: #eef6e2; }
.bird-detail .entry-moves .mv .mv-tag { color: #ffffff; }
.bird-detail .entry-moves .mv.atk span { color: #ffc4bd; }
.bird-detail .entry-moves .mv.help span { color: #c3d7ff; }
.bird-detail .entry-moves .mv.passive span { color: #cdf3bd; }

/* ---------------- Pig card contrast (mirrors bird-detail) ---------------- */
.pig-detail {
  background-image: linear-gradient(180deg, #2a1c14, #140e0a 72%);
  border: 1px solid rgba(255, 255, 255, 0.10);
  border-radius: 16px;
  padding: 13px 13px 15px;
  color: #fbede0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.10), 0 12px 26px rgba(0, 0, 0, 0.38);
}
.pig-detail h2 { color: #ffffff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.55); }
.pig-detail p { color: #f0dcc8; }
.pig-detail .eyebrow { color: #ffd98a; }
.pig-detail .entry-title { color: #ffe9b8; }
.pig-detail .base-h { color: #ffffff; margin-top: 10px; }
.pig-detail .reward-line {
  background: rgba(255, 255, 255, 0.07);
  border: 1px solid rgba(255, 255, 255, 0.11);
  border-radius: 10px;
  padding: 6px 9px;
}
.pig-detail .reward-line span { color: #e8c9a8; }
.pig-detail .reward-line b { color: #ffffff; }
.pig-detail .tip-line { color: #f0dcc8; }
.pig-detail .entry-moves .mv {
  background-image: linear-gradient(180deg, rgba(18, 12, 8, 0.94), rgba(8, 5, 3, 0.94));
  border: 1px solid rgba(255, 255, 255, 0.14);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07);
}
.pig-detail .entry-moves .mv b { color: #ffffff; }
.pig-detail .entry-moves .mv span { color: #f5e6d6; }
.pig-detail .entry-moves .mv .mv-tag { color: #ffffff; }
.pig-detail .entry-moves .mv.atk span { color: #ffc4bd; }
.pig-detail .entry-moves .mv.help span { color: #c3d7ff; }
.pig-detail .entry-moves .mv.passive span { color: #cdf3bd; }

/* ---------------- Blended world switcher ----------------
   One continuous pastel rail instead of five separate chips: the world
   colours fade through each other, and the current world is a soft warm
   band inside the rail rather than a second solid colour beside it. */
#screen-map .world-tabs {
  gap: 2px;
  padding: 7px 16px 9px;
  background:
    linear-gradient(90deg,
      rgba(124, 195, 63, 0.22) 0%,
      rgba(102, 176, 74, 0.18) 20%,
      rgba(201, 138, 82, 0.20) 40%,
      rgba(112, 180, 235, 0.20) 60%,
      rgba(86, 196, 178, 0.20) 78%,
      rgba(255, 211, 107, 0.22) 100%),
    rgba(8, 18, 8, 0.55);
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.05), inset 0 -18px 28px -24px rgba(0, 0, 0, 0.85);
  backdrop-filter: blur(6px);
}
#screen-map .world-tab {
  border: 0;
  border-radius: 10px;
  color: #d9ecc6;
  background: transparent;
  background-image: none;
  box-shadow: none;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
  transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
}
#screen-map .world-tab:hover {
  background: rgba(255, 255, 255, 0.07);
  color: #f4ffe7;
}
#screen-map .world-tab.on {
  color: #ffe9a8;
  background: linear-gradient(180deg, rgba(255, 240, 190, 0.20), rgba(255, 215, 100, 0.06));
  box-shadow: inset 0 -2px 0 #ffd964, inset 0 1px 0 rgba(255, 255, 255, 0.14);
  text-shadow: 0 0 10px rgba(255, 211, 100, 0.35);
  animation: none;
}
#screen-map .world-tab::after,
#screen-map .world-tab.on::after { display: none; }
#screen-map .world-tab.locked {
  color: #8d9c80;
  opacity: 0.7;
  background: transparent;
  background-image: none;
  box-shadow: none;
  filter: none;
}
#screen-map .world-tab.dungeon-tab {
  color: #d6c2f2;
  background: transparent;
  background-image: none;
  box-shadow: none;
}
#screen-map .world-tab.dungeon-tab.locked { color: #8d9c80; }

/* ---------------- Armoury shop ---------------- */
.shop-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 8px;
}
.shop-item {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 9px;
  border-radius: 14px;
  background: linear-gradient(180deg, #fbf6e5, #ead9b6 70%, #ddc79e);
  border: 1px solid rgba(90, 65, 25, 0.22);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 3px 8px rgba(0, 0, 0, 0.16);
}
.shop-item.owned { opacity: 0.72; }
.shop-art {
  flex: 0 0 auto;
  width: 54px;
  height: 60px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: radial-gradient(circle at 45% 30%, #fff8dc, var(--item) 72%, #4a3218 170%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.75), inset 0 -3px 6px rgba(0, 0, 0, 0.18);
}
.shop-art svg { width: 36px; height: 44px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.25)); }
.shop-body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.shop-body b { font-size: 12.5px; color: #2c2410; }
.shop-body span { font-size: 10.5px; font-weight: 800; color: #6b4a0c; }
.shop-body small { font-size: 9.5px; line-height: 1.25; color: #6a5c38; }
.shop-item .btn { flex: 0 0 auto; }
.cw-body b em { font-style: normal; font-size: 9.5px; color: #6b4a0c; margin-left: 3px; }
.cw-ico svg { width: 30px; height: 36px; display: block; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.22)); }

/* ---------------- Spiky menu-biome transitions ----------------
   The drifting title panels meet at a jagged sideways ridge instead of a
   straight vertical colour change. Each panel grows a saw-tooth strip of the
   next biome's sky along its right edge. */
#screen-title .biome::after {
  content: "";
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: 9%;
  z-index: 1;
  pointer-events: none;
  background: linear-gradient(180deg, var(--edge-top, #050510), var(--edge-bottom, #3c2452));
  clip-path: polygon(
    100% 0%, 0% 0%, 18% 8%, 0% 16%, 22% 24%, 2% 32%,
    25% 40%, 0% 48%, 19% 56%, 3% 64%, 23% 72%, 0% 80%,
    17% 88%, 0% 96%, 100% 100%
  );
  filter: drop-shadow(-3px 0 5px rgba(0, 0, 0, 0.28));
}
#screen-title .b-night { --edge-top: #050510; --edge-bottom: #3c2452; }
#screen-title .b-night:first-child { --edge-top: #2a1436; --edge-bottom: #ffb266; }
#screen-title .b-dunes { --edge-top: #070c22; --edge-bottom: #cdeef6; }
#screen-title .b-frost { --edge-top: #050510; --edge-bottom: #3c2452; }
#screen-title .b-night:last-child { --edge-top: #050510; --edge-bottom: #3c2452; }

/* ---------------- Pig-by-pig inventory ---------------- */
.inv-pig-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(155px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.inv-pig {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px;
  border-radius: 14px;
  border: 1px solid rgba(90, 65, 25, 0.22);
  background: linear-gradient(180deg, #fbf6e5, #ead9b6 75%, #ddc79e);
  color: #2c2410;
  font: inherit;
  text-align: left;
  cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 3px 8px rgba(0, 0, 0, 0.16);
}
.inv-pig:hover { filter: brightness(1.04); }
.inv-pig.on {
  border-color: #b98618;
  background: linear-gradient(180deg, #fff8d8, #f2d99a 75%, #e5c47a);
  box-shadow: 0 0 0 2px rgba(255, 205, 90, 0.45), inset 0 1px 0 #fff, 0 4px 10px rgba(0, 0, 0, 0.2);
}
.ip-art { flex: 0 0 auto; width: 52px; height: 58px; display: grid; place-items: center; }
.ip-art svg { width: 50px; height: 56px; }
.ip-main { display: grid; gap: 1px; min-width: 0; }
.ip-main b { font-size: 12.5px; }
.ip-main small { font-size: 10px; color: #6a5c38; }
.ip-main em { font-style: normal; font-size: 10px; font-weight: 800; color: #6b4a0c; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.loadout-panel {
  padding: 10px;
  border-radius: 16px;
  border: 1px solid rgba(90, 65, 25, 0.25);
  background: linear-gradient(180deg, #fffdf2, #f1e6c9 80%, #e7d7b2);
  box-shadow: inset 0 1px 0 #fff, 0 4px 12px rgba(0, 0, 0, 0.14);
}
.lo-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.lo-head > svg { width: 62px; height: 70px; flex: 0 0 auto; }
.lo-head b { display: block; font-size: 15px; color: #2c2410; }
.lo-head span { display: block; margin-top: 2px; font-size: 10.5px; line-height: 1.35; color: #5d5138; }
.loadout-panel h4 { margin: 7px 0 2px; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #7a5a1a; }
.loadout-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(122px, 1fr)); gap: 7px; margin: 5px 0 10px; }
.loadout-item {
  display: grid;
  justify-items: start;
  gap: 1px;
  padding: 7px;
  border-radius: 12px;
  border: 1px solid rgba(90, 65, 25, 0.22);
  background: linear-gradient(180deg, #fffdf4, #ecdcb7);
  color: #2c2410;
  font: inherit;
  text-align: left;
  cursor: pointer;
}
.loadout-item:hover { filter: brightness(1.04); }
.loadout-item.on { border-color: #b98618; box-shadow: 0 0 0 2px rgba(255, 205, 90, 0.4); }
.loadout-item b { font-size: 11.5px; }
.loadout-item small { font-size: 9.5px; font-weight: 800; color: #6b4a0c; }
.loadout-item em { font-style: normal; font-size: 9px; color: #6a5c38; }
.loadout-item.empty .li-art { font-size: 22px; }
.loadout-item:disabled, .loadout-item.signature { opacity: 0.52; cursor: default; filter: grayscale(0.35); }
.loadout-item.signature:hover { filter: grayscale(0.35); }
.li-art { width: 38px; height: 42px; display: grid; place-items: center; }
.li-art svg { width: 32px; height: 38px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.22)); }
@media (max-width: 680px) {
  .inv-pig-grid, .loadout-grid { grid-template-columns: 1fr 1fr; }
}

/* ---------------- Anvil + blueprint coin slot ---------------- */
.slot-card {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
  border-radius: 15px;
  border: 1px solid rgba(255, 214, 120, 0.35);
  background: linear-gradient(180deg, #26351f, #14200f);
  color: #f7efd0;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 5px 14px rgba(0, 0, 0, 0.24);
}
.slot-copy { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
.slot-ico { font-size: 30px; line-height: 1; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.4)); }
.slot-copy b { display: block; font-size: 13px; color: #ffe6a0; }
.slot-copy small { display: block; margin-top: 2px; font-size: 10px; line-height: 1.35; color: #c9d8b5; }
.slot-last { flex: 0 0 100%; font-size: 10px; color: #ffe6a0; }
.anvil-pig-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
.anvil-kind-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0 4px; }
.anvil-kind-tabs .anvil-pig { font-size: 11.5px; padding: 6px 13px; }
.anvil-pig {
  padding: 5px 9px;
  border-radius: 999px;
  border: 1px solid rgba(90, 65, 25, 0.25);
  background: linear-gradient(180deg, #fbf6e5, #e5d4ae);
  color: #4d3b16;
  font: inherit;
  font-size: 10.5px;
  font-weight: 800;
  cursor: pointer;
}
.anvil-pig.on { background: linear-gradient(180deg, #ffe9a8, #e8b84b); border-color: #b98618; color: #352604; }
.anvil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(235px, 1fr)); gap: 8px; }
.anvil-card {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-radius: 14px;
  border: 1px solid rgba(90, 65, 25, 0.22);
  background: linear-gradient(180deg, #fffdf4, #ecdcb7);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8), 0 3px 8px rgba(0, 0, 0, 0.13);
}
.anvil-card.locked { opacity: 0.62; }
.anvil-card.done { background: linear-gradient(180deg, #eef8dd, #d4e7b2); }
.anvil-art { flex: 0 0 auto; width: 42px; height: 48px; display: grid; place-items: center; border-radius: 10px; background: radial-gradient(circle at 45% 30%, #fff8dc, var(--item, #d6c08a) 75%, #8a6a38 170%); }
.anvil-art svg { width: 32px; height: 38px; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.24)); }
.anvil-body { flex: 1; min-width: 0; display: grid; gap: 1px; }
.anvil-body b { font-size: 11.5px; color: #2c2410; }
.fx-badge { font-size: 9px; font-weight: 800; color: #7a4e00; }
.anvil-body small { font-size: 9px; line-height: 1.25; color: #5d5138; }
.anvil-body .anvil-cost { color: #8a5a0c; font-weight: 800; }
.anvil-state { flex: 0 0 auto; max-width: 58px; font-size: 8.5px; line-height: 1.2; text-align: right; color: #7b6a45; }
.anvil-state.done { color: #3f7a1e; font-weight: 800; }
.anvil-card .btn { flex: 0 0 auto; }
@media (max-width: 680px) {
  .anvil-grid { grid-template-columns: 1fr; }
  .slot-card { flex-wrap: wrap; }
}

/* ============================================================
   Contrast pass 2 — stronger readability
   ------------------------------------------------------------ */
.overlay { background: rgba(4, 10, 4, 0.88) !important; }

.screen, .sheet, .overlay, .hud, .battle-top { text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75) !important; }

.title-foot { opacity: 0.9 !important; color: #e6f3d2 !important; }
.title-stars { opacity: 1 !important; }

.wave-pip { color: rgba(255, 255, 255, 0.88) !important; }

.run-line { color: #e0d6ec !important; }
.run-line b { color: #fff7e6 !important; }
.dungeon-run .panel-note { color: #d0c4e0 !important; }

/* Mute-but-readable: never below ~0.85 opacity for text */
.mv span, .reward-line span, .panel-note, .tip-line, .hc-trait, .idx-stats,
.entry-body p, .sheet p, .howto { opacity: 1 !important; }

/* Darker glass behind HUD/map bars */
.map-top { background: linear-gradient(rgba(4, 12, 4, 0.96), rgba(4, 12, 4, 0.7)) !important; }
.hud { background: linear-gradient(rgba(4, 12, 4, 0.92), rgba(4, 12, 4, 0.7)) !important; }

<body>
  <div id="app">
    <section id="screen-title" class="screen"></section>

    <section id="screen-battle" class="screen"></section>
    <section id="screen-base" class="screen"></section>
    <section id="screen-dungeon" class="screen"></section>
  </div>
  <div id="overlay" class="overlay hidden" aria-live="polite"></div>

    <script>
/* ---- js/art.js ---- */
const Art = (function () {
  const open = (inner) =>
    `<svg class="art" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;

  /* ---------------- Pigs ---------------- */

  /* One family, six jobs. Every pig shares the same face � ears, brow, snout,
     tusks � so the squad reads as one litter; the headgear does the talking.
     Every head carries its own gradient ids, so two pigs on one screen never
     share a fill. */
  let pigSeq = 0;

  function pigFace(skin, shade, light, brow) {
    const uid = 'p' + (++pigSeq);
    const head = 'M50 16 C33 16 20 30 20 50 C20 70 33 84 50 84 C67 84 80 70 80 50 C80 30 67 16 50 16 Z';
    return `
      <defs>
        <radialGradient id="${uid}-skin" cx="32%" cy="24%" r="88%">
          <stop offset="0" stop-color="${light}"/>
          <stop offset=".56" stop-color="${skin}"/>
          <stop offset="1" stop-color="${shade}"/>
        </radialGradient>
        <linearGradient id="${uid}-snout" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${light}"/>
          <stop offset="1" stop-color="${skin}"/>
        </linearGradient>
        <clipPath id="${uid}-clip"><path d="${head}"/></clipPath>
      </defs>
      <ellipse cx="50" cy="92" rx="24" ry="3.4" fill="#0b1406" opacity=".28"/>
      <path d="M32 35 C26 29 20 25 14 24 C17 19 25 19 30 25 C34 29 36 32 37 35 Z" fill="url(#${uid}-skin)" stroke="${shade}" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M68 35 C74 29 80 25 86 24 C83 19 75 19 70 25 C66 29 64 32 63 35 Z" fill="url(#${uid}-skin)" stroke="${shade}" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M32 32.6 C27.6 28 22.6 25.2 18 24.4 C20.6 21 26 21 29.6 25.4 C31.8 28 32.8 30.4 33.4 32.6 Z" fill="#e2919a" opacity=".7"/>
      <path d="M68 32.6 C72.4 28 77.4 25.2 82 24.4 C79.4 21 74 21 70.4 25.4 C68.2 28 67.2 30.4 66.6 32.6 Z" fill="#e2919a" opacity=".7"/>
      <path d="${head}" fill="url(#${uid}-skin)" stroke="${shade}" stroke-width="2.8"/>
      <g clip-path="url(#${uid}-clip)">
        <ellipse cx="50" cy="90" rx="34" ry="17" fill="#000" opacity=".16"/>
        <ellipse cx="73" cy="66" rx="12" ry="15" fill="#000" opacity=".08"/>
        <ellipse cx="31" cy="58" rx="9" ry="12" fill="#fff" opacity=".15"/>
      </g>
      <ellipse cx="50" cy="78" rx="18" ry="10" fill="${light}" opacity=".22"/>
      <ellipse cx="40.4" cy="47.8" rx="7.6" ry="8.2" fill="#fffdf1" stroke="${shade}" stroke-width="1.8"/>
      <ellipse cx="59.6" cy="47.8" rx="7.6" ry="8.2" fill="#fffdf1" stroke="${shade}" stroke-width="1.8"/>
      <circle cx="41.6" cy="48.9" r="4.1" fill="#2b3a18"/>
      <circle cx="58.4" cy="48.9" r="4.1" fill="#2b3a18"/>
      <circle cx="41.6" cy="48.9" r="2.3" fill="#11170a"/>
      <circle cx="58.4" cy="48.9" r="2.3" fill="#11170a"/>
      <circle cx="40.2" cy="46.4" r="1.5" fill="#fff"/>
      <circle cx="57" cy="46.4" r="1.5" fill="#fff"/>
      <path d="M32.6 45.4 q7.4 -2.4 14.2 0.5" stroke="${shade}" stroke-width="1.5" fill="none" opacity=".45" stroke-linecap="round"/>
      <path d="M53.2 45.9 q6.8 -2.9 14.2 -0.5" stroke="${shade}" stroke-width="1.5" fill="none" opacity=".45" stroke-linecap="round"/>
      <path d="M30 38.4 q8.8 -3.8 16 -0.8" stroke="${brow}" stroke-width="2.7" fill="none" stroke-linecap="round"/>
      <path d="M54 37.6 q7.2 -3 16 0.8" stroke="${brow}" stroke-width="2.7" fill="none" stroke-linecap="round"/>
      <ellipse cx="26.5" cy="63" rx="5.6" ry="3.6" fill="#e2747e" opacity=".18"/>
      <ellipse cx="73.5" cy="63" rx="5.6" ry="3.6" fill="#e2747e" opacity=".18"/>
      <rect x="37" y="55.8" width="26" height="18.6" rx="9.3" fill="${light}" stroke="${shade}" stroke-width="2.3"/>
      <path d="M39.4 69.6 q10.6 5.4 21.2 0" stroke="${shade}" stroke-width="1.4" fill="none" opacity=".22"/>
      <ellipse cx="44.4" cy="64.4" rx="2.5" ry="3.5" fill="#3d5219"/>
      <ellipse cx="55.6" cy="64.4" rx="2.5" ry="3.5" fill="#3d5219"/>
      <path d="M42.6 71.4 q7.4 2.4 14.8 0" stroke="${shade}" stroke-width="1.2" fill="none" opacity=".35"/>
      <path d="M41.4 78.6 q8.6 5 17.2 0" stroke="${shade}" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M34.4 73.8 q-1.7 4.6 1.7 5.8 q2.5 -2.7 1.5 -6.2 Z" fill="#fff8e2" stroke="#cdbb92" stroke-width="1"/>
      <path d="M65.6 73.8 q1.7 4.6 -1.7 5.8 q-2.5 -2.7 -1.5 -6.2 Z" fill="#fff8e2" stroke="#cdbb92" stroke-width="1"/>
    `;
  }

  /* Every pig wears one of these unless a relic is equipped. Shapes are kept
     wide and flat across the brow so they still read at 40px in a squad list. */
  const PIG_STYLE = {
    corporal: { skin: '#7cc33f', shade: '#4a8419', light: '#b0e46b', brow: '#3f6f18' },
    chef:     { skin: '#8ed14d', shade: '#568e1d', light: '#c1ef82', brow: '#4e7f1a' },
    king:     { skin: '#6fb52f', shade: '#3f7712', light: '#a2dd60', brow: '#3c6c12' },
    sapper:   { skin: '#9dc94a', shade: '#5d8c21', light: '#cdf095', brow: '#4e7f1a' },
    scout:    { skin: '#8fc95a', shade: '#528823', light: '#c6ec94', brow: '#3d6c1a' },
    wizard:   { skin: '#86c95a', shade: '#4b8526', light: '#bdee95', brow: '#3f7a1c' },
    minion:   { skin: '#88c94a', shade: '#548c1f', light: '#c0ea80', brow: '#4a7d18' },
  };

  const classHats = {
    /* Steel pot helmet: raised crest, riveted brim and a chin strap. */
    corporal() {
      return `
        <path d="M22 37 Q23 11 50 11 Q77 11 78 37 Z" fill="#dfe5ec" stroke="#8b96a5" stroke-width="2.6"/>
        <path d="M50 11.5 L50 37" stroke="#b6bfcb" stroke-width="2"/>
        <path d="M23 21 Q50 3 77 21" fill="none" stroke="#a9b3c1" stroke-width="4.4" stroke-linecap="round"/>
        <path d="M34 20 Q42 13 54 14" stroke="#ffffff" stroke-width="3.4" fill="none" stroke-linecap="round" opacity=".85"/>
        <rect x="14" y="31.6" width="72" height="8.6" rx="4.3" fill="#b3bdc9" stroke="#8b96a5" stroke-width="2.2"/>
        <circle cx="50" cy="29" r="3.6" fill="#f7c948" stroke="#b98a16" stroke-width="1.4"/>
        <circle cx="24" cy="35.9" r="1.5" fill="#8b96a5"/>
        <circle cx="76" cy="35.9" r="1.5" fill="#8b96a5"/>
        <path d="M23 40 q-3 12 5 18" stroke="#8b96a5" stroke-width="2.4" fill="none" opacity=".75" stroke-linecap="round"/>
      `;
    },
    /* Tall pleated toque that sits down over the whole crown. */
    chef() {
      return `
        <path d="M22 27 q-11 -9 1 -15 q0 -12 15 -12 q7 -7 15 -2 q8 -5 15 2 q15 0 15 12 q12 6 1 15 z" fill="#fffdf4" stroke="#c9bfa4" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M36 22 q-2 -14 5 -20 M50 22 q0 -15 0 -22 M64 22 q2 -14 -5 -20" stroke="#e6dcc4" stroke-width="1.6" fill="none" opacity=".8" stroke-linecap="round"/>
        <rect x="20" y="24" width="60" height="15" rx="5" fill="#fffdf4" stroke="#c9bfa4" stroke-width="2.4"/>
        <path d="M24 33.6 h52" stroke="#e7dfc9" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="50" cy="31.4" r="2.8" fill="#8ed14d" stroke="#568e1d" stroke-width="1"/>
      `;
    },
    /* Crown with a velvet cap and an ermine band. */
    king() {
      return `
        <path d="M28 32 L28 12 L38 21 L50 6 L62 21 L72 12 L72 32 Z" fill="#f7c948" stroke="#c1931c" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M31 14 q19 -8 38 0 l0 -5 q-19 -8 -38 0 z" fill="#7b4bc4" opacity=".9"/>
        <path d="M32 11 q18 -7 36 0" stroke="#9a63e0" stroke-width="1.4" fill="none" opacity=".7"/>
        <rect x="26" y="28.6" width="48" height="9" rx="4.4" fill="#f4efe2" stroke="#c9bfa4" stroke-width="1.8"/>
        <circle cx="34" cy="33.4" r="1.1" fill="#3b3630"/>
        <circle cx="42" cy="31.8" r="1.1" fill="#3b3630"/>
        <circle cx="58" cy="31.8" r="1.1" fill="#3b3630"/>
        <circle cx="66" cy="33.4" r="1.1" fill="#3b3630"/>
        <circle cx="50" cy="15" r="3" fill="#e2543f" stroke="#b23a28" stroke-width="1.2"/>
        <circle cx="38" cy="21" r="2" fill="#3aa5e0"/>
        <circle cx="62" cy="21" r="2" fill="#3aa5e0"/>
      `;
    },
    /* Hard hat with a lamp over the forehead and goggles on the dome. */
    sapper() {
      return `
        <path d="M20 37 Q22 11 50 11 Q78 11 80 37 Z" fill="#f7c948" stroke="#b98a16" stroke-width="2.6"/>
        <path d="M50 12 L50 37" stroke="#dfae24" stroke-width="2" opacity=".55"/>
        <path d="M28 24 q10 -9 22 -6" stroke="#ffe693" stroke-width="3" fill="none" stroke-linecap="round" opacity=".9"/>
        <rect x="13" y="31.6" width="74" height="9" rx="4.5" fill="#ffd964" stroke="#b98a16" stroke-width="2.2"/>
        <rect x="28" y="18.6" width="44" height="11.4" rx="5.7" fill="#4d5a63" stroke="#31404a" stroke-width="1.9"/>
        <circle cx="39" cy="24.3" r="4.4" fill="#a5d8e8" stroke="#31404a" stroke-width="1.5"/>
        <circle cx="61" cy="24.3" r="4.4" fill="#a5d8e8" stroke="#31404a" stroke-width="1.5"/>
        <circle cx="37.6" cy="23" r="1.6" fill="#fff" opacity=".85"/>
        <circle cx="59.6" cy="23" r="1.6" fill="#fff" opacity=".85"/>
        <circle cx="50" cy="35.8" r="1.4" fill="#b98a16" opacity=".55"/>
      `;
    },
    /* Hood with a wrapped scarf, a brass pin and a feather. */
    scout() {
      return `
        <path d="M22 38 Q23 11 50 11 Q77 11 78 38 Q63 28 50 30 Q37 28 22 38 Z" fill="#3f5f3a" stroke="#2a4226" stroke-width="2.6" stroke-linejoin="round"/>
        <path d="M30 23 q20 -9 40 0" stroke="#6a9460" stroke-width="2" fill="none" opacity=".55" stroke-linecap="round"/>
        <path d="M22 38 Q34 31 50 33 Q66 31 78 38 L74.5 42.6 Q62 35.4 50 37.4 Q38 35.4 25.5 42.6 Z" fill="#507546" stroke="#2a4226" stroke-width="2" stroke-linejoin="round"/>
        <circle cx="50" cy="30.6" r="2.8" fill="#f0c85a" stroke="#b8912a" stroke-width="1.2"/>
        <path d="M70 16 Q86 8 93 23 Q81 21 73 26 Z" fill="#f0c85a" stroke="#b8912a" stroke-width="1.8"/>
        <path d="M62 18 q6 -9 15 -7" stroke="#2a4226" stroke-width="2.2" fill="none" stroke-linecap="round"/>
      `;
    },
    /* Tall triangle with the base spread wide over the ears, tip at the top. */
    wizard() {
      return `
        <path d="M50 0 L30 38 L70 38 Z" fill="#7b4bc4" stroke="#4f2a85" stroke-width="2.4" stroke-linejoin="round"/>
        <path d="M50 0 L30 38 L50 38 Z" fill="#9a63e0" opacity=".35"/>
        <path d="M42 17 l1.6 3.4 l3.4 .9 l-3.4 1.6 l-1.6 3.4 l-1.6 -3.4 l-3.4 -1.6 l3.4 -.9 z" fill="#ffe27a"/>
        <path d="M4 37 Q50 26 96 37 Q50 44.5 4 37 Z" fill="#5c3399" stroke="#3d1f6b" stroke-width="2.4" stroke-linejoin="round"/>
        <rect x="41" y="30" width="18" height="8.6" rx="2.4" fill="none" stroke="#ffd76b" stroke-width="2.2"/>
      `;
    },
    /* Fresh recruit: a bristly tuft and nothing else. */
    minion() {
      return `
        <path d="M41 16 q4 -9 9 -2 q5 -8 9 2" stroke="#548c1f" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      `;
    },
  };

  /* Face furniture that belongs to the pig, not the hat. */
  const pigExtras = {
    chef() {
      return `
        <path d="M50 76.6 q-8 -3.6 -12.5 0.8 q4.4 4.6 12.5 4.4 q8.1 0.2 12.5 -4.4 q-4.5 -4.4 -12.5 -0.8 z" fill="#6a4a1f" opacity=".92"/>
        <path d="M52 81 q6 5 9.5 2.6" stroke="#4d3413" stroke-width="1.6" fill="none" stroke-linecap="round" opacity=".7"/>
      `;
    },
    king() {
      return '<circle cx="74" cy="57" r="3" fill="#f7c948" stroke="#c1931c" stroke-width="1.2"/>';
    },
    wizard() {
      return `
        <path d="M36 79 q14 12 28 0 q-2 11 -14 11 q-12 0 -14 -11 z" fill="#efe9da" stroke="#cfc6b0" stroke-width="1.4"/>
        <path d="M44 84 q6 3.4 12 0" stroke="#cfc6b0" stroke-width="1.4" fill="none"/>
      `;
    },
  };

  /* ---------------- Hats ----------------
     A relic is a promotion, not a costume. Every pig climbs the ladder of its
     own trade: caps turn into helmets, toques get taller, crowns gain points,
     hard hats gain lamps. Natural materials and real silhouettes only — no
     gems, no glow, no fantasy metal. */
  const PIG_HATS = {

  /* The relic only says which rung of the ladder this pig stands on. */
  function relicHat(relic, id) {
    const ladder = PIG_HATS[id] || PIG_HATS.minion;
    const tier = Math.max(1, Math.min(ladder.length, relic.tier || 1));
    return ladder[tier - 1];
  }

     the squad reads apart even before the hats go on: a riveted breastplate, a
     chef's jacket and neckerchief, a fur-trimmed royal cape, a hi-vis work vest
     with pockets, a ranger's cloak and quiver, and a starry robe with a sash.
     A relic recolours the pig's own garment instead of handing everyone the
     same tinted shirt. */

  /* A promotion changes the cut of the same uniform — a stitched seam, then
     shoulder boards, then brass, then a medal — while the pig keeps its working
     colours. The relic is rank, not paint. */
  function relicWear(relic, id) {
    const c = PIG_WEAR[id] || PIG_WEAR.minion;
    const tier = Math.max(1, Math.min(5, relic.tier || 1));
    const brass = '#d9b45a';
    const brassDark = '#9a8448';

    /* Low relics are barely kitted out: a plain vest and a ragged collar. The
       full working uniform arrives at the third rung, rank details after it. */
    if (tier <= 2) {
      const collar = tier >= 2
        ? `<path d="M30 60 Q50 74 70 60" stroke="${c.dark}" stroke-width="3" fill="none" opacity=".8"/>
           <path d="M34 63 L34 88 M66 63 L66 88" stroke="${c.dark}" stroke-width="1.4" opacity=".35"/>`
        : '';
      return `<g pointer-events="none">
        <path d="M26 59 Q50 69 74 59 L77 96 L23 96 Z" fill="${c.main}" stroke="${c.dark}" stroke-width="2.2" stroke-linejoin="round"/>
        <path d="M50 62 L43 75 L50 96 L57 75 Z" fill="${c.dark}" opacity=".16"/>
        ${collar}
      </g>`;
    }

    const seam = `<path d="M10 92 q40 10 80 0" stroke="${c.dark}" stroke-width="2" fill="none" opacity=".6"/>`;
    const boards = tier >= 4
      ? `<path d="M8 86 q9 -4 15 2 q-6 5 -15 3 z" fill="${c.light}" stroke="${c.dark}" stroke-width="1.4" stroke-linejoin="round"/>
         <path d="M92 86 q-9 -4 -15 2 q6 5 15 3 z" fill="${c.light}" stroke="${c.dark}" stroke-width="1.4" stroke-linejoin="round"/>`
      : '';
    const medal = tier >= 5
      ? `<path d="M30 86 l5 9" stroke="#c4453a" stroke-width="3.2"/>
         <circle cx="36" cy="95" r="3.4" fill="${brass}" stroke="${brassDark}" stroke-width="1.2"/>`
      : '';
    return `<g pointer-events="none">${(classWear[id] || classWear.minion)(c)}${seam}${boards}${medal}</g>`;
  }

        <circle cx="0" cy="-19" r="3.4" fill="var(--weapon, #8fc95a)" stroke="#4a3218" stroke-width="1.6"/>`,

    };
    const shapeName = weapon.shape || weapon.proc;
    const shape = shapes[shapeName];
    if (!shape) return '';
    return `<g class="held-weapon shape-${shapeName}" transform="translate(80 76) rotate(-24)" style="--weapon:${weapon.colour}">${shape}</g>`;
  }

  function craftedShieldFigure(shieldId) {
    if (!shieldId || typeof DATA === 'undefined' || !DATA.craftedShieldById) return '';
    const shield = DATA.craftedShieldById(shieldId);
    if (!shield) return '';
    const shapes = {
      round: `<path d="M0 -20 L14 -15 V4 C14 13 8 19 0 23 C-8 19 -14 13 -14 4 V-15 Z" fill="${shield.colour}" stroke="#4a3218" stroke-width="2.2"/><path d="M0 -15 L9 -12 V4 C9 10 5 15 0 18 Z" fill="#fff" opacity=".22"/><path d="M0 -10 L0 13 M-7 -1 L7 -1" stroke="#4a3218" stroke-width="1.6" opacity=".65"/>`,

  }

  function hero(id, relicId, weaponId, shieldId) {
    const st = PIG_STYLE[id] || PIG_STYLE.minion;
    let relic = null;
    if (relicId && typeof DATA !== 'undefined' && DATA.relicById) relic = DATA.relicById(relicId);
    const worn = relic || { tier: 1 };
    const wear = relicWear(worn, id);
    const hat = relicHat(worn, id);
    const extra = pigExtras[id] ? pigExtras[id]() : '';
    const shield = craftedShieldFigure(shieldId);
    const weapon = craftedWeaponFigure(weaponId);
    return open(wear + pigFace(st.skin, st.shade, st.light, st.brow) + hat + extra + shield + weapon);
  }

  /* One generator, many birds — but not one silhouette. Beyond colour, a bird
     can wear a headpiece, carry a pattern on its body and grow extras (tusks,
     antlers, a studded collar, ice shards, a third eye, even a balloon), so a
     flock reads at a glance instead of nine shades of the same teal. */
  let birdSeq = 0;

      collar: `<path d="M27 83 Q54 97 81 83" stroke="#3b2a20" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M36 86 l3 -8 M54 92 l0 -9 M71 86 l-3 -8" stroke="#c9ccd6" stroke-width="3.2" stroke-linecap="round"/>`,
      shards: `<path d="M77 44 l11 -13 l4 15 Z" fill="${accent}" stroke="${dark}" stroke-width="1.4"/><path d="M83 62 l13 -6 l1 13 Z" fill="${accent}" opacity=".85" stroke="${dark}" stroke-width="1.2"/>`,

      none: '',
    }[c.flair || 'none'];
    /* Proportions are per bird as well as colour: some are plump, some lean,
       some tall, and a boss reads as big before a single stat is shown. */
    const buildX = { plump: 1.1, round: 1.05, tall: 0.93, lean: 0.87, egg: 0.99 }[c.build] || 1;
    const buildY = { plump: 0.93, round: 1, tall: 1.1, lean: 1.05, egg: 1.08 }[c.build] || 1;
    const size = c.size || 1;

      ${breast}
      ${extra}
      ${crest}

  }

  /* Every bird in the game, one look each — different hues, different hats,

  const variantBirds = {

    albatross:  { body: '#c3d4e0', dark: '#57697a', belly: '#f4fbff', beak: '#ffc44a', beakDark: '#b07f1e', accent: '#4f7fa8', crest: 'none', tail: 'long', beakShape: 'hook', hat: 'visor', hatColor: '#9fe8ff', pattern: 'chevron' },
    reefcaller: { body: '#ff6fa8', dark: '#a8306a', belly: '#ffe0ee', beak: '#ffb03a', beakDark: '#c67a1e', accent: '#ffe066', crest: 'horn', tail: 'plume', pattern: 'scales', extra: 'thirdEye' },
    tidewarden: { body: '#1f8f9a', dark: '#0e4650', belly: '#8ff0dc', beak: '#ffd36b', beakDark: '#b8912a', accent: '#ffd36b', crest: 'crest', tail: 'sword', beakShape: 'hook', extra: 'collar', brow: '#d9f7ff', browW: 4 },
    frostking:  { body: '#a8e8fa', dark: '#3f7f9a', belly: '#f0fdff', beak: '#e8f6ff', beakDark: '#8fb0c0', accent: '#ffffff', crest: 'horn', tail: 'sword', beakShape: 'hook', hat: 'crown', aura: '#8ff0ff', brow: '#1c3b4a', browW: 4 },

/* Shared hover-tooltip layer.
   Lives in its own file because BOTH battle.js and game.js need it; keeping it
   inside game.js's closure made battle.js throw on `initTips is not defined`
   and the whole ability bar never rendered. */

(function () {
  let tipEl = null;

  function initTips() {
    if (tipEl) return;
    tipEl = document.createElement('div');
    tipEl.className = 'hover-tip hidden';
    document.body.appendChild(tipEl);
    let current = null;

    const hide = () => { current = null; tipEl.classList.add('hidden'); };
    const place = (x, y) => {
      tipEl.style.left = '0px';
      tipEl.style.top = '0px';
      const r = tipEl.getBoundingClientRect();
      const pad = 12;
      let left = x + 16;
      let top = y + 16;
      if (left + r.width > window.innerWidth - pad) left = Math.max(pad, x - r.width - 12);
      if (top + r.height > window.innerHeight - pad) top = Math.max(pad, window.innerHeight - r.height - pad);
      tipEl.style.left = left + 'px';
      tipEl.style.top = top + 'px';
    };
    const show = (target, x, y) => {
      const html = target.getAttribute('data-tip');
      if (!html) { hide(); return; }
      current = target;
      tipEl.innerHTML = html;
      tipEl.classList.remove('hidden');
      place(x, y);
    };

    document.addEventListener('pointerover', (ev) => {
      const target = ev.target && ev.target.closest ? ev.target.closest('[data-tip]') : null;
      if (!target) { if (current) hide(); return; }
      if (target === current) return;
      show(target, ev.clientX, ev.clientY);
    });
    document.addEventListener('pointermove', (ev) => {
      if (!current) return;
      if (!current.contains(ev.target)) { hide(); return; }
      place(ev.clientX, ev.clientY);
    });
    /* A phone has no hover, so a tap shows the tip for a moment instead:
       hero, bird, ability and bar details stay reachable on touch. */
    let tapTimer = null;
    const isTouch = (ev) => ev.pointerType === 'touch' || ev.pointerType === 'pen';
    document.addEventListener('pointerdown', (ev) => {
      if (isTouch(ev)) return;
      hide();
    }, true);
    document.addEventListener('pointerup', (ev) => {
      if (!isTouch(ev)) return;
      const target = ev.target && ev.target.closest ? ev.target.closest('[data-tip]') : null;
      if (!target) { hide(); return; }
      show(target, ev.clientX, ev.clientY);
      if (tapTimer) clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { if (current === target) hide(); }, 2800);
    }, true);
    document.addEventListener('scroll', hide, true);
  }

  window.initTips = initTips;
})();

  /* Sixty levels, so the last pig (level 60) is actually reachable. */
  maxLevel: 60,

  /* XP for the next level. The road starts trivial and climbs geometrically:
     level 1 costs 10 XP, level 30 costs exactly 10,000, and after thirty the
     growth relaxes to 9% a level instead of running away into the millions. */
  xpForLevel(level) {
    const l = Math.max(1, Math.min(DATA.maxLevel, Math.round(level || 1)));
    if (l <= 30) return Math.round(10 * Math.pow(1000, (l - 1) / 29));

  gearTierCost(heroDef, slot, tier) {
    const table = slot === 'weapon' ? heroDef.weapon : heroDef.helmet;
    return table.cost[tier - 1] || 0;
  },

  gearHp(heroDef, gear) {
    const t = (gear && gear.helmet) || 1;
    return heroDef.helmet.hpBonus[t - 1] || 0;
  },

  gearAtkMul(heroDef, gear) {
    const t = (gear && gear.weapon) || 1;
    return heroDef.weapon.atkMul[t - 1] || 1;
  },

  /* Every weapon and helmet carries a small proc chance. It starts at 2% on
     the starter item and climbs to 10% at tier 5. */
  gearProcChance(tier) {
    return [0.02, 0.04, 0.06, 0.08, 0.10][Math.max(0, Math.min(4, (tier || 1) - 1))];
  },

  heroStats(heroDef, level, gear, forgeLevel, relicId) {
    const forge = Math.max(0, Math.min(5, forgeLevel || 0));
    const relic = DATA.relicForHero ? DATA.relicForHero(heroDef.id, relicId) : null;
    const rs = (relic && relic.stats) || {};
    return {
      maxHp: Math.round((heroDef.baseHp + heroDef.hpGrow * (level - 1) + DATA.gearHp(heroDef, gear) + ((gear && gear.bonusHp) || 0) + forge * 55) * (1 + (rs.hp || 0)) * (1 + (DATA.trainingBonus.vigour || 0))),
      atk: Math.round((heroDef.baseAtk + heroDef.atkGrow * (level - 1) + ((gear && gear.bonusAtk) || 0)) * DATA.gearAtkMul(heroDef, gear) * (1 + forge * 0.07) * (1 + (rs.atk || 0)) * (1 + (DATA.trainingBonus.power || 0)) * 10) / 10,
    };
  },    relicForge: { cost: 3, maxLevel: 5, hp: 58, atk: 0.075 },

  /* Turn a small healing formula into readable text: the source is read once,
     before gear scaling wraps it, so the tooltip keeps the real numbers. */
  formulaFromFn(fn) {
    if (typeof fn !== 'function') return '';
    const src = String(fn);
    const arrow = src.indexOf('=>');
    let expr = arrow >= 0 ? src.slice(arrow + 2) : src;
    expr = expr.replace(/Math\.round\(/g, '').replace(/;\s*}?\s*$/, '').replace(/\)\s*$/, '');
    expr = expr.replace(/\bh\.level\b/g, 'level').replace(/\bh\.atk\b/g, 'damage');
    expr = expr.replace(/\*/g, ' × ').replace(/\//g, ' ÷ ');
    return expr.replace(/\s+/g, ' ').trim();
  },

  /* One line of exact mechanics for every hero ability, including relic and
     helmet variants. The descriptions stay readable; this line carries the
     target count, percentages, durations and what each status actually does. */
  abilityFacts(ab, hero) {
    if (!ab) return '';
    const r = (n) => n + (n === 1 ? ' round' : ' rounds');
    const pct = (n) => Math.round(n * 100) + '%';
    const turns = (v) => (v && typeof v === 'object' ? (v.turns || 1) : v);
    const formula = (fn) => (fn && fn.formula) || DATA.formulaFromFn(fn);
    /* With a live pig in hand every number also prints what it does right now,
       so an attack reads as "deals 42 damage" at that pig's real level. */
    const live = (fn) => (hero && typeof fn === 'function' && Number.isFinite(fn(hero)) ? ' ≈ ' + Math.round(fn(hero)) : '');
    const liveMul = (n) => (hero && Number.isFinite(hero.atk) ? Math.round(n * hero.atk) : null);
    const target = {
      enemy: '1 bird',
      allEnemies: 'all living birds',
      ally: '1 ally',
      party: 'all living allies (up to 3)',
      self: 'self',
    }[ab.target] || 'the squad';
    const bits = [target];
    if (ab.mult) {
      /* A pig's attack power is never printed anywhere, so the description
         quotes the damage itself: the number the bird actually loses. */
      const hit = liveMul(ab.mult);
      const per = ab.hits && ab.hits > 1 ? ' per hit' : '';
      bits.push(hit != null ? hit + ' damage' + per : pct(ab.mult) + ' of its damage' + per);
    }
    if (ab.healSingle && ab.target === 'ally') {
      const n = (hero && typeof ab.healSingle === 'function' && Number.isFinite(ab.healSingle(hero))) ? Math.round(ab.healSingle(hero)) : null;
      bits.push('heals the target for ' + (n != null ? n + ' HP' : 'HP'));
    }
    if (ab.healParty && ab.target === 'party') {
      const n = (hero && typeof ab.healParty === 'function' && Number.isFinite(ab.healParty(hero))) ? Math.round(ab.healParty(hero)) : null;
      bits.push('heals each living ally for ' + (n != null ? n + ' HP' : 'HP'));
    }
    if (ab.selfHeal) {
      const n = (hero && typeof ab.selfHeal === 'function' && Number.isFinite(ab.selfHeal(hero))) ? Math.round(ab.selfHeal(hero)) : null;
      bits.push('heals self for ' + (n != null ? n + ' HP' : 'HP'));
    }
    if (ab.shieldParty || ab.shieldSingle || ab.ward) {
      const squadShield = !!(ab.shieldParty || ab.ward || ab.target === 'party' || ab.target === 'self');
      const shieldPct = ab._relicShaped ? (squadShield ? 35 : 50) : 30;
      const shieldTurns = ab._relicShaped ? 1 : 3;
      bits.push('shield: ' + (squadShield ? 'all living allies take ' : 'the target takes ') + shieldPct + '% less damage for ' + r(shieldTurns));
    }
    if (ab.guard) bits.push('takes ' + pct(ab.guard.reduce || 0.45) + ' less damage for ' + r(ab.guard.turns || 2));
    if (ab.taunt) bits.push('taunts birds for ' + r(ab.taunt));
    if (ab.stun) bits.push('stun ' + r(turns(ab.stun)) + ' (skips turns)');
    if (ab.weaken) bits.push('weaken ' + r(turns(ab.weaken)) + ' (bird deals 30% less damage)');
    if (ab.silence) bits.push('silence ' + r(turns(ab.silence)) + ' (no specials)');
    /* Damage over time prints the tick a live pig would actually suffer, not
       a formula the player has to solve. */
    const tick = (fn) => ((hero && typeof fn === 'function' && Number.isFinite(fn(hero)))
      ? Math.round(fn(hero)) + ' damage per round'
      : 'damage per round');
    if (ab.burn) bits.push('burn ' + r(ab.burn.turns || 1) + (ab.burn.dmg ? ' — ' + tick(ab.burn.dmg) : ''));
    if (ab.poison) bits.push('poison ' + r(turns(ab.poison)) + (ab.poison.dmg ? ' — ' + tick(ab.poison.dmg) : ''));
    if (ab.vuln) bits.push('exposed ' + r(ab.vuln.turns || 2) + ' (+' + pct(ab.vuln.bonus || 0.2) + ' damage taken)');
    else if (ab.expose) bits.push('exposed ' + r(turns(ab.expose)) + ' (+25% damage taken)');
    if (ab.mire) bits.push('mire ' + r(turns(ab.mire)) + ' (100% healing stolen)');
    if (ab.cleanse) bits.push(ab.target === 'allEnemies'
      ? 'clears bird shields and mirages'
      : 'cleanses all 10 debuffs (stun, freeze, silence, weaken, poison, burn, drench, mire, pepper numb, expose)');
    if (ab.cleanseChance) bits.push(pct(ab.cleanseChance) + ' chance to cleanse the squad of all debuffs');
    if (ab.leech) bits.push('heals self for ' + pct(ab.leech) + ' of damage dealt');
    if (ab.thorns) bits.push('returns ' + pct(ab.thorns) + ' of damage taken');
    if (ab.rally) bits.push('+' + pct(ab.rally.mult || 0.15) + ' squad damage for ' + r(ab.rally.turns || 2));
    if (ab.shred) bits.push('removes bird shields and mirages');
    if (ab.mend) {
      const n = (hero && typeof ab.mend === 'function' && Number.isFinite(ab.mend(hero))) ? Math.round(ab.mend(hero)) : null;
      bits.push('heals each living ally for ' + (n != null ? n + ' HP' : 'HP'));
    }
    if (ab.chili) bits.push('pepper: needs 6 charge per squad pig (18 with 3); 2-round cooldown');
    return bits.join(' · ');
  },

  withEffects(ab, hero) {
    const facts = DATA.abilityFacts(ab, hero);
    const desc = ab.desc || '';
    if (!facts) return desc;
    return (desc ? desc + ' ' : '') + 'Details: ' + facts + '.';
  },

  abilitiesFor(heroDef, gear, relicId, hero) {
    const list = heroDef.abilities.map((a) => Object.assign({}, a));
    const tier = (gear && gear.helmet) || 1;
    /* Team help grows with the gear that grows damage: every helmet tier adds
       10% and every weapon tier 12% to heals and shields, so upgrading a
       support pig is never wasted. */
    const weapon = (gear && gear.weapon) || 1;
    const supportMul = 1 + 0.1 * (tier - 1) + 0.12 * (weapon - 1);
    const scale = (ab, key) => {
      if (typeof ab[key] !== 'function') return;
      const fn = ab[key];
      const formula = DATA.formulaFromFn(fn);
      ab[key] = (h) => Math.round(fn(h) * supportMul);
      ab[key].formula = formula;
    };
    list.forEach((ab) => {
      scale(ab, 'ward');
      scale(ab, 'mend');
      scale(ab, 'healSingle');
      scale(ab, 'healParty');
      scale(ab, 'shieldSingle');
      scale(ab, 'shieldParty');
      scale(ab, 'selfHeal');
    });
    for (let i = 1; i < tier; i++) {
      const t = heroDef.helmet.tiers[i];
      if (!t || !t.mods) continue;
      Object.keys(t.mods).forEach((id) => {
        const ab = list.find((a) => a.id === id);
        /* The pepper attack is the pig, not the outfit: no relic or helmet
           ever rewrites it, so the ultimate is identical on every relic. */
        if (ab && !ab.chili) Object.assign(ab, t.mods[id]);
      });
    }
    const relic = DATA.relicForHero ? DATA.relicForHero(heroDef.id, relicId) : null;
    if (relic && relic.mods) {
      Object.keys(relic.mods).forEach((id) => {
        const ab = list.find((a) => a.id === id);
        if (ab && !ab.chili) {
          Object.assign(ab, relic.mods[id]);
          /* shieldPlan() gives relic-shaped shields 35% for one round (or
             50% on one ally); the description must say the same thing. */
          ab._relicShaped = true;
        }
      });
    }
    list.forEach((a) => { a.desc = DATA.withEffects(a, hero); });
    return list;
  },

      { id: 'whet', icon: '🪨', name: 'Whetstone', desc: '+10% attack for the rest of this run.', cost: 26 },
      { id: 'relic', icon: '🏅', name: 'Relic Fragment', desc: 'Add 1 relic to the run purse.', cost: 34 },
      { id: 'potion', icon: '🧪', name: 'Healing Tonic', desc: 'Add 1 healing potion to your bag.', cost: 18 },
      { id: 'xp', icon: '📗', name: 'Dusty Tome', desc: 'Add 30 XP to the run purse.', cost: 20 },
    ],
    /* The dungeon changes stone every five depths. */
    BIOMES: ['dungeon-crypt', 'dungeon-ember', 'dungeon-frost', 'dungeon-void'],
    biome(floor) {
      const f = Math.max(1, floor || 1);
      return this.BIOMES[Math.floor((f - 1) / 5) % this.BIOMES.length];
    },
    danger(floor) {
      return Math.min(100, Math.round(floor * 2.6));
    },
    rewards(floor) {
      return {
        coins: 16 + floor * 5,
        herbs: floor % 2 === 0 ? 1 : 0,
        relics: floor % 3 === 0 ? (floor % 9 === 0 ? 2 : 1) : 0,
        xp: 12 + floor * 3,
      };
    },
    /* Random opponents scaled by depth. Bosses every fifth floor. */
    makeFloor(floor) {
      const rnd = (a, b) => a + Math.random() * (b - a);
      const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
      const hpMul = 0.5 + floor * 0.15;
      const atkMul = 0.45 + floor * 0.11;
      const boss = floor % 5 === 0;
      if (boss) {
        /* Any boss can hold a floor, and any bird in the game can be in its
           escort — the dungeon is the one place the whole flock mixes. */
        const bossPool = Object.keys(DATA.enemies).filter((k) => DATA.enemies[k].boss);
        const t = bossPool[(Math.floor(floor / 5) - 1) % bossPool.length];
        const adds = Object.keys(DATA.enemies).filter((k) => !DATA.enemies[k].boss);
        const list = [{ t, hpMul: hpMul * 0.62, atkMul: atkMul * 0.9 }];
        const addCount = Math.min(2, 1 + Math.floor(floor / 10));
        for (let i = 0; i < addCount; i++) list.push({ t: pick(adds), hpMul: hpMul * 0.55, atkMul: atkMul * 0.72 });
        return { enemies: list, boss: true };
      }
      /* Any bird can turn up down here — the depth decides how nasty it is,
         not a hand-written shortlist. */
      const pool = Object.keys(DATA.enemies).filter((k) => !DATA.enemies[k].boss);
      const count = Math.min(4, 2 + Math.floor(floor / 4));
      const list = [];
      for (let i = 0; i < count; i++) {
        const t = pick(pool);
        list.push({ t, hpMul: hpMul * rnd(0.9, 1.1), atkMul: atkMul * rnd(0.9, 1.1) });
      }
      return { enemies: list, boss: false };
    },
  },

  /* First time a run reaches a new personal-best depth, the cave pays a
     one-off descent bonus. Milestones every five depths pay relics. */
  dungeonFirstClear(floor) {
    const f = Math.max(1, floor || 1);
    const milestone = f % 10 === 0 ? 3 : f % 5 === 0 ? 2 : 0;
    return {
      label: milestone ? `First descent · depth ${f} milestone` : `First descent · depth ${f}`,
      coins: 20 + f * 6,
      xp: 10 + f * 2,
      herbs: f % 2 === 0 ? 1 : 0,
      relics: milestone,
    };
  },

/* ---------------- Side-road gates ----------------
   Side routes (caves, vaults, smugglers' roads) hang off the main line with
   nothing marking the turn. Every junction gets a gate node in the middle of
   the edge, and behind it a coloured door: brass on the first road, silver on
   the second, gold on the third. The kingdom keeps its own key gates. */
DATA.worlds.forEach(function (w) {
  if (w.id === 5) return;
  const sideOf = (id) => {
    const n = parseInt(String(id).slice(1), 10) || 0;
    /* Egg World's main road runs through e30; its side roads start at e40. */
    return n >= (w.id === 1 ? 40 : 30);
  };
  const byId = {};
  w.nodes.forEach((n) => { byId[n.id] = n; });
  const added = [];
  const edges = [];
  w.edges.forEach(function (pair) {
    const a = byId[pair[0]];
    const b = byId[pair[1]];
    if (!a || !b || sideOf(a.id) || !sideOf(b.id)) { edges.push(pair); return; }
    const gateId = 'g' + w.id + '_' + b.id;
    const gate = {
      id: gateId, type: 'gate',
      key: DATA.keyOrder[added.length % DATA.keyOrder.length],
      x: Math.round((a.x + b.x) / 2),
      y: Math.round((a.y + b.y) / 2),
    };
    byId[gateId] = gate;
    added.push(gate);
    edges.push([a.id, gateId]);
    edges.push([gateId, b.id]);
  });
  if (added.length) {
    w.edges = edges;
    w.nodes = w.nodes.concat(added);
  }
});

/* Rewrite every lineup so a bird only ever fights in its own world. */
DATA._levelRows.forEach((row) => {
  const roster = DATA.worldRoster[row.world] || DATA.worldRoster[1];
  const seed = row.id.split('').reduce((n, ch) => n + ch.charCodeAt(0), 0);
  row.e = (row.e || []).map(([t, hp, atk], i) => {
    const known = DATA.enemies[t];
    if (known && (known.world || 1) === row.world) return [t, hp, atk];
    const bird = roster[(seed + i) % roster.length];
    return [bird, hp, atk];
  });
  if (row.boss && row.e.length) row.e[0] = [DATA.worldBoss[row.world], row.e[0][1], row.e[0][2]];
});

/* Terence the Wall carries 1,000 base HP. Levels that use him as an escort keep
   roughly the fight they had, so his slice of the lineup is rescaled to match
   (about a third more than before, because he is supposed to feel like a wall). */
DATA._levelRows.forEach((row) => {
  row.e = (row.e || []).map(([t, hp, atk]) => {
    if (t === 'terence') return [t, +(hp * 0.55).toFixed(3), atk];
    if (t === 'yeti') return [t, +(hp * 0.3).toFixed(3), atk];
    return [t, hp, atk];
  });
});

/* Every bird fights with its world kit; the Bomb ignores move lists entirely. */
Object.keys(DATA.birdMoves).forEach((id) => {
  if (DATA.enemies[id] && !DATA.enemies[id].bomb) DATA.enemies[id].moves = DATA.birdMoves[id];
});

/* One walking wall per world: its charge always owns the bar and always hits
   like a truck without one-tapping a full-health pig. */
DATA.tankBirds = ['terence', 'camel', 'kraken', 'yeti', 'frostwall', 'tidewall', 'icefall', 'reefbulwark', 'ironclad'];
DATA.tankBirds.forEach((id) => {
  const tank = DATA.enemies[id];
  if (!tank || !tank.moves) return;
  const ult = tank.moves.find((m) => m.kind === 'charge');
  if (!ult) return;
  if (!ult.cd) ult.cd = 3;
  ult.scaled = true;
});

/* Iron hide: only the walls have it, and the threshold climbs with the world.
   Any single hit under the number lands for 75%, so chip damage cannot chew
   through a late-game tank. */
DATA.ironHide = { ram: 50, yeti: 70, reefbulwark: 100, ironclad: 120 };
Object.keys(DATA.ironHide).forEach((id) => {
  const bird = DATA.enemies[id];
  if (!bird) return;
  bird.soakAt = DATA.ironHide[id];
  bird.trait = (bird.trait ? bird.trait + ' · ' : '') + 'iron hide: hits under ' + DATA.ironHide[id] + ' deal 75%';
});

/* Mirage birds: they blur out of phase, and 80% of everything the pigs throw
   passes straight through until somebody clears the air. */
DATA.veilBirds = ['gull', 'frost', 'spitter'];
DATA.veilBirds.forEach((id) => {
  const bird = DATA.enemies[id];
  if (!bird || !bird.moves || bird.moves.some((m) => m.veil)) return;
  bird.moves.push({ name: 'Mirage Veil', kind: 'self', veil: 2, icon: '🌫️', weight: 1, desc: 'Blurs out of phase: 80% of attacks miss for 2 rounds.' });
  bird.trait = (bird.trait ? bird.trait + ' · ' : '') + 'blurs out of reach (80% miss)';
});

/* Frenzy birds: they whip themselves into a state where EVERY hit lands with a
   flat damage bonus on top. On a bird that hits three times, that stacks into
   something the pigs should genuinely fear. */
DATA.frenzyBirds = { blue: 50, bubbles: 40, shrike: 35 };
Object.keys(DATA.frenzyBirds).forEach((id) => {
  const bird = DATA.enemies[id];
  const bonus = DATA.frenzyBirds[id];
  if (!bird || !bird.moves || bird.moves.some((m) => m.power)) return;
  bird.moves.push({ name: 'Feather Frenzy', kind: 'self', power: bonus, powerTurns: 3, icon: '⚡', weight: 1, desc: 'Whips itself into a frenzy: every hit deals +' + bonus + ' more for 3 rounds.' });
  bird.trait = (bird.trait ? bird.trait + ' · ' : '') + 'frenzies for +' + bonus + ' per hit';
});

  /* Every bird assigned to a world must actually turn up in that world. Two
     pool members were missing outright and one was in the pool but in no
     authored row, so they showed in the compendium yet never fought. */
  if (!DATA.worldRoster[1].includes('sparrow')) DATA.worldRoster[1].push('sparrow');
  if (!DATA.worldRoster[2].includes('canyoncaller')) DATA.worldRoster[2].push('canyoncaller');
  ['1', '2', '3', '4', '5'].forEach((w) => {
    const wId = Number(w);
    const rows = DATA._levelRows.filter((r) => Number(r.world) === wId);
    if (!rows.length) return;
    /* The opening fights of a world are allowed to stay small — one or two
       birds is the point of a first level. The filler only pads the levels
       after those, so a new world never opens with a full lineup. */
    const opening = new Set(rows.slice(0, 3).map((r) => r.id));
    const used = new Set();
    rows.forEach((r) => (r.e || []).forEach(([t]) => used.add(t)));
    DATA.worldRoster[w].forEach((bird) => {
      if (used.has(bird)) return;
      const spare = rows.filter((r) => !opening.has(r.id) && (r.e || []).length < 4 && !r.e.some(([t]) => t === bird));
      if (!spare.length) return;
      spare[used.size % spare.length].e.push([bird, 1, 1]);
      used.add(bird);
    });
  });

DATA.index.birds = Object.keys(DATA.enemies);
  /* A world pool must never list the same bird twice. */
  Object.keys(DATA.worldRoster).forEach((w) => {
    DATA.worldRoster[w] = [...new Set(DATA.worldRoster[w].filter((k) => DATA.enemies[k]))];
  });

  const info = DATA.rarities[r.rarity];
  r.cost = info.cost;
  const s = r.stats || {};
  if (info.statMul !== 1) {
    s.atk = Math.round((s.atk || 0) * info.statMul * 1000) / 1000;
    s.hp = Math.round((s.hp || 0) * info.statMul * 1000) / 1000;
    r.stats = s;
  }
});

DATA.rarityOf = function (relic) {

DATA.relicById = function (id) {

/* Resolve the relic a pig actually wears: equipped id, else their free starter. */

};
DATA.starterRelics = function () {
